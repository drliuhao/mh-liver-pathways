ing. Do not count an unresolved lesion as Class 5.", "refs": ["H-policy"]}], "action": "Confirm the diagnosis before counting the lesion in an HCC MELD-exception request.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "For LR-M imaging or non-HCC histology, establish the tumor type before applying HCC treatment or MELD-exception criteria.", "refs": ["H-aasld"]}], "issues": ["lesion-counting"]}, {"id": "curative-route", "title": "Choose treatment with curative intent", "question": "Is transplantation clinically preferable to a safe, complete resection?", "owner": "HPB surgery · hepatology · transplant surgery", "timing": "After diagnosis; before treatment intended to control HCC while awaiting transplant", "orders": [{"label": "Liver reserve", "items": [{"text": "Bilirubin, albumin, INR, creatinine, sodium, platelets; Child-Pugh and MELD assessment.", "refs": ["H-aasld"]}, {"text": "Ascites, encephalopathy, varices, splenomegaly and other portal-hypertension evidence. Assess ECOG, nutrition and frailty.", "refs": ["H-aasld"]}]}, {"label": "Tumor stage and operation feasibility", "items": [{"text": "Chest CT for initial exception staging; liver CT/MRI for vascular invasion and extrahepatic spread.", "refs": ["H-policy"]}, {"text": "HPB surgical review: ability to remove all tumor, future liver remnant, vascular inflow/outflow and biliary drainage. Record why resection is or is not appropriate.", "refs": ["H-aasld", "H-policy"]}]}], "branches": [{"title": "Resection is a suitable curative option", "criteria": [{"text": "Limited burden, compensated liver, no clinically significant portal hypertension and adequate remnant favor resection. Individual exceptions require HPB judgment.", "refs": ["H-aasld"]}], "action": "Use the HCC cancer roadmap; do not infer a transplant indication from T2 size alone.", "to": null, "kind": "redirect", "refs": []}, {"title": "Early HCC with transplant indication", "criteria": [{"text": "Unresectable in the patient’s liver / equirements are met.", "to": "treatment", "kind": "advance", "refs": []}, {"title": "Pretreatment tumor burden within UNOS downstaging criteria", "criteria": [{"text": "Pretreatment burden — any ONE pattern:", "refs": ["H-policy"], "children": [{"text": "ONE Class 5 lesion: >5 to ≤8 cm.", "refs": ["H-policy"]}, {"text": "TWO / THREE Class 5 lesions: at least one >3 cm, EACH ≤5 cm, and combined diameter ≤8 cm.", "refs": ["H-policy"]}, {"text": "FOUR / FIVE Class 5 lesions: EACH <3 cm and combined diameter ≤8 cm.", "refs": ["H-policy"]}]}], "action": "Plan downstaging, then demonstrate viable burden within T2 size requirements.", "to": "treatment", "kind": "advance", "refs": []}, {"title": "T1: single lesion 1 to <2 cm", "criteria": [{"text": "For a transplant-eligible patient with decompensated cirrhosis and T1 HCC, AASLD advises CT or MRI at least every 3 months until HCC exception criteria are met. Consider immediate liver-directed treatment if AFP is significantly elevated or transplantation is not an appropriate treatment option.", "refs": ["H-aasld", "N-hcc"]}], "action": "T1 HCC does not qualify for HCC MELD-exception points. T1 alone does not rule out liver transplantation. Discuss surveillance versus immediate liver-directed treatment at the multidisciplinary tumor board.", "to": null, "kind": "hold", "refs": []}, {"title": "Beyond standardized downstaging criteria", "criteria": [{"text": "If pretreatment tumor burden exceeded the standardized downstaging limits, an HCC MELD-exception request requires individual NLRB review even after a favorable treatment response.", "refs": ["H-policy", "N-hcc"]}], "action": "Assess transplant suitability, calculated MELD score and donor options separately. Request individual NLRB review if seeking HCC MELD-exception points.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Before submitting a standardized HCC MELD-exception request, resolve Class 5 classification, verify pretreatment tumor burden and confirm ld"]}], "action": "Review the uncertain finding at the multidisciplinary tumor board before deciding on further treatment or transplant readiness.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "New extrahepatic disease or macrovascular tumor invasion prevents a standardized HCC MELD exception and requires reassessment of the transplant plan. Reassess treatment-related liver decompensation before considering further liver-directed treatment.", "refs": ["N-hcc", "H-aasld"]}], "issues": ["bridging", "checkpoint"]}, {"id": "listing", "title": "Review listing and MELD-exception request", "question": "Has the transplant team confirmed clinical suitability, and is the HCC MELD-exception request supported by complete evidence?", "owner": "Named transplant physician · coordinator · pharmacy", "timing": "Before submitting the MELD-exception request and before activating the patient on the transplant waiting list", "orders": [{"label": "Evidence for the HCC MELD-exception request", "items": [{"text": "Baseline and response images, Class 5 assessments, AFP chronology, initial chest CT, LRT record and resection-ineligibility statement.", "refs": ["H-policy"]}, {"text": "For adults, initial request and first extension retain calculated MELD; subsequent eligible extensions receive MMaT−3. Verify current policy at filing.", "refs": ["H-policy"]}]}, {"label": "Clinical safety — a separate decision", "items": [{"text": "Complete the center’s medical, cardiopulmonary, infectious, functional and psychosocial evaluation. An exception does not establish surgical fitness.", "refs": ["H-policy"]}, {"text": "For ICI exposure: agent, last dose, toxicity history and transplant/pharmacy risk plan; distinguish exception consideration from rejection safety.", "refs": ["N-hcc", "H-aasld"]}]}], "branches": [{"title": "Transplant suitability and MELD-exception evidence verified", "criteria": [{"text": "The transplant selection team has accepted the patient for transplantation, the uitability. Preserve treated-lesion history rather than requiring residual enhancement.", "refs": ["H-policy"]}], "action": "Proceed when transplant selection and organ acceptance criteria are met.", "to": "after-transplant", "kind": "advance", "refs": []}, {"title": "Uncertain tumor enhancement or an unexplained AFP change", "criteria": [{"text": "Review technique, prior treatment, viable burden and AFP trajectory together; radiation-treated lesions may need serial interpretation.", "refs": ["H-aasld"]}], "action": "Ask transplant radiology and the tumor board to resolve the uncertain finding before concluding that HCC has progressed or remains controlled.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "If tumor burden or AFP no longer meets the automatic-extension criteria, obtain individual review of the HCC MELD-exception renewal. New metastasis or macrovascular invasion also requires reassessment of transplant suitability.", "refs": ["H-policy", "N-hcc"]}], "issues": ["response-uncertainty"]}, {"id": "after-transplant", "title": "Post-transplant follow-up", "question": "What must be recorded and monitored after transplant?", "owner": "Transplant surgery · pathology · hepatology", "timing": "At explant and long-term follow-up", "orders": [{"label": "Required record", "items": [{"text": "Submit the HCC explant pathology form within 60 days for recipients transplanted with HCC exception priority.", "refs": ["H-policy"]}]}, {"label": "Follow-up plan", "items": [{"text": "Document explant burden, viable tumor, vascular invasion and recurrence-risk assessment. Use cross-sectional abdominal and chest surveillance; choose interval with the transplant team.", "refs": ["H-aasld"]}]}], "branches": [{"title": "Explant and risk plan documented", "criteria": [{"text": "Identify the team responsible for surveillance and the plan for evaluating suspicious findings. No universal optimal surveillance interval is established.", "refs": ["H-aasld"]}], "action": "Co sformation", "question": "Is this still a benign adenoma, or has malignant transformation occurred?", "owner": "Pathology · radiology · hepatology · HPB surgery", "timing": "Whenever malignancy is suspected", "orders": [{"label": "Confirm or exclude malignant transformation", "items": [{"text": "Review interval growth, atypical imaging and available tissue; decide whether additional tissue is needed through MDT.", "refs": ["A-easl"]}, {"text": "If HCC is diagnosed, assess liver background, tumor stage and the HCC MELD-exception criteria. Confirm whether imaging alone is sufficient for diagnosis in that patient.", "refs": ["A-easl", "H-policy"]}]}], "branches": [{"title": "HCA remains the verified diagnosis", "criteria": [{"text": "No unresolved malignant focus; the exceptional indication and expected benefit remain documented.", "refs": ["N-hca", "A-easl"]}], "action": "Review the expected benefit of transplantation and prepare an individual HCA MELD-exception request if appropriate.", "to": "review", "kind": "advance", "refs": []}, {"title": "Malignancy established", "criteria": [{"text": "Cancer type and stage are determined; a benign-HCA label no longer adequately describes the management problem.", "refs": ["A-easl"]}], "action": "Use the correct cancer pathway and seek allocation review.", "to": null, "kind": "redirect", "refs": []}], "stops": [{"text": "Resolve suspected malignancy before selecting a transplant protocol. If HCC is confirmed, assess its diagnostic and staging criteria separately before requesting a standardized HCC MELD exception.", "refs": ["H-policy", "A-easl"]}], "issues": ["transformation"]}, {"id": "review", "title": "Review benefit and submit", "question": "Do the exceptional indication and patient-specific benefit justify transplantation?", "owner": "Transplant selection · benign liver MDT · coordinator", "timing": "Before listing recommendation / submission", "orders": [{"label": "Supporting narrative", "items": [{"text": "Specify the exact guidance alternative, unresectability where required, risk, prior management, molecular evidence and why transplantation is appropriate.", "refs": ["N-hca"]}, {"text": "Guidance supports consideration at MMaT−3. Record the transplant team's clinical decision separately from the NLRB decision on the MELD-exception request.", "refs": ["N-hca"]}]}], "branches": [{"title": "Evidence and clinical selection accepted", "criteria": [{"text": "A specific HCA MELD-exception criterion is supported, and the transplant team's benefit-risk assessment is documented.", "refs": ["N-hca"]}], "action": "Continue surveillance for bleeding, growth or malignant transformation, and complete the final assessment of fitness for transplantation.", "to": "follow-up", "kind": "advance", "refs": []}, {"title": "Selection criteria, supporting evidence or alternatives need review", "criteria": [{"text": "Complete missing supporting evidence. A molecular restriction to a particular exon or another requirement beyond NLRB guidance must be identified as a local selection rule.", "refs": ["A-molecular", "N-hca"]}], "action": "Agree and document the local selection rule before activating the patient on the transplant waiting list.", "to": null, "kind": "hold", "refs": []}], "stops": [], "issues": ["criteria", "benefit"]}, {"id": "follow-up", "title": "Reassess and follow up", "question": "Are complications controlled, and has a team been assigned for long-term follow-up?", "owner": "Transplant team · hepatology · relevant metabolic service", "timing": "While awaiting transplant and after explant review", "orders": [{"label": "Continuity plan", "items": [{"text": "Reassess hemorrhage, progression or transformation while waiting; review explant pathology after transplant.", "refs": ["A-easl", "N-hca"]}, {"text": "Assign follow-up for the underlying metabolic/vascular condition and any incidental malignant finding.", "refs": ["N-hca"]}]}], "branches": [{"title": "Transplant suitability confirmed and follow-up team assigned", "criteria": [{"text": "No unresolved acute safety or diagnostic barrier; surveillance/long-term care schedule is locally agreed.", "refs": ["N-hca"]}], "action": "Proceed to transplantation under the approved program when clinically appropriate, then continue follow-up for the underlying condition.", "to": null, "kind": "advance", "refs": []}], "stops": [], "issues": ["ownership"]}], "issues": [{"id": "subtype", "question": "What evidence is sufficient to call an adenoma β-catenin activated?", "comparisons": [{"ref": "A-easl", "text": "identification of β-catenin activated HCA", "quote": true, "locator": "Imaging limitation, PDF p.9"}, {"ref": "A-molecular", "text": "Molecular subtypes carry different bleeding and transformation risks; imaging is not equivalent to a mutation result.", "quote": false, "locator": ""}], "proposal": "Record pathology/molecular method and specific result when it drives management; do not infer β-catenin status from MRI.", "rationale": "Risk labels should be anchored to the test that supports them.", "owners": "Pathology · radiology", "record": "HCA G1", "status": "Discussion required — not yet approved"}, {"id": "alternatives", "question": "When have conventional management options been adequately assessed?", "comparisons": [{"ref": "A-easl", "text": "HCA resection is recommended irrespective of size in men", "quote": true, "locator": "Recommendation, PDF p.9"}, {"ref": "N-hca", "text": "Unresponsive to non-operative management", "quote": true, "locator": "One component of the fourth alternative"}], "proposal": "Document the patient-specific resection/local-treatment assessment and response to appropriate risk-factor changes; distinguish inability from treatment failure.", "rationale": "Not every guidance alternative requires failure of every available treatment.", "owners": "Benign liver MDT · HPB surgery · IR", "record": "HCA G2", "status": "Discussion required — not yet approved"}, {"id": "criteria", "questi  "N-hca", "text": "Unresectable adenoma with β-catenin mutation", "quote": true, "locator": "Second alternative"}, {"ref": "A-molecular", "text": "Molecular risk is heterogeneous; exon-specific risk information can inform but does not rewrite NLRB guidance.", "quote": false, "locator": ""}], "proposal": "If the group chooses a narrower molecular rule, record its rationale and label it institutional rather than OPTN/NLRB mandated.", "rationale": "A prognostic refinement should not silently become an allocation rule.", "owners": "Molecular pathology · transplant governance", "record": "HCA G5", "status": "Discussion required — not yet approved"}, {"id": "ownership", "question": "Who is responsible for waiting-list complication management and long-term follow-up?", "comparisons": [{"ref": "N-hca", "text": "Guidance describes exceptional indications and score consideration, not a universal post-LT follow-up schedule.", "quote": false, "locator": ""}, {"ref": "A-easl", "text": "Management depends on bleeding, growth, subtype and clinical context.", "quote": false, "locator": ""}], "proposal": "Assign surveillance and urgent-bleeding contacts, explant review and underlying-disease follow-up owners.", "rationale": "A rare indication still requires an explicit operational handoff.", "owners": "Transplant team · hepatology · metabolic service", "record": "HCA G6", "status": "Discussion required — not yet approved"}], "protocol": "/mh-liver-pathways/transplant/protocols/hca_v3_protocol.docx", "docs": [{"label": "Decision document", "url": "/mh-liver-pathways/transplant/docs/07_Hepatic_Adenoma_Alignment_Meeting_Decision_Document_2026-10-16_v3.docx"}, {"label": "Alignment worksheet", "url": "/mh-liver-pathways/transplant/docs/07_Hepatic_Adenoma_Guideline_Alignment_Worksheet_2026-10-16_v3.docx"}]}], "sources": {"NCCN-hcc": {"short": "NCCN · HCC v2.2026", "title": "NCCN Hepatocellular Carcinoma — treatment and response reassessment", "kind": "Clinical guidance", "locator": "Versi
