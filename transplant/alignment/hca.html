cy"]}], "action": "Resolve diagnosis before using that observation for an exception.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "LR-M or non-HCC histology: do not advance through the HCC pathway; establish the correct diagnosis.", "refs": ["H-aasld"]}], "issues": ["lesion-counting"]}, {"id": "curative-route", "title": "Choose treatment with curative intent", "question": "Is transplantation clinically preferable to a safe, complete resection?", "owner": "HPB surgery · hepatology · transplant surgery", "timing": "After diagnosis; before committing to bridge therapy", "orders": [{"label": "Liver reserve", "items": [{"text": "Bilirubin, albumin, INR, creatinine, sodium, platelets; Child-Pugh and MELD assessment.", "refs": ["H-aasld"]}, {"text": "Ascites, encephalopathy, varices, splenomegaly and other portal-hypertension evidence. Assess ECOG, nutrition and frailty.", "refs": ["H-aasld"]}]}, {"label": "Tumor stage and operation feasibility", "items": [{"text": "Chest CT for initial exception staging; liver CT/MRI for vascular invasion and extrahepatic spread.", "refs": ["H-policy"]}, {"text": "HPB review: achievable clearance, future liver remnant, inflow/outflow and biliary drainage; record why resection is or is not appropriate.", "refs": ["H-aasld", "H-policy"]}]}], "branches": [{"title": "Resection is a suitable curative option", "criteria": [{"text": "Limited burden, compensated liver, no clinically significant portal hypertension and adequate remnant favor resection. Individual exceptions require HPB judgment.", "refs": ["H-aasld"]}], "action": "Use the HCC cancer roadmap; do not infer a transplant indication from T2 size alone.", "to": null, "kind": "redirect", "refs": []}, {"title": "Early HCC with transplant indication", "criteria": [{"text": "Unresectable in the patient’s liver / anatomy, or early HCC with clinically significant portal hypertension or decompensation; transplant fitness must also be established.", "refs": ["H-aasld"]}], "action": "Screen the allocation route separately.", "to": "allocation", "kind": "advance", "refs": []}], "stops": [{"text": "Active extrahepatic HCC, macrovascular tumor invasion or ruptured HCC: stop the standard HCC exception route. Selected previously treated rupture/portal-branch invasion needs separate nonstandard review, not automatic advancement.", "refs": ["N-hcc"]}], "issues": ["curative-route", "beyond-downstaging"]}, {"id": "allocation", "title": "Check MELD-exception criteria", "question": "Does pretreatment tumor burden fit T2 or the standardized downstaging criteria?", "owner": "Transplant radiology · coordinator · hepatology", "timing": "Use pretreatment CT/MRI, not only the post-treatment scan", "orders": [{"label": "Baseline record", "items": [{"text": "Count qualifying Class 5 lesions and record each diameter before LRT. Keep indeterminate observations separate.", "refs": ["H-policy"]}, {"text": "Record current AFP and whether AFP has EVER exceeded 1,000 ng/mL.", "refs": ["H-policy"]}]}], "branches": [{"title": "T2 + AFP requirements", "criteria": [{"text": "Tumor burden — either of these patterns:", "refs": ["H-policy"], "children": [{"text": "ONE Class 5 lesion: 2–5 cm.", "refs": ["H-policy"]}, {"text": "OR TWO / THREE Class 5 lesions: EACH 1–3 cm.", "refs": ["H-policy"]}]}, {"text": "AND the applicable AFP rule:", "refs": ["H-policy"], "children": [{"text": "Never above 1,000 ng/mL: current AFP ≤1,000.", "refs": ["H-policy"]}, {"text": "Previously >1,000: after treatment, AFP must fall below 500 and remain below 500.", "refs": ["H-policy"]}]}], "action": "Proceed with listing workup and bridge planning if otherwise eligible.", "to": "treatment", "kind": "advance", "refs": []}, {"title": "Within downstaging criteria", "criteria": [{"text": "Pretreatment burden — any ONE pattern:", "refs": ["H-policy"], "children": [{"text": "ONE Class 5 lesion: >5 to ≤8 cm.", "refs": ["H-policy"]}, {"text": "TWO / THREE Class 5 lesions: at least one >3 cm, EACH ≤5 c culated MELD; subsequent eligible extensions receive MMaT−3. Verify current policy at filing.", "refs": ["H-policy"]}]}, {"label": "Clinical safety — a separate decision", "items": [{"text": "Complete the center’s medical, cardiopulmonary, infectious, functional and psychosocial evaluation. An exception does not establish surgical fitness.", "refs": ["H-policy"]}, {"text": "For ICI exposure: agent, last dose, toxicity history and transplant/pharmacy risk plan; distinguish exception consideration from rejection safety.", "refs": ["N-hcc", "H-aasld"]}]}], "branches": [{"title": "Both tracks cleared", "criteria": [{"text": "Transplant selection accepts medical candidacy and coordinator verifies the correct exception route; pending issues have explicit disposition.", "refs": ["H-policy"]}], "action": "List/maintain candidacy and schedule surveillance.", "to": "waitlist", "kind": "advance", "refs": []}, {"title": "An approval or safety assessment is missing", "criteria": [{"text": "A favorable tumor response does not replace transplant selection or resolve ICI-related risk.", "refs": ["H-aasld"]}], "action": "Hold activation/filing as appropriate; assign an owner and review date.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Do not treat a pending exception, unapproved local deviation or an unresolved major safety issue as clearance to transplant.", "refs": ["H-policy"]}], "issues": ["checkpoint", "ownership"]}, {"id": "waitlist", "title": "Reassess to transplant", "question": "Does the candidate still satisfy clinical and allocation requirements?", "owner": "Transplant MDT · coordinator", "timing": "At each extension, new finding and organ-offer review", "orders": [{"label": "Renewal and final review", "items": [{"text": "Updated multiphase CT/MRI tumor stage, AFP and treatment details for extension. Chest CT is not mandated for every HCC extension; order clinically indicated metastatic reassessment.", "refs": ["H-policy"]}, {"text": "Review liver reserve, infection, new treatment exposure and any unexplained biomarker or imaging change.", "refs": ["H-aasld"]}]}], "branches": [{"title": "Control maintained", "criteria": [{"text": "Qualifying burden/AFP, no new spread and continued clinical suitability. Preserve treated-lesion history rather than requiring residual enhancement.", "refs": ["H-policy"]}], "action": "Proceed when transplant selection and organ acceptance criteria are met.", "to": "after-transplant", "kind": "advance", "refs": []}, {"title": "Equivocal enhancement or AFP drift", "criteria": [{"text": "Review technique, prior treatment, viable burden and AFP trajectory together; radiation-treated lesions may need serial interpretation.", "refs": ["H-aasld"]}], "action": "Hold the disputed conclusion and document MDT adjudication.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Progression beyond automatic-extension criteria or disqualifying AFP: stop automatic renewal and obtain formal review. New metastasis/macrovascular disease stops the standard route.", "refs": ["H-policy", "N-hcc"]}], "issues": ["response-uncertainty"]}, {"id": "after-transplant", "title": "Post-transplant follow-up", "question": "What must be recorded and monitored after transplant?", "owner": "Transplant surgery · pathology · hepatology", "timing": "At explant and long-term follow-up", "orders": [{"label": "Required record", "items": [{"text": "Submit the HCC explant pathology form within 60 days for recipients transplanted with HCC exception priority.", "refs": ["H-policy"]}]}, {"label": "Follow-up plan", "items": [{"text": "Document explant burden, viable tumor, vascular invasion and recurrence-risk assessment. Use cross-sectional abdominal and chest surveillance; choose interval with the transplant team.", "refs": ["H-aasld"]}]}], "branches": [{"title": "Explant and risk plan documented", "criteria": [{"text": "Named surveillance owner and an explicit plan for suspicious findings; no universal optimal surveillance interval is established.", "refs": ["H-aasld"]}], "action": "Continue risk-adapted follow-up; route recurrence to oncology.", "to": null, "kind": "advance", "refs": []}], "stops": [], "issues": ["ownership"]}], "issues": [{"id": "lesion-counting", "question": "Which observations count, and when should LR-4 be biopsied?", "comparisons": [{"ref": "H-policy", "text": "LI-RADS 5 classification on CT, MRI, or CEUS", "quote": true, "locator": "Table 9-9, p.198"}, {"ref": "H-aasld", "text": "repeat imaging with contrast-enhanced MRI or multiphasic CT within 3 months or immediate biopsy", "quote": true, "locator": "Guidance statement 20, PDF p.13"}], "proposal": "Do not count unresolved LR-4/indeterminate lesions as Class 5. If immediate diagnosis changes treatment or allocation, discuss biopsy rather than waiting by default.", "rationale": "A diagnostic probability is not the same as an allocation-qualifying lesion.", "owners": "Radiology · hepatology · transplant surgery", "record": "HCC G1", "status": "Discussion required — not ratified"}, {"id": "curative-route", "question": "When should uncertain portal hypertension change resection versus transplant?", "comparisons": [{"ref": "H-aasld", "text": "without clinically significant portal hypertension, and an adequate FLR", "quote": true, "locator": "Resection recommendation, PDF p.18"}, {"ref": "H-policy", "text": "An indication that the candidate is not eligible for resection", "quote": true, "locator": "§9.5.I.i, p.196"}], "proposal": "Use liver reserve, portal-hypertension evidence and technical remnant assessment first. Obtain invasive hemodynamics only when the result could change the operation.", "rationale": "Allocation documentation does not substitute for a surgical risk-benefit decision.", "owners": "HPB surgery · hepatology", "record": "HCC G2", "status": "Discussion required — not ratified"}, {"id": "beyond-downstaging", "question": "What requires nonstandard review: burden, prior rupture or portal-branch ese agents at least 3 months prior to LT", "quote": true, "locator": "ICI discussion, PDF p.20"}], "proposal": "Explicitly discuss the AASLD 3-month recommendation, agent/last dose, rejection risk and urgency. Any departure needs a documented multidisciplinary rationale; no washout guarantees safety.", "rationale": "The prior website understated AASLD wording. Allocation eligibility and transplant safety are different questions.", "owners": "Transplant oncology · pharmacy · transplant surgery", "record": "HCC G4", "status": "Discussion required — not ratified"}, {"id": "ownership", "question": "Who signs clinical clearance, exception verification and surveillance?", "comparisons": [{"ref": "H-policy", "text": "Policy specifies the exception evidence and explant reporting. It does not assign our local team members.", "quote": false, "locator": ""}, {"ref": "H-aasld", "text": "Clinical guidance supports post-transplant surveillance, but the optimal interval and duration remain uncertain.", "quote": false, "locator": ""}], "proposal": "Name a transplant physician, allocation coordinator and post-transplant surveillance owner; record each decision separately.", "rationale": "A completed allocation packet is not a clinical approval.", "owners": "Transplant leadership · coordinator", "record": "HCC G5 / G6", "status": "Discussion required — not ratified"}, {"id": "response-uncertainty", "question": "How should equivocal post-treatment enhancement or borderline AFP be handled?", "comparisons": [{"ref": "H-policy", "text": "Extension rules use tumor stage, treatment and AFP; the prior >1,000 AFP history changes the applicable threshold.", "quote": false, "locator": ""}, {"ref": "H-aasld", "text": "Interpret viable tumor and treatment response with imaging and clinical context; no single equivocal appearance establishes progression.", "quote": false, "locator": ""}], "proposal": "Request transplant-radiology adjudication and a dated follow-up plan. Document whether the issue ertain origin", "criteria": [{"text": "A proximal stricture is not automatically perihilar CCA. Clarify anatomy rather than applying the hilar protocol by default.", "refs": ["C-aasld"]}], "action": "Use the appropriate cancer roadmap or diagnostic MDT.", "to": null, "kind": "hold", "refs": []}], "stops": [], "issues": ["anatomy"]}, {"id": "diagnosis", "title": "Plan diagnostic sampling", "question": "Can diagnosis and nodal staging be completed without transperitoneal biopsy of the primary tumor?", "owner": "Advanced GI · transplant/HPB surgery", "timing": "Before EUS-guided or percutaneous sampling", "orders": [{"label": "Primary-stricture workup", "items": [{"text": "ERCP cholangiography with brush cytology, FISH/aneuploidy assessment and intraductal biopsy as clinically appropriate; plan drainage with the treating team.", "refs": ["C-aasld", "P-policy"]}, {"text": "Interpret CA 19-9 after addressing cholangitis/obstruction; >100 U/mL is a policy diagnostic alternative only in the absence of cholangitis.", "refs": ["P-policy", "C-aasld"]}]}, {"label": "Nodal staging", "items": [{"text": "Consider EUS sampling of suspicious regional lymph nodes without passing through the primary tumor. Record exactly what was sampled and the needle path.", "refs": ["P-policy"]}]}], "branches": [{"title": "Malignant-appearing stricture + ≥1 policy criterion", "criteria": [{"text": "At least ONE diagnostic alternative:", "refs": ["P-policy"], "children": [{"text": "Biopsy or cytology demonstrates malignancy.", "refs": ["P-policy"]}, {"text": "CA 19-9 >100 U/mL, in the absence of cholangitis.", "refs": ["P-policy"]}, {"text": "Aneuploidy.", "refs": ["P-policy"]}, {"text": "Hilar mass <3 cm in radial diameter.", "refs": ["P-policy"]}]}], "action": "Check size, resectability and dissemination criteria.", "to": "phenotype", "kind": "advance", "refs": []}, {"title": "Suspicion remains but criteria are incomplete", "criteria": [{"text": "Negative brushing does not exclude CCA. Review repeat intraductal sampling / interval evaluation in MDT.", "refs": ["C-aasld"]}], "action": "Do not pursue a transperitoneal primary biopsy simply to improve yield.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Avoid EUS/percutaneous/operative transperitoneal aspiration or biopsy of the primary. If already performed, stop automatic pathway advancement and obtain transplant-program review of the seeding risk.", "refs": ["P-policy", "C-aasld"]}], "issues": ["sampling"]}, {"id": "phenotype", "title": "Check protocol criteria", "question": "Are disease extent, size and resectability compatible with this protocol?", "owner": "Transplant radiology · HPB surgery · coordinator", "timing": "Before enrollment / initial exception", "orders": [{"label": "Eligibility record", "items": [{"text": "Document unresectability due to technical anatomy or underlying liver disease. If there is a mass, it must be single and <3 cm radially, perpendicular to the duct.", "refs": ["P-policy"]}, {"text": "Chest/abdomen cross-sectional staging must exclude intrahepatic and extrahepatic metastases within 90 days before the initial request.", "refs": ["P-policy"]}]}], "branches": [{"title": "All disease criteria satisfied", "criteria": [{"text": "Hilar diagnostic criteria + unresectability + permitted tumor size and distribution + no metastatic disease; general transplant fitness remains a separate review.", "refs": ["P-policy"]}], "action": "Enter the approved integrated neoadjuvant program.", "to": "neoadjuvant", "kind": "advance", "refs": []}, {"title": "Exactly 3 cm, measurement disagreement or resectable disease", "criteria": [{"text": "OPTN uses <3 cm, not ≤3 cm. Duct length does not replace radial measurement.", "refs": ["P-policy"]}], "action": "Re-review imaging and the clinical resection option; do not assume automatic exception eligibility.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Confirmed regional hepatic nodal, intrahepatic metastatic or extrah
