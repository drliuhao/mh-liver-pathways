iven listing, exclusion, exception priority, organ acceptance, LDLT selection or treatment change before external validation and prospective impact review.", "Require a locked reproducible formula and data dictionary, clarification of the MELD/AFP definitions and time zero, independent external calibration and utility testing against current care, equity assessment, and appropriate policy authorization before deployment.", "Do not extrapolate the within-Milan, non-LDLT model to PVTT, LDLT or other cancers. No numerical score cutoff is proposed because its clinical use is not yet justified."], "tests": "Reproducible model code; independent cohort; time-dependent transplant analysis; competing-event definitions; calibration, utility and subgroup audit.", "allocation": "Neither a model estimate nor an internal committee can independently rewrite national allocation priority.", "references": ["round2_liu", "hcc_liu2025", "hcc_lai2017", "hcc_goudsmit2023", "hcc_allen2024", "hcc_prosepe2026"], "evidence": {"synthesis": "Benefit modeling is clinically important because acceptable post-LT survival alone ignores deaths or progression without transplantation. However, a prognostic model, a causal benefit estimate and an allocation policy are different products. High internal discrimination or correlation cannot establish calibration, appropriate treatment-time handling, fairness or improved decisions. The existing score should therefore be studied, not used to override eligibility or priority. The UK experience provides a constructive precedent for eventual governed implementation after population-specific validation and policy integration.", "counterevidence": "The UK implementation and longitudinal causal methods show that benefit-based allocation need not remain hypothetical. Favorable internal performance and the larger-benefit signal at higher tumor burden justify further evaluation, not automatic adoption. Conversely, an imputed nontransplant counterfactual, recipient-only scope or overlapping registry sample cannot serve as independent validation. The proper critique is specific to estimand, calibration and transport—not a blanket claim that observational modeling is invalid or that time-dependent LT was never considered.", "certainty": "Moderate that benefit-based allocation is feasible within an established national governance system; low that any particular observational score improves individual HCC decisions; very low for deployment of the 2026 Liu score in expanded-risk/PVTT/LDLT patients. No independent prospective impact or external high-risk calibration study of that exact score was identified in this bounded search.", "threshold_basis": "Zero current decision weight is a proposed governance rule, not a published numerical efficacy threshold. No arbitrary calibration/C-index cutoff is endorsed here. Acceptance criteria should be prespecified with biostatistics and allocation stakeholders using clinically meaningful calibration error, decision consequences and equity, then independently tested. Findings in within-Milan DDLT cannot simply be extrapolated to PVTT or LDLT.", "policy_context": "A locally developed survival-benefit score does not change OPTN allocation policy or authorize exception priority; deployment requires separate clinical and policy governance.", "studies": [{"key": "round2_liu", "design_population": "SRTR 2002–2022 HCC cohort restricted to Milan: 30,565 candidates, randomly split into development 15,282 and internal validation 15,283. Table 1 records 19,997 LT and 8,249 dropout events.", "selection": "DDLT pathway; LDLT excluded. The 30,565 are not all transplanted recipients despite inconsistent Methods wording.", "results": "Proposed score: 0.65×(C-MELD−6)+1.99×(TBS−2.25)+0.68×log2(AFP). Reported internal correlation .93, R² .87 and C-index .91.", "limits": "Internal split is not external validation. Abstract refers to MELD 3.0 while Methods §1.6 gives an original-MELD formulation; authors/code clarification is needed. Listing versus post-LT time origins, benefit units and model implementation require reproducibility audit. These are audit questions, not proof of a specific bias. No validated transport to PVTT, LDLT or other cancers.", "locator": "Complete local PDF pp2–5, §§1.3, 1.6, 1.8 and 2.3, Table 1."}, {"key": "hcc_liu2025", "design_population": "SRTR HCC-exception candidates 2002–2019, follow-up to December 2023: 36,634 candidates; 24,457 transplanted, 9,582 dropout.", "selection": "Tumor burden score is √(largest diameter²+number²), grouped ≤3, 3.1–5 and >5. At listing, 91% were within Milan, 5.3% within UCSF but outside Milan, 3.6% beyond UCSF.", "results": "Five-year unadjusted restricted-mean survival benefit was 15.7/22.1/25.0 months across increasing TBS groups. Adjusted five-year survival-probability differences were 21.9/34.5/39.4 percentage points. These are different measures, not interchangeable units.", "limits": "Overlapping SRTR population is not independent validation of the 2026 score. Methods explicitly report time-dependent LT modeling; do not falsely accuse the study of ignoring treatment timing. Counterfactual assumptions and differing clocks still require scrutiny.", "locator": "Complete local 13-page PDF, pp4–6, cohort/Table 1 and statistical methods."}, {"key": "hcc_lai2017", "design_population": "European ten-center HCC listing cohort, 1987–2015: 2,103 listed, 1,857 transplanted; 636 outside Milan at listing.", "selection": "Benefit stratification used MELD, AFP, Milan status and radiological response.", "results": "The model classified 405/2,103 (19.2%) as no-benefit and 108/2,103 (5.1%) as large-benefit, the latter with a modeled 60-month difference.", "limits": "Non-LT counterfactual survival was imputed using MESIAH at the final LT/dropout assessment, not observed in a comparable randomized untreated group. Historical treatment eras and modeling assumptions limit transport. The paper's proposal to delist the no-benefit group is not independently validated clinical utility.", "locator": "New complete 10-page PDF, Methods pp1911–1913, especially p1912 (PDF p3), outcome tables."}, {"key": "hcc_goudsmit2023", "design_population": "UNOS 2010–April 2019, adult first-LT population; recipient table: 24,503 non-HCC, 6,922 T2 and 5,448 initially outside criteria.", "selection": "Excluded LDLT and non-HCC exceptions; longitudinal two-week sequential-trial approach with inverse-probability censoring weights; 67%/33% internal split.", "results": "Estimated mean benefit over five years from LT was 2.30 years for non-HCC, 1.19 for T2 and 1.45 for initially outside-criteria HCC.", "limits": "The calculator is explicitly for patients who actually underwent transplant and met study criteria; it does not directly validate prioritizing every waiting candidate. No external test in PVTT or high-risk LDLT. Do not equate an average-on-treated estimand with conditional benefit for the whole waiting list.", "locator": "Primary full HTML, Methods and Tables 1–2, PMC10685016; PDF download unavailable."}, {"key": "hcc_allen2024", "design_population": "UK national liver-offering policy evaluation: separate simulation dataset of 1,287 registrations/629 donors plus early real-world NLOS implementation, 2018–2020.", "selection": "Transplant-benefit scoring governed national deceased-donor offers; not a high-risk-HCC validation sample.", "results": "Simulation compared observed 2013 deaths/removals 93 (7%) and 4,581 patient-years with modeled TBS outcomes 48 (4%) and 5,262 patient-years. During the first two implementation years, 68% of DBD livers were allocated by TBS; observed waitlist mortality decreased (P<.0001), postlisting survival improved (P=.005), with no adverse post-LT survival signal.", "limits": "Simulated gains are not observed outcomes. Before/after implementation is nonrandomized and can reflect secular changes. Nonetheless it is meaningful evidence that a governed benefit-based system can be deployed, unlike a claim that all such models are unusable.", "locator": "Primary abstract and full publisher Methods/Results, Table 3, DOI 10.1016/j.jhep.2024.03.020; PDF pending."}, {"key": "hcc_prosepe2026", "design_population": "Methods study with simulation and Eurotransplant cirrhosis cohort, 2007–2019: 9,868 candidates; 4,998 LT, 3,013 deaths before LT, 1,361 deaths within three years after LT.", "selection": "Conditional three-year restricted-mean benefit at each available graft; sequential marginal structural models and time-varying treatment weighting account for candidate and donor characteristics.", "results": "The in-sample allocation exercise estimated 0.46 additional life-years per graft versus MELD allocation.", "limits": "Modeled, not observed implementation benefit; not HCC-specific validation. Identification requires consistency, exchangeability, positivity and correct models. The whole-waitlist conditional estimand differs from average benefit among actual recipients.", "locator": "Complete local 15-page PDF, §§4–5, pp9–12; DOI 10.1177/09622802261420699."}]}}], "documents": [{"label": "V12 high-risk protocol · DOCX", "url": "/mh-liver-pathways/evidence/2026-10-25/docs/01_HCC_High_Risk_Protocol_v12.docx", "format": "docx"}]}, "pcca": {"name": "Perihilar cholangiocarcinoma", "reviews": [{"id": "pCCA-B1", "anchor": "pcca-b1", "title": "Tumor size, biopsy history or previously malignant nodes", "status": "Expansion remains closed", "steps": ["diagnosis", "phenotype", "staging"], "context": "Review exact radial size, the route of any primary-tumor biopsy, and the full nodal history. These proposed expansions remain closed.", "stance": "Keep size expansion, primary transperitoneal-biopsy exposure and cleared malignant nodes as three separate closed transplant strata.", "rules": ["For the conventional standardized-exception mass criterion, retain a single mass <3.0 cm in radial diameter. Exactly 3.0 cm is not rounded down; obtain central measurement review. Do not activate a 3–5 cm expansion.", "Exclude any prior transperitoneal primary-tumor biopsy exposure from the initial transplanting study. Record trajectory and whether pathology was positive, negative or nondiagnostic; this is a conservative selection rule, not proof of dissemination in every exposed patient.", "Exclude previously proven malignant nodes from the initial transplant cohort even after radiographic/pathologic clearance. Nodal EUS sampling that does not traverse the primary is distinct from primary-tumor biopsy. Do not combine these excluded categories in one expansion cohort."], "tests": "Original MRI/MRCP or CT with perpendicular radial measurement; full biopsy reports/needle trajectory; node station and original pathology; operative staging plan; resection assessment. Record whether EUS sampled a regional node or traversed the primary mass, the route, pathology result and date. These are not equivalent exposures.", "allocation": "Clinical review, standardized exception eligibility and research expansion are separate. A favorable response or living donor does not erase the original size/biopsy/node history.", "references": ["optn", "heimbach", "murad", "pcca_murad_predictors", "pcca_aveson", "soliman", "pcca_dong"], "evidence": {"synthesis": "Size, biopsy exposure and nodal biology must remain separate. Larger-mass LT has directly unfavorable recurrence data. Biopsy evidence is conflicting across settings, so the mechanism is plausible and current policy is restrictive, but an inevitable-seeding claim is unjustified. No reviewed study validates a cleared-node rescue stratum. Imaging-negative nodes do not equal pathological clearance.", "counterevidence": "Aveson challenges a universal causal inference from Heimbach. Absence of PM in nine negative TP-FNA cases does not establish safety. Soliman's occult-node recipients do not validate deliberate nodal expansion. The exact 3.0-cm boundary is a current policy boundary, not a biological discontinuity proven by these studies.", "certainty": "Moderate confidence that conventional selection yields better observed outcomes; low certainty for causal effects of size and biopsy; very low/no direct evidence for a previously positive-node clearance pathway.", "threshold_basis": "POLICY: OPTN 9.5. A specifies radial mass < 3 cm, unresectability, NAT and staging; primary TP-biopsy must be avoided. STUDY: >3 cm associated with lower RFS; positive TP-FNA associated with PM in a very small LT cohort. LOCAL: closing all prior-biopsy and cleared-node strata is a conservative first-study choice, not proof of universal futility.", "studies": [{"key": "murad", "design_population": "Retrospective 12-US-center NAT-to-LT cohort; 287 entered, 71 dropped out, 214 transplanted.", "selection": "Mostly conventional localized unresectable/PSC-associated pCCA. The expanded subgroup included larger tumors and other departures from eligibility.", "results": "From treatment-pathway entry, 2-/5-year OS was 68%/53%; post-LT 2-/5-year recurrence-free survival 78%/65%. Among 21 transplanted patients with masses >3 cm, 5-year RFS was 32% versus 69% for smaller tumors. The combined outside-criteria group had recurrence hazard ratio 2.98.", "limits": "Larger tumors were not randomized. Composite outside-criteria effect cannot be assigned separately to size, biopsy or metastasis. Small >3-cm recipient subset; selection and center effects.", "locator": "Gastroenterology 2012; 143: 88–98.e 3; Results, patient flow and selection-criteria recurrence analyses; local full PDF."}, {"key": "pcca_murad_predictors", "design_population": "Mayo 1993–2010; 199 protocol entrants, 62 dropouts, 131 local LT and six elsewhere.", "selection": "Localized unresectable disease; historical size definitions were not identical to current policy.", "results": "Dropout predictors included >3-cm mass (adjusted HR 2.14, 95% CI 1.08–4.24), CA19-9≥ 500 (HR 2.29), positive/suspicious intraluminal sampling (HR 3.63) and MELD ≥ 20 (HR 3.48). Local recipients had 26 recurrences; 5-year OS 71%, RFS 68% from LT.", "limits": "Strong overlap with Murad multicenter and Heimbach cohorts; not independent replication. These are prognostic associations, not validated universal exclusion thresholds.", "locator": "Hepatology 2012; 56: 972–981; Tables 2–3 and Transplantation/Recurrence sections."}, {"key": "heimbach", "design_population": "191 NAT-to-LT protocol entrants; 16 underwent primary-tumor TP-FNA.", "selection": "13 percutaneous and three EUS primary-tumor biopsies; not EUS nodal staging.", "results": "Peritoneal metastases at staging: 5/6 with positive TP-FNA versus 14/175 without TP-FNA; 9 negative TP-FNA patients had none; one result was equivocal.", "limits": "Only six positive biopsies. Nonrandom sampling and more obvious tumor may confound association. Negative-biopsy subgroup is far too small to establish safety or equivalence.", "locator": "HPB 2011; 13: 356–360; Results and biopsy/staging table; local complete PDF."}, {"key": "pcca_aveson", "design_population": "MSK retrospective planned-resection cohort 1991–2014; 262 patients, 37 TP biopsy versus 225 intraluminal/no biopsy.", "selection": "Resection/exploration setting rather than NAT-to-LT. Median biopsy-to-surgery interval 32 versus 38 days.", "results": "Peritoneal metastases at surgery 5.4% versus 7.6%; among 243 initially PM-negative patients, 2-year cumulative PM 20.3% versus 20.1%(p=.7).", "limits": "Direct counterevidence to universal biopsy-seeding claims, but shorter exposure interval, no LT waiting/immunosuppression comparison and only 37 exposed patients. Does not overturn allocation policy.", "locator": "HPB 2022; 24: 942–949; Methods, Results and cumulative-incidence analysis."}, {"key": "soliman", "design_population": "Houston recipient-only NAT comparison; 27 LT, 26 analyzed after one treatment-intolerance exclusion.", "selection": "Pre-LT radiological criteria and staging excluded known nodal/extrahepatic disease; six nevertheless had N1/N2 on explant.", "results": "Occult positive nodes in 6/26(23.1%); nodal disease associated with worse OS and RFS. Nine recurrences overall; main-text 1-/3-year OS 83.0%/52.3% from LT.", "limits": "Occult nodes discovered after LT are not evidence supporting knowingly positive nodes cleared by therapy. No all referred or all-treated denominator. Abstract/body OS rounding differs; use full Results values.", "locator": "Transplant Direct 2025; 11: e 1760; Tables 2–4, Recipient Posttransplant Outcomes, Figure 2."}, {"key": "pcca_dong", "design_population": "Mayo de-novo pCCA 1993–2023; 127 analyzed LT-pathway entrants, 52 dropouts, 75 LT.", "selection": "Protocol staged localized tumors; PSC excluded.", "results": "Dropouts included 15 with regional nodal metastases and 34 with distant metastases; three medical deterioration.", "limits": "Provides the consequence of detecting nodes, not outcomes of clearing them and transplanting. Overlaps historical Mayo cohorts.", "locator": "Hepatology 2026; institutional protocol, patient-flow Figure 1 and Results; local full PDF."}]}}, {"id": "pCCA-B2", "anchor": "pcca-b2", "title": "Resection remains a potentially curative option", "status": "Resection assessment", "steps": ["phenotype"], "context": "If complete resection may be feasible, compare it with the transplant strategy before entering a transplant study.", "stance": "Use resection first when an R0 operation and an adequate functional remnant are feasible.", "rules": ["Proposed planning target for cholestatic/cirrhotic liver: FLR/TLV >40%, combined with function, drainage and infection assessment. Volume alone never establishes operative safety; 40% is not an OPTN requirement.", "If insufficient remnant is the only barrier, assess selective drainage and augmentation/PVE; reassess remnant volume and function about 2–4 weeks after PVE. Vascular reconstruction or PVE need alone does not prove unresectability.", "Return to LT eligibility review only if an R0 resection remains infeasible or unsafe after reasonable optimization. Do not transplant otherwise resectable de novo pCCA outside a specifically approved comparative study."], "tests": "Two specialist HPB/transplant reviews; vascular/ductal map; CT volumetry; functional assessment where available; cholangitis/drainage status; PVE response and reconstruction plan.", "allocation": "Policy 9.5.A requires unresectability from technical considerations or underlying liver disease; comparative recipient survival alone does not satisfy this requirement.", "references": ["pcca_dong", "cirse", "pcca_ethun", "pcca_vugts", "pcca_olthof_pve", "murad"], "evidence": {"synthesis": "Evidence supports LT as a serious option for carefully selected unresectable pCCA. It does not resolve LT versus feasible optimized R 0 resection. Ethun favors LT even after restricted ITT analysis, whereas Dong loses statistical advantage when dropout is counted. Neither randomization nor comparable entry clocks remove the confounding. PVE can materially change the surgical risk assessment.", "counterevidence": "Do not cite Dong's nonsignificant ITT p-value as equivalence or proof that resection must always be better. Conversely, recipient-only LT survival cannot erase donor opportunity cost, NAT dropout and wait-list hazards. Reconstructible vascular involvement or a correctable small FLR alone is not proof of permanent unresectability.", "certainty": "Low comparative certainty; stronger but still nonrandomized evidence for FLR optimization before declaring resection unsafe.", "threshold_basis": "POLICY: standardized pCCA exception requires unresectability or underlying liver disease. STUDY: PVE growth was assessed at median 22 days in the matched study; comparisons remain observational. GUIDANCE: CIRSE supports higher remnant targets in cholestatic/cirrhotic liver. LOCAL: >40% planning target, reassessment 2–4 weeks and required expert review are workflow proposals; inadequate function/infection can prevent surgery despite adequate volume.", "studies": [{"key": "pcca_dong", "design_population": "Single-center 1993–2023 de-novo pCCA; 288 intended resection (207 resected, 81 dropout) and 127 intended NAT/LT(75 LT, 52 dropout).", "selection": "Resection required attainable R 0 and sufficient FLR; PVE and vascular reconstruction were used. LT recipients were selected for unresectability and conventional tumor biology.", "results": "As-treated median OS: LT 78 months, resection without vascular resection 58.2, with vascular resection 25.8; 5-year 58.6%, 49.6%, 26.7%. ITT median OS 38.5 months LT versus 31.7 resection (p=.19).", "limits": "Not equivalence and not proof resection is superior. Historical era, selection and dropout differ. Methods measure LT time from NAT enrollment but resection time from surgery, so even ITT clocks are not perfectly aligned; as-treated LT percentages must not be called purely post-LT.", "locator": "Hepatology 2026; 1128–1140; Methods Statistics, Figure 1 and OS/ITT analyses; PDFpp 3–8."}, {"key": "pcca_ethun", "design_population": "Multicenter 2000–2015; 234 attempted resections and 70 entered LT protocols; 191 curative-intent resections and 41 confirmed-CCA LT in recipient analysis.", "selection": "LT patients were younger (52 vs 65), more often PSC(61% vs 2%), and more often treated with chemo/RT(98% vs 57%).", "results": "Recipient 3-/5-year OS 72%/64% LT versus 33%/18% resection. Restricted non-PSC,<3 cm, node-negative comparison favored LT at 5 years 54% vs 29%(p=.03); adjusted/restricted ITT comparison remained significant (p=.049).", "limits": "Conflicting observational evidence versus Dong; major selection/era/therapy confounding. Exact ITT exclusions and time origin require full-PDF recheck; no unsupported ITT rate is reproduced here.", "locator": "Ann Surg 2018; 267: 797–805; primary abstract and indexed Results/Discussion."}, {"key": "pcca_vugts", "design_population": "732 consecutive Dutch pCCA presentations 2002–2014; retrospective application of Mayo eligibility.", "selection": "Only 34(5%) potentially LT-eligible after resection/biology/fitness/age screening; not an LT-treated cohort.", "results": "Without LT, median survival 13 months (95% CI 3–23) from diagnosis/presentation. This shows unmet need among unresectable selected patients, not benefit over R 0 resection.", "limits": "Historical non-LT care; no matched LT comparator, suspected/confirmed nodes pooled and infection criterion incompletely reconstructible. Abstract 24 PSC versus body 29 PSC inconsistency is irrelevant to the decision and not propagated.", "locator": "Ann Surg Oncol 2021; 28: 1483–1492; Methods Eligibility/Statistical Analyses and Results; complete 10-pagePDF."}, {"key": "pcca_olthof_pve", "design_population": "20-center retrospective 1667 patients; 1484 combined liver/bile-duct resections analyzed; 298 PVE. Complete-data propensity analysis 98 PVE versus 98 controls.", "selection": "High-risk major resections; exploration-only and LT excluded.", "results": "Matched PVE versus noPVE: ISGLS B/C liver failure 8% vs 36%; 90-day mortality 7% vs 18%; bile leak 10% vs 35%. Median remnant-volume gain 42% after 22 days.", "limits": "Unmatched outcomes were worse in PVE patients because they were higher risk. Matching omits unmeasured confounding and excludes missing volumetry; does not prove one FLR cutoff. Operated-only denominator omits patients failing to reach surgery.", "locator": "Ann Surg Oncol 2020; 27: 2311–2318; Methods, Matched Cohort and Table 3; complete 8-pagePDF."}, {"key": "murad", "design_population": "287 NAT/LT entrants across 12 US centers; 214 transplanted.", "selection": "Localized unresectable or PSC-associated disease, not a trial in patients eligible for both R 0 resection and LT.", "results": "5-year pathway-entry OS 53% and post-LT RFS 65% are useful feasibility benchmarks, but answer a different question from randomized LT-versus-resection benefit.", "limits": "Substantial overlap with Mayo comparisons; do not count as an independent comparative test.", "locator": "Gastroenterology 2012; Results and survival figures; full PDF."}]}}, {"id": "pCCA-B3", "anchor": "pcca-b3", "title": "Alternative treatment before transplantation", "status": "Separate proposals; not activated", "steps": ["neoadjuvant"], "context": "Alternative neoadjuvant regimens require their own approval and cannot be substituted into the standard protocol automatically.", "stance": "Keep the established Mayo-style pathway as default; develop GemCis-only and SBRT/capecitabine as separately governed alternatives, without claiming equivalence or superiority.", "rules": ["Default to the established fluoropyrimidine/EBRT-based pathway under the approved radiation and pharmacy protocol. Do not treat a pilot dose/fractionation or cycle count as a universal order.", "Develop a separately governed prospective GemCis-only feasibility/comparative arm for otherwise conventionally selected pCCA. Retain SBRT/capecitabine as another documented pilot option, not the uniquely evidence-preferred alternative. Neither arm is activated by this document.", "Do not combine either alternative with an initial size, primary transperitoneal-biopsy or previously malignant-node expansion. Keep ICI-containing induction outside these initial arms unless separately approved on pre-LT safety evidence.", "Before opening, specify regimen delivery, staging, stopping rules, radiation-field and arterial/biliary reconstruction review. Capture every entrant, failure to reach LT, cholangitis, HAT/PVT, biliary injury, graft loss, recurrence and all graft use."], "tests": "Written radiation/chemotherapy plan and dose modifications; drainage/infection plan; biliary/vascular anatomy; actual prior dose maps; operative staging and graft-safety endpoints.", "allocation": "Policy requires a written neoadjuvant protocol and operative staging, not this exact regimen. A regimen study does not relax the standardized tumor criteria.", "references": ["welling", "hoogwater", "murad", "soliman", "ito", "pcca_murad_predictors"], "evidence": {"synthesis": "Conventional fluoropyrimidine-based chemoradiation remains the most mature benchmark. Alternatives have genuine LT evidence, but none has demonstrated noninferiority. The evidence does not justify singling out SBRT as the only acceptable research alternative while categorically closing GemCis-only. Vascular/biliary harm needs prospective surveillance alongside recurrence and dropout.", "counterevidence": "RT may reduce recurrence yet increase vascular morbidity. Chemo-only favorable selected-recipient outcomes do not reveal who progressed before LT. No-NAT European recipients are not a rationale to omit all induction in a US exception pathway. GCS/RT and SBRT are not interchangeable.", "certainty": "Moderate confidence in feasibility of conventional selected NAT/LT; very low comparative certainty between named regimens. Direct vascular safety signal deserves action despite nonrandomization.", "threshold_basis": "POLICY: OPTN requires an approved written protocol including NAT/staging but does not mandate a particular radiation dose. STUDY: SBRT 50–60 Gy/3–5 fractions and GCS/56 Gy are published pilot recipes only. LOCAL: GemCis-only prospective arm, no simultaneous biology expansion, and initial ICI exclusion are risk-management proposals. No validated minimum cycle count or safe vascular dose threshold is inferred.", "studies": [{"key": "murad", "design_population": "287 entrants/214 LT across 12 US centers.", "selection": "Localized unresectable/PSC-associated pCCA; 99% EBRT, 98% fluoropyrimidine, 75% brachytherapy.", "results": "5-year entry OS 53%; post-LT RFS 65%. No clear RFS difference by brachytherapy receipt was detected.", "limits": "Strongest mature multi-center pathway benchmark, but no randomized regimen comparison; lack of detected brachytherapy effect does not establish interchangeability.", "locator": "Gastroenterology 2012; Treatment Characteristics and Outcomes; full PDF."}, {"key": "welling", "design_population": "Single-center pilot; 17 evaluated, 12 NAT, 9 listed, 6 LT.", "selection": "Unresectable localized pCCA under historical conventional size/staging criteria.", "results": "SBRT 50–60 Gy in 3–5 fractions over 2 weeks, followed by capecitabine; 6 LT with 1-year OS 83%.35 pre-LT adverse events and 11 post-LT complications were reported.", "limits": "Very small feasibility cohort, short oncologic follow-up, no randomized comparator. Regimen is a study description, not a universal radiation prescription or proof SBRT is the preferred alternative.", "locator": "Liver Transpl 2014; 20: 81–88; Methods, patient flow and adverse-event tables; local PDF."}, {"key": "soliman", "design_population": "Recipient-only retrospective 2008–2023; 26 analyzed LT, 12 GemCis-only, 14 RT-based including six also receiving GemCis.", "selection": "Localized radiologically eligible pCCA; known metastatic disease excluded.", "results": "Main-text 1-/3-year OS 83.0%/52.3%; 9/26 recurrences; 1-/3-year RFS 77.8%/59.0%. No statistically significant OS or explant-response difference between treatment strata; RT had more operative blood-loss/transfusion signals.", "limits": "No pretreatment denominator or differential dropout data; small nonrandom groups, era/selection confounding and occult nodal disease. Supports studying omission, not equivalence. Use main-text values rather than abstract 84%/55%.", "locator": "Transplant Direct 2025; 11: e 1760; Tables 1–4, Figure 2, Discussion; full PDF."}, {"key": "hoogwater", "design_population": "Multicenter 2011–2020; 49 LT, 27 with NAT, 22 without.", "selection": "Similar broad transplant selection but nonrandom center-specific NAT and PSC distributions.", "results": "Post-LT 5-year OS 41% NAT versus 53% no NAT(not significant); NAT associated with less recurrence (adjusted HR 0.30, 95% CI 0.09–0.97). Major vascular complications 11/27 vs 3/22; hepatic-artery complications 9/27 vs 2/22.", "limits": "Competing recurrence benefit and treatment harm, not proof RT can routinely be omitted. Abstract 9 vs 2 vascular wording should not replace Table 3's broader 11 vs 3 major-vascular count.", "locator": "BJSOpen 2023; 7: zrad 025; Table 3, adjusted recurrence analysis and mortality discussion; full PDF."}, {"key": "ito", "design_population": "Prospective Kyoto pilot; 10 enrolled, 5 LDLT, 5 dropout.", "selection": "Unresectable localized pCCA; GemCisS 1 induction plus EBRT, typically 56 Gy/28 fractions.", "results": "All 5 recipients alive at 1 year, median follow-up 23.7 months; one recurrence and 2/5 hepatic-artery thromboses. Dropouts included progression, positive nodes, toxicity/complication, financial withdrawal and one conversion to resection.", "limits": "Five recipients cannot establish long-term oncologic safety; different allocation/LDLT setting and demanding regimen. This is not support for adding immunotherapy.", "locator": "J Hepatobiliary Pancreat Sci 2025; 32: 276–286; patient flow, Tables and Discussion; full HTML."}, {"key": "pcca_murad_predictors", "design_population": "131 local LT within 199 protocol entrants.", "selection": "Mayo conventional NAT; historical exposure overlaps other Mayo reports.", "results": "11/131 required retransplantation, including six for HAT; 5-year post-LT OS 71%, RFS 68%.", "limits": "Illustrates clinically significant graft risk; not an independent estimate additive to the multicenter series.", "locator": "Hepatology 2012; Transplantation and Recurrence sections."}]}}], "documents": [{"label": "V12 high-risk protocol · DOCX", "url": "/mh-liver-pathways/evidence/2026-10-25/docs/02_PCCA_High_Risk_Protocol_v12.docx", "format": "docx"}]}, "icca": {"name": "Intrahepatic cholangiocarcinoma", "reviews": [{"id": "iCCA-B1", "anchor": "icca-b1", "title": "Advanced disease: tumor distribution and grade", "status": "Proposed study cohort", "steps": ["diagnosis", "phenotype"], "context": "Confirm the actual lesion distribution and tumor grade before considering the proposed advanced-disease study.", "stance": "Keep the small-cirrhotic pathway separate; define the initial advanced study by pure, favorable-grade, localized morphology rather than an invented size cap.", "rules": ["Proposed advanced entry phenotype: pure iCCA, G1–2, one mass-forming focus with or without adjacent peritumoral satellites; no separate multifocal deposits across distinct segments. No universal 8 cm/three-lesion rule is adopted.", "Exclude known G3/poor differentiation, mixed HCC-iCCA, macroscopic tumor thrombus, proven malignant nodes, peritoneal or other extrahepatic disease from the initial advanced pilot. Negative core sampling cannot guarantee the whole tumor grade; record this limitation.", "Intrahepatic vascular encasement without tumor thrombus may be considered if complete explant/reconstruction is technically feasible. Larger size needs individualized technical/biological review, not an automatic permission.", "Do not apply the advanced-study mixed-histology exclusion to the separate NLRB small-cirrhotic route. Preserve ≤3 cm guidance wording and flag the exactly-3.0 cm clinical discrepancy with <3 cm candidate-evaluation prose."], "tests": "Expert core-pathology review including pure versus mixed and grade; MRI/CT segment map; chest/systemic staging; nodal resolution; vascular thrombus versus encasement; resection review.", "allocation": "Advanced noncirrhotic or larger disease does not inherit the small-cirrhotic favorable NLRB pathway. Organ-route and research decisions remain explicit.", "references": ["systare", "ilts", "candidate2026", "nlrb", "sapisochin", "icca_demartin", "icca_dageforde", "mcmillan", "icca_tesla", "icca_giguet"], "evidence": {"synthesis": "Small incidental iCCA/mixed disease cannot simply be pooled with known advanced pure iCCA. Large unifocal tumors can have durable post-LT survival after selection, but recurrence remains common and the screened-to-LT yield is low. Multifocality and poor differentiation are adverse signals; their precise exclusion boundaries remain unvalidated. Known advanced mixed tumors have particularly weak prospective support.", "counterevidence": "Houston included multifocal/G3 explants and TESLA intentionally enrolled extensive burden; therefore G1–2/unifocal restrictions are local conservatism, not universal trial criteria. Conversely, small mixed-tumor success does not rescue beyond-UCSF outcomes or validate advanced mixed inclusion. Negative limited biopsy cannot eliminate heterogeneous high-grade/mixed components.", "certainty": "Low for small retrospective cohorts; very low for benefit and optimal thresholds in advanced disease. No randomized advanced-iCCA LT comparison or validated universal diameter/lesion-count limit.", "threshold_basis": "GUIDANCE: current NLRB small-cirrhotic unresectable solitary iCCA/mixed ≤ 3 cm after 6 months stability is a separate reviewed-exception lane; AASLD candidate wording uses < 3 cm. STUDY: SYS-TARE/Rennes use restricted burden; Houston/TESLA use broader burden. LOCAL: G1–2 and unifocal±adjacent satellites is a conservative first-study definition, not an evidence-proven optimum.", "studies": [{"key": "sapisochin", "design_population": "International retrospective explant-defined pure iCCA; 48 recipients, 15 very-early solitary ≤ 2 cm, 33 larger/multifocal.", "selection": "Cirrhosis and predominantly incidental/misclassified tumors, not a planned advanced-iCCA induction pathway.", "results": "Five-year post-LT OS 65% very-early versus 45% advanced; 5-year recurrence 18% versus 61%.", "limits": "Small retrospective pathological strata, not validation of ≤ 3 cm guidance or response-selected large disease. Preoperative sampling/recognition differs from known iCCA.", "locator": "Hepatology 2016; 64: 1178–1188; Methods and very-early/advanced survival analyses; full PDF."}, {"key": "icca_demartin", "design_population": "Three-center retrospective cirrhosis cohort; 49 LT versus 26 resection, iCCA/mixed ≤ 5 cm.", "selection": "All LT diagnoses were incidental; 44/49 presumed HCC, 5 decompensated cirrhosis.", "results": "From surgery, 5-year OS 67% LT versus 40% resection (p=.17), RFS 75% vs 36%(p=.004), recurrence 18% vs 46%. Differentiation independently predicted recurrence (HR 3.74).", "limits": "Not proof to prospectively transplant known 5-cm pure/mixed disease; heterogeneous histology, small numbers, per-protocol selection.", "locator": "Liver Transpl 2020; 26: 785–798; Methods, OS/RFS and pathological-risk analyses."}, {"key": "icca_dageforde", "design_population": "12-center retrospective; 208 mixed tumors, 99 LT and 109 resection; 67 LT within Milan, 14 beyond Milan/within UCSF, 18 beyond UCSF.", "selection": "Only 2/99 LT mixed diagnoses known preoperatively; most transplanted for presumed HCC.", "results": "Within Milan 5-year post-LT OS 70.1%, recurrence 23.1%; HCC comparators 73.4%/11.5%. Beyond UCSF mixed 5-year OS 15.8%. Within Milan LT versus resection 5-year DFS 70.3% vs 33.6%.", "limits": "Benefit is concentrated in small selected disease; does not validate advanced known mixed inclusion. Explant classification and preoperative misdiagnosis constrain applicability.", "locator": "J Am Coll Surg 2021; 232: 361–371; pp 363–367, Tables 1–3 and tumor-burden subgroup results; local PDF."}, {"key": "mcmillan", "design_population": "65 referred, 37 listed; five converted to resection, 32 LT-pathway analysis, 18 LT.", "selection": "No imposed size/number limits; 10/18 multifocal, median cumulative burden 10.4 cm; six poorly differentiated on explant.", "results": "Five-year OS 49% all 32 and 57% recipient subgroup, each FROM LISTING; 7/18 recurrences.", "limits": "Overlap with Lunsford; selection and immortal-time bias. Inclusion of G3/multifocal disease does not establish their safety, but contradicts claiming such patients were universally excluded by evidence.", "locator": "AJT 2022; 22: 823–832; Methods Statistics, Tables 1–2 and §3.5."}, {"key": "systare", "design_population": "Prospective institutional SYS-TARE pathway; 13 entered, 4 LT, 9 dropout.", "selection": "Single bulky measurable iCCA±peritumoral satellites; diffuse/multisegment multifocal disease excluded; intrahepatic vessel encasement permitted without tumor thrombus.", "results": "Four recipients alive without recurrence at 73, 40, 12, 8 months; dropouts: three unrecovered intrahepatic progression, four with extrahepatic disease, two occult nodes.", "limits": "Only 4 recipients; no validated maximum diameter or comparative proof of satellites being equivalent to a solitary tumor.", "locator": "Transpl Int 2024; 37: 13641; Eligibility, Figure 1 and Results; full PDF."}, {"key": "icca_tesla", "design_population": "Norwegian prospective early report; 7 referred, 6 enrolled, 5 LT.", "selection": "Response-selected liver-confined iCCA; median imaging lesion count 7, median diameter 11.5 cm; no size/number cap.", "results": "All five alive at 10–55 months; 2 recurrences at 12/13 months, both patients with >20 lesions. One HAT required re-LT; one occult 2-mm positive node.", "limits": "Research letter, very small denominator; recurrence pattern argues caution with diffuse multifocal disease, not a validated lesion-count cutoff.", "locator": "BJS 2025; 112: znaf054; main text, Table 1 and Figure 1; complete indexed letter."}, {"key": "icca_giguet", "design_population": "Rennes retrospective SIRT pathway; 147 treated, 44 younger controlled cases, 19 resections, eight listed including two external referrals, six LT.", "selection": "Large predominantly unifocal tumors; median baseline total 10 cm; diffuse multifocal, MVI and EHD excluded.", "results": "Post-LT 5-year OS 100%, PFS 44.4%; 3/6 recurrences.", "limits": "Only six recipients over 15 years; eight refers to listing, not completed LT. No size cap validated.", "locator": "JHEP Rep 2026; 8: 101830; Eligibility, cohort flow, Tables 1–3."}]}}, {"id": "iCCA-B2", "anchor": "icca-b2", "title": "Response, progression and the observation period", "status": "Proposed response requirements", "steps": ["therapy", "stability"], "context": "Use the full treatment and progression history to decide whether further observation or another treatment is needed.", "stance": "Require six months of continuous disease control, but distinguish liver-only progression with salvage from permanent exclusion.", "rules": ["Proposed clock: ≥6 consecutive months of radiological response/stability from initiation of the effective strategy after the most recent confirmed progression, with baseline imaging, no extrahepatic disease and persistent unresectability. Image approximately every eight weeks and restage at completion.", "Dose reduction, toxicity-driven substitution or planned consolidation does not automatically reset the clock when control is continuous. Confirmed liver-only progression pauses eligibility; allow one separately reported salvage re-entry after a fresh six months of control.", "Further progression after that salvage strategy, proven malignant nodes or extrahepatic spread excludes the patient from the initial study. Reassess resection after each major response and immediately before LT; conversion to feasible curative resection redirects to resection."], "tests": "Dated regimen/response timeline; comparable liver imaging and systemic staging; RECIST and multidisciplinary adjudication; CA19-9 in obstruction context; repeated HPB review. Record latest confirmed progression, current effective-strategy start, first control, each imaging assessment and the proposed activation date; repeat R0/functional-FLR review after meaningful response.", "allocation": "This is the advanced-study clock; do not substitute it for the separate small-cirrhotic NLRB observation/exception requirements.", "references": ["lunsford", "mcmillan", "systare", "icca_tesla", "icca_giguet", "icca_comparator", "pump2"], "evidence": {"synthesis": "A six-month control requirement is a defensible tested entry rule, not an established biological truth. SYS-TARE, TESLA and Rennes used different selection intervals. Stable measurable disease can qualify without RECIST partial response. New lesions or extrahepatic spread cannot be dismissed as stable biology. Regression can change the correct operation to resection.", "counterevidence": "Successful later-line cases refute a categorical ban on all salvage but do not validate unrestricted repeated resets. Patients controlled for six months already have better non-LT prognosis. Comparing their post-LT survival with unselected advanced-cancer median survival exaggerates benefit. Unresolved lung, bone or nodal findings require adjudication before activation.", "certainty": "Very low certainty for the optimal control clock, imaging metric or allowable salvage count; low certainty for sustained control as a useful selection approach.", "threshold_basis": "STUDY: six months in Houston/Rennes, four months in SYS-TARE and twelve months of treatment response in the TESLA flow diagram. LOCAL: approximately eight-week monitoring and one salvage re-entry. GUIDANCE: preserve the separate NLRB small-cirrhotic clock ('from diagnosis or last treatment'); do not silently replace it with the advanced research clock.", "studies": [{"key": "lunsford", "design_population": "Prospective case series: 21 referrals, 12 accepted and six LT recipients.", "selection": "Unresectable, liver-confined pure iCCA without macrovascular invasion. Six months of response/stability required; second/third-line therapy allowed after six months of control on that regimen.", "results": "Median diagnosis-to-LT interval 26 months. Post-LT 1-/3-/5-year OS 100%/83.3%/83.3%; five-year CI 27.3–97.5. Three of six recurred, median 7.6 months; RFS 50%.", "limits": "Six highly selected recipients, wide intervals and substantial pre-LT survival. Does not establish six months as optimal or one salvage line as the maximum.", "locator": "Lancet Gastroenterol Hepatol 2018; 3: 337–348; Eligibility/Protocol, Table 1 and Figure 2; full local PDF."}, {"key": "mcmillan", "design_population": "Expanded Houston cohort, overlapping Lunsford.", "selection": "Six-month gemcitabine-based induction; liver progression deferred LT, with reconsideration after control; extrahepatic progression prompted delisting.", "results": "Five listed patients converted to resection; seven others delisted and seven remained listed at cutoff.", "limits": "No timing or salvage comparator; keep referral, listing and LT clocks distinct.", "locator": "AJT 2022; Methods eligibility and §§3.1–3.3."}, {"key": "systare", "design_population": "Thirteen entrants; four LT recipients.", "selection": "At least four months of response/stability after systemic treatment/Y 90 before staging; renewed control after salvage could qualify.", "results": "All four recipients had RECIST stable disease and Choi response, with median density reduction 52.5%. One FGFR 2-targeted pemigatinib rescue reached LT. Two of six staged patients had positive nodes.", "limits": "One rescue does not validate a general reset rule. PET-negative imaging cannot replace pathological staging.", "locator": "Transpl Int 2024; Protocol, restaging and individual-recipient tables; full PDF."}, {"key": "icca_tesla", "design_population": "Early prospective report; five LT recipients.", "selection": "The referral-flow figure specifies twelve months of treatment response; median diagnosis-to-LT interval 26 months.", "results": "Two extensively multifocal patients recurred despite prolonged selection.", "limits": "Supplementary eligibility needs checking; time alone does not neutralize burden.", "locator": "BJS 2025; Figure 1 flowchart and Table 1."}, {"key": "icca_giguet", "design_population": "Six-recipient retrospective series.", "selection": "At least six months of response/stability, CT/MRI every 2–3 months; median diagnosis-to-listing 351 days.", "results": "Nineteen controlled younger patients underwent secondary resection.", "limits": "Observed longer selection does not prove a twelve-month requirement.", "locator": "JHEP Rep 2026; neoadjuvant/listing and Results sections."}, {"key": "icca_comparator", "design_population": "Two-center retrospective: 1, 407 total iCCA, 327 advanced liver-confined; 180 progressed/died before six months, 47 converted to resection, 39 potentially LT-eligible.", "selection": "Response-selected non-LT patients; 22 of 39 received HAIP.", "results": "Median survival 39 months from diagnosis; 3-/5-year survival 46%/26% from the six-month estimated-eligibility landmark.", "limits": "Favorable biology selects survivors before any LT. Historical 2008–2018 cohort, not a randomized treatment comparison.", "locator": "Ann Surg Oncol 2026; survival methods, Results and Table 2; full PDF."}, {"key": "pump2", "design_population": "Prospective phase II: 50 pump placements, 48 received FUDR, 37 concurrent GemCis.", "selection": "Regional/systemic treatment for selected unresectable iCCA, not an LT trial.", "results": "Partial response 44%, disease control at six months 84%; five resected, one pathological complete response. Median survival 22.3 months, three-year 31.5%.", "limits": "Does not validate a pre-LT clearance test or subsequent arterial safety. Reassess resection after response.", "locator": "JCO 2026; PUMP-2 Methods/Results; full PDF."}]}}, {"id": "iCCA-B3", "anchor": "icca-b3", "title": "Living-donor transplantation: study readiness", "status": "Study development only", "steps": ["review"], "context": "A potential living donor does not by itself establish recipient eligibility or make a proposed study ready to open.", "stance": "Develop a prospective LDLT feasibility study, but do not permit transplantation under this proposal yet.", "rules": ["Before this study can open: all six readiness domains complete—approved recipient rules; independent benefit/comparator review; separate donor/advocate clearance; explicit uncertainty/graft-use consent; funded donor follow-up; and an all-screened registry with independently approved safety monitoring.", "Donor availability never lowers iCCA-B1/B2 selection or control requirements. Retain ordinary donor safety criteria and independent withdrawal rights.", "Do not use predicted five-year survival ≥50%, or another unvalidated number, as proof of readiness. Until approvals are complete: screening/registry and study development only, no protocol-directed LT."], "tests": "Written study, statistical/safety plan, non-LT alternatives including HAI/conversion, donor resources, consent forms and documented independent approvals.", "allocation": "LDLT avoids allocation of that deceased-donor graft but adds healthy-donor risk and potential retransplant demand; it does not itself prove net benefit.", "references": ["icca_ldlt", "icca_comparator", "lunsford", "icca_giguet", "pump2", "topaz3", "round2_kelly"], "evidence": {"synthesis": "The seven-recipient LDLT experience supports developing a carefully governed study, not announcing a standard indication. A shorter wait may avoid dropout but can also remove the biological observation that selected successful cohorts. Donor availability does not erase recipient uncertainty or non-LT alternatives. Benefit and donor harm require separate analyses and independent consent.", "counterevidence": "No randomized advanced-iCCA LDLT-benefit trial or validated minimum five-year survival forecast establishes study readiness. Response-selected non-LT patients may live for years. National mortality is small but nonzero and does not capture all financial, psychological or functional burden. Seven living donors reported alive is not a safety guarantee.", "certainty": "Very low certainty for causal LDLT benefit and the disease-specific donor-risk tradeoff; moderate confidence in broad national donor-mortality estimates, with limited individual transferability.", "threshold_basis": "POLICY: donor independence, informed consent and withdrawal protections remain mandatory. STUDY: seven-recipient LDLT feasibility with wide confidence intervals; no validated minimum survival forecast. LOCAL: assessment of the six readiness domains. Recipient boundaries and safety stopping rules require prospective institutional approval before the first pair.", "studies": [{"key": "icca_ldlt", "design_population": "Retrospective single-center seven-recipient LDLT series.", "selection": "Six received systemic treatment, four locoregional treatment; median MELD 8 and wait 38 days.", "results": "Median follow-up 5.1 years; two recurrences, one death. Five-year OS 85.7% (CI 33.4–97.9), RFS 71.4% (CI 25.8–92.0). Two gradeIII complications within six months; all donors alive.", "limits": "Abstract independently checked; full selection, screened denominator and donor morbidity require PDF. Seven recipients cannot establish net benefit.", "locator": "AJT online 29 September 2026; primary abstract, PMID 42810588."}, {"key": "lunsford", "design_population": "Twenty-one referrals, twelve accepted, six recipients.", "selection": "Six-month controlled, liver-confined unresectable iCCA.", "results": "Five-year post-LT survival 83.3% with very wide CI; three of six recurred.", "limits": "Feasibility, not LDLT-specific causal benefit; overlaps McMillan.", "locator": "Lancet Gastroenterol Hepatol 2018; Methods/Results; local PDF."}, {"key": "icca_giguet", "design_population": "Six selected deceased-donor recipients.", "selection": "French declined-graft route, not LDLT.", "results": "Arterial complications 3/6 and biliary 4/6; one late retransplant and one septic-cholangitis death at 6.4 years despite five-year OS 100%.", "limits": "High survival is not low morbidity or cure; SIRT, surgery and graft-quality effects cannot be separated.", "locator": "JHEP Rep 2026; Table 3 and late-complication Results."}, {"key": "icca_comparator", "design_population": "Thirty-nine selected non-LT patients from 327 advanced liver-confined cases; 22 received HAIP.", "selection": "Retrospective LT-eligibility assessment after six months of control.", "results": "Median 39 months from diagnosis; five-year survival 26% from the six-month landmark.", "limits": "More relevant than unselected metastatic BTC but historical and nonrandomized; cannot yield precise individual LT benefit.", "locator": "Ann Surg Oncol 2026; Methods/Results/Table 2; local PDF."}, {"key": "pump2", "design_population": "Fifty pump placements; 48 received FUDR; single-arm phaseII.", "selection": "Non-LT unresectable iCCA.", "results": "Median survival 22.3 months; three-year 31.5%; five conversion resections. Arterial dissection prevented treatment in one patient.", "limits": "A current regional option, not a randomized LDLT comparator or proof of later graft-arterial safety.", "locator": "JCO 2026 PUMP-2; full-PDF Methods/Results and adverse events."}, {"key": "topaz3", "design_population": "Randomized phaseIII advanced BTC: 685 participants, 341 durvalumab/GemCis and 344 placebo/GemCis.", "selection": "Mixed biliary sites and locally advanced/metastatic disease, not a six-month LT-selected population.", "results": "Median OS 12.9 versus 11.3 months; HR 0.74 (CI 0.63–0.87), 36-month OS 14.6% versus 6.9%, median follow-up 41.3 months.", "limits": "High-level evidence for non-LT therapy, not pre-LT ICI safety or an exchangeable control for LT recipients.", "locator": "J Hepatol 2025; 83: 1092–1101; primary three-year update."}, {"key": "round2_kelly", "design_population": "SRTR 1989–2023: 8, 981 eligible donors, 8, 619 mortality analysis and 8, 314 secondary follow-up.", "selection": "Donors aged 18–65 across all indications, not iCCA-specific.", "results": "Eight 90-day deaths (0.1%), 18 within two years (0.2%). Contemporary 90-day mortality approximately 0.04%. Secondary-outcome completeness 60–67% at six months and 37–39% at two years.", "limits": "All-cause deaths are not all donation-attributable. Missingness, historical eras and mixed graft types limit individual risk estimates; employment burden also matters.", "locator": "J Transplant 2026: 2545887; Missing Data and Results§§3.1–3.3; complete 8-page PDF."}]}}], "documents": [{"label": "V12 high-risk protocol · DOCX", "url": "/mh-liver-pathways/evidence/2026-10-25/docs/03_ICCA_High_Risk_Protocol_v12.docx", "format": "docx"}]}, "crlm": {"name": "Colorectal liver metastases", "reviews": [{"id": "CRLM-B1", "anchor": "crlm-b1", "title": "Confirm that complete resection is not feasible", "status": "Confirm the treatment options", "steps": ["unresectability"], "context": "Confirm persistent unresectability after reviewing all realistic approaches to complete tumor clearance.", "stance": "Require two expert HPB certifications of persistent unresectability, not a lesion-count shortcut.", "rules": ["Proposed requirements: two HPB surgeons, including one who is not the proposed transplant surgeon, agree that complete nontransplant clearance is infeasible. Include radiology, oncology and an ablation/HAI-capable clinician; disagreement is HOLD with independent external review.", "Review parenchymal-sparing, staged, combined resection/ablation and hypertrophy-assisted options. Use FLR benchmarks of about 20% in normal liver, 30% in chemotherapy-injured liver and 40% in cirrhosis to assess resection—not as automatic LT criteria. Assess function, inflow, outflow and biliary drainage as well as volume.", "Renew certification after meaningful response or material treatment change and within 30 days before a final decision to proceed with transplantation. Restage approximately every eight weeks on active treatment. Consider HAI conversion when appropriate; do not mandate HAI treatment for every patient."], "tests": "Pretreatment/current lesion maps including disappearing sites; contrast liver MRI and systemic staging; volumetry/function; vascular/biliary map; prior treatments; signed alternative-clearance assessment. Obtain a specialized conversion/HAIP opinion when clinically appropriate and accessible; document why it is omitted otherwise. A mandatory opinion is not a requirement to expose every patient to HAIP.", "allocation": "Persistent unresectability is a clinical finding; the separate NLRB molecular, timing, imaging and response requirements still apply if exception review is pursued.", "references": ["transmet", "cirse", "crlm_haip", "seca2", "seca2_10year", "ihpba"], "evidence": {"synthesis": "The best evidence supports LT only after a credible expert determination that complete, safe hepatic clearance cannot be achieved. TransMet excluded equivocal unresectability and used independent adjudication. The HAIP series shows that a subset labelled transplant-like can convert, but does not prove mandatory HAIP or equal survival. Long-term SECA-II supports durable benefit in narrowly selected unresectable disease, not a shortcut around reconstruction, ablation or FLR review.", "counterevidence": "Many initially unresectable patients can be converted; HAIP brought 18/23 highly selected pretreated patients to resection, although most recurred and only 10/18 were R0. A high lesion count, bilobar distribution, chemotherapy injury or a low raw FLR alone is insufficient. Conversely, mandatory repeated conversion attempts can expose patients to biliary injury and progression without validated benefit.", "certainty": "Moderate-to-high certainty for the TransMet treatment strategy in its restricted randomized population; low certainty for an individual unresectability threshold, comparative HAIP effect, and broad expansions. FLR cutoffs are technical risk guidance, not predictive LT-benefit biomarkers.", "threshold_basis": "20/30/40% FLR values originate in hepatectomy planning, not validated LT-selection trials. Two reviewers and reassessment within 30 days before activation, with imaging about every eight weeks during treatment, are proposed local workflow intervals. The national exception application requires its own current staging intervals; a 30-day local review does not replace them.", "studies": [{"key": "transmet", "design_population": "Multicentre open-label randomized trial, 20 European centres, 157 screened and 94 randomized (47 LT-plus-chemotherapy, 47 chemotherapy); 63 screened excluded, including 13 with equivocal unresectability and 36 with progression.", "selection": "Age 18–65; ECOG 0–1; R0 colorectal primary; BRAF nonmutated; no prior or current extrahepatic disease/local recurrence; chemotherapy response or stable disease for at least 3 months, at most three lines. CEA <80 ng/mL OR at least 50% reduction from peak was permitted. Independent committee of at least two surgeons, two oncologists and one radiologist reviewed original and current lesion maps. These are trial criteria, not identical to current NLRB guidance.", "results": "Primary time origin was randomization. Median follow-up 59.3 months. Five-year ITT OS was 56.6% versus 12.6% (HR 0.37, 95% CI 0.21–0.65); per-protocol OS 73.3% versus 9.3%. Of 47 assigned LT, 38 received LT and 36 were per-protocol; nine had progression-related exclusion/dropout. The control arm included seven subsequent resections and two LT crossovers. Safety population comprised 40 grafted patients. Among 36 per-protocol LT recipients, 26 recurred; 19/26 received chemotherapy and 12/26 local curative-intent treatment. Median per-protocol PFS was 17.4 versus 6.4 months, and secondary PFS after salvage was 35.4 months in the LT arm. Three of 36 per-protocol recipients required retransplantation (primary nonfunction, donor gallbladder cancer, caval obstruction/large-for-size); one postoperative death was reported. Serious adverse events occurred in 32/40 safety LT recipients. Median wait to LT was 50.5 days, which limits transfer to longer-wait systems.", "limits": "Strong evidence for the selected trial population, not for BRAF-mutant, ECOG 2, active extrahepatic, truly NED, resectable or broadly expanded disease. PP survival conditions on reaching treatment and must not replace ITT. The Results recurrence denominator is 26/36; Figure 3 caption says 28 recurrences, consistent with a broader all-grafted report, so do not mix these denominators. QoL collection had only 55/74 per-protocol baseline questionnaires and is descriptive, not proof of a large QoL gain. Priority allocation and rapid access were part of the treatment strategy.", "locator": "Lancet 2024;404:1107–1118. PDF pp.2–4 eligibility/committee; pp.5–6 trial flow/Table 1; pp.8–9 recurrence, safety, retransplantation, Figure 3; p.10 QoL/limitations."}, {"key": "crlm_haip", "design_population": "Single-centre retrospective HAIP cohort: 1,110 patients treated in 2006–2016, 483 initially unresectable after exclusions; 83 met modified transplant criteria, but only 23 were pretreated, chemotherapy-controlled transplant-like candidates.", "selection": "Selected patients had liver-confined disease without progression on pre-HAIP chemotherapy. The study modified SECA/TransMet criteria: PET, molecular profile, CEA and standardized RECIST response were not mandatory, and primary resection could occur during/after HAIP. Applying at least one year from CRC diagnosis to HAIP left only five of 483 patients. Unresectability considered adequate functional remnant, vascular/biliary preservation and intraoperative ultrasound, not lesion number alone.", "results": "Time zero was HAIP placement, not a common LT-versus-HAIP eligibility date. In the 23 selected pretreated patients, 18/23 (78%) converted to resection; only 10/18 were R0, and 17/18 recurred, with salvage treatment in 15. Median follow-up was 97.7 months; median OS 61 months (95% CI 36–92), five-year OS 53% (36–79), PFS 13 months (9.6–22), hepatic PFS 16 months (11–61). Median treatment comprised five HAIP cycles and nine systemic cycles. Biliary sclerosis requiring stents occurred in 3/23 (13%); one pump-arterial dissection required revision.", "limits": "Selection from a large denominator, modified eligibility, expert-centre availability, retrospective ascertainment and a different time origin prohibit equivalence claims against TransMet. The high conversion rate is clinically important counterevidence to declaring unresectability before specialist conversion review. It does not make HAIP compulsory or establish that its toxicities are an indication to create for LT.", "locator": "Complete accepted manuscript, PDF pp.6–11: cohort derivation, modified criteria, conversion, survival and adverse events; subsequent tables."}, {"key": "seca2", "design_population": "Prospective single-centre SECA-II initial report, 15 highly selected recipients transplanted 2012–2016, without a randomized non-LT comparator.", "selection": "R0 primary; ECOG 0–1; liver-only disease with no prior extrahepatic metastases; at least one year from diagnosis to listing; at least 10% chemotherapy response. Additional size/number and response restrictions applied. All 15 had Oslo score 0–1. Median largest lesion at LT 24 mm, number five; only one KRAS-mutated case. Median wait 29 days, no wait-list dropout.", "results": "Time zero LT. Median follow-up 36 months (range 5–60). Reported one-, three-, five-year OS 100%, 83%, 83%; sparse five-year tail. Median DFS 13.7 months, with one-, two-, three-year DFS 53%, 44%, 35%. Eight patients recurred, six in lung. Seven of 15 had Clavien-Dindo IIIa–IVa complications requiring intervention. No adjuvant chemotherapy.", "limits": "The 15-patient cohort is included in the later 25-patient SECA-II report, not independent corroboration. Selected response, low burden and short wait strongly limit generalizability. The better OS than DFS demonstrates salvage opportunities but not that recurrence is harmless. A 10% response criterion is not the same as the current NLRB >10% growth exclusion or standard RECIST 1.1 progression.", "locator": "Ann Surg 2020;271:212–218; local seven-page PDF, pp.1–3 eligibility/Table 1 and pp.4–6 survival/recurrence/complications."}, {"key": "seca2_10year", "design_population": "Prospective SECA-II extended follow-up, 25 recipients from April 2012 to November 2023; analysis cutoff 1 January 2025. Includes the original SECA-II cohort.", "selection": "All grafted under SECA-II included. At least one year diagnosis to inclusion and no progression required; one inadvertently transplanted patient had progression on a scan not available to the transplant centre. One early postoperative death was included in survival analyses but excluded from other analyses, so baseline Table 1 denominator is 24. Among these 24, median largest lesion 24 mm (4–48), CEA 3.5 (1–33), PET MTV 7.3 cm³ (0–139); only two MTV >70, two KRAS-mutated, one right-sided ascending primary and one pN2. Oslo scores 0/1/2 were 9/13/2.", "results": "Time zero LT; median follow-up of survivors 97.2 months. Median OS 128.2 months (95% CI 74.8–181.6); five- and ten-year OS 77.8% and 51.5%. Median RFS 24.3 months; 12/25 relapsed, six initially lung-only. Median post-recurrence survival 62.9 months (25.7–101.1); nine had surgery as first recurrence treatment, but only three were classified curative-intent at that first treatment. Twelve had no recurrence over median 74 months; four exceeded ten years without recurrence. Four patients died of metastases more than five years after LT. Reported serious complications: five grade IIIa, three IIIb, one grade V hepatic-artery-thrombosis death.", "limits": "No contemporaneous control and only 25 recipients; highly favorable biology cannot justify broad expansion. Abstract speculates up to 15 potentially cured, body p.5 says up to 13; neither is an observed, validated cure fraction. Use observed survival/recurrence instead. The discussion's assertion that RFS is not valid for efficacy should not erase recurrence burden, treatment harms or QoL; RFS is insufficient alone, not unimportant. Updated survival supersedes rather than adds an independent 83% SECA-II estimate.", "locator": "Ann Surg 2026 early report DOI 10.1097/SLA.0000000000007200; PDF p.2 methods/time origins and early-death handling; p.3 Table 1 and outcomes; pp.4–5 salvage, late death, cure-count discrepancy and complications."}, {"key": "ihpba", "design_population": "2021 international multidisciplinary consensus; not a prospective eligibility-strategy trial.", "selection": "Distinguishes technical unresectability, biology and organ-allocation ethics. Recommends BRAF V600E exclusion; RAS mutation alone is not an absolute exclusion. MSI-H/dMMR cases should receive effective systemic options and are not routinely recommended for LT.", "results": "No original randomized outcome denominator. Consensus suggests response/observation, CEA trajectory and PET burden (MTV 70 cm³/TLG 260) as risk criteria. Rising CEA >80 is treated more adversely than falling CEA.", "limits": "Expert recommendations differ from current NLRB wording and TransMet criteria; do not merge them into a falsely universal threshold. Non-V600E BRAF is not thereby proven safe for LT, and contemporary guidance requests BRAF-wild-type tumours.", "locator": "Lancet Gastroenterol Hepatol 2021;6:933–946; full PDF selection, molecular, PET and tumour-response statements."}, {"key": "cirse", "design_population": "CIRSE consensus standards for portal-vein embolization and liver venous deprivation, 2024; not a transplant-versus-resection comparative trial.", "selection": "Assesses future liver remnant volume and function, vascular/biliary anatomy, parenchymal quality and capacity for hypertrophy before major hepatectomy.", "results": "Frequently used planning benchmarks are approximately >20% normal parenchyma, >30% chemotherapy-exposed/injured liver and >40% cirrhosis. These are resection-risk benchmarks, not an LT eligibility test or a guarantee of safe resection.", "limits": "Volume cannot substitute for function, and the relevant injury severity differs by patient. Failure of a numerical FLR threshold alone does not establish persistent oncological unresectability if PVE/LVD, staged or parenchymal-sparing treatment remains feasible.", "locator": "Cardiovasc Intervent Radiol 2024;47:1025–1036; complete PDF patient selection/FLR assessment."}]}}, {"id": "CRLM-B2", "anchor": "crlm-b2", "title": "No tumor is visible after treatment", "status": "No transplant for presumed microscopic disease", "steps": ["control", "restaging"], "context": "No visible tumor after treatment is a reason to reassess the indication; presumed microscopic disease alone does not justify transplantation.", "stance": "Do not activate LT solely for presumed microscopic disease in radiographic NED; separate residual cancer from treatment-related liver failure.", "rules": ["Residual unresectable disease: convincing viable/suspicious disease on appropriate cross-sectional imaging may proceed to B1 review even if PET is negative. PET negativity alone does not prove cure.", "Radiographic NED/occult-residual-risk: no convincing remaining disease on high-quality staging. Maintain the original lesion map, continue appropriate oncology care and reassess in about eight weeks; LT for presumed microscopic risk requires a separately approved NED study.", "Irreversible treatment-related liver failure: evaluate a separate liver-failure indication with independent hepatology and oncologic-suitability review. Do not relabel it active unresectable cancer. Do not stop effective treatment to provoke recurrence or biopsy every scar.", "Keep all original lesion sites mapped. Disappearance does not establish eradication, but uncertain microscopic viability alone does not establish persistent unresectability or transplant benefit; diagnostic accuracy and treatment benefit are different questions."], "tests": "Expert comparison of pretreatment and current liver MRI/CT; systemic staging; treatment dates and PET interpretation; liver reserve; separate adjudication of NED versus suspicious residual sites.", "allocation": "A separate liver-failure indication does not automatically meet the CRLM exception pathway. Obtain case-specific clinical and allocation adjudication.", "references": ["crlm_occult", "dream", "oba2018", "wehrle", "transmet"], "evidence": {"synthesis": "CT/MRI/PET negativity cannot reliably establish pathological eradication. However, uncertain residual microscopic disease also does not automatically establish clinically meaningful persistent unresectability or an LT benefit. DREAM provides the crucial balance: substantial residual risk despite disappearance, but no adequately powered proof that removing every invisible site improves survival. The small US LT series is genuine NED/injury experience but remains selected and uncontrolled.", "counterevidence": "Some disappearing lesions are genuinely nonviable: DREAM classified 95/152 CT-plus-MRI disappearing lesions as nonviable by pathology or two-year observation; Oba found only 3/68 viable lesions after negative MRI plus CE-IOUS. Conversely, 4/7 complete imaging responders in the explant series had viable cancer. Both prevent a binary 'all scars count' or 'none count' rule. NED patients with preserved liver function lack comparative evidence of benefit from prophylactic LT.", "certainty": "Moderate certainty that imaging disappearance does not reliably prove nonviability; low certainty about the best lesion-management strategy; very low certainty for LT in true radiographic NED or treatment-injury subgroups. Explant findings are diagnostic, not a causal efficacy comparison.", "threshold_basis": "No validated chemotherapy-cycle minimum, scar count, PET-negative interval, ctDNA-negativity requirement or NED duration establishes LT benefit. Proposed approximately eight-week imaging while on active treatment is local workflow, adjustable for clinical need; more sensitive imaging/CE-IOUS informs resection planning but is not a transplant clearance test.", "studies": [{"key": "crlm_occult", "design_population": "Retrospective radiology–explant study of 14 selected LT recipients; eight indications were unresectable disease and six treatment-associated liver failure/biliary complications.", "selection": "Median 11 original lesions and 24 chemotherapy cycles; extensive systemic/local therapy. Seven had PET-defined complete radiographic response. This was a transplanted-only, highly selected sample.", "results": "Explant contained viable carcinoma in 11/14; nine had additional lesions not accounted for on pre-LT imaging. Four of seven imaging complete responders still had viable tumour. The three pathological complete responders were all in the liver-failure indication group.", "limits": "Demonstrates imperfect imaging negative predictive value, not that every scar remains viable or that prophylactic LT improves survival for radiographic NED. No non-LT or observation comparator; complete-response definition and treatment injury matter. Likely overlap with subsequent US protocols.", "locator": "Ann Surg 2023;278:e1026–e1034; full PDF methods, radiology/explant correlation tables, Results and Discussion."}, {"key": "dream", "design_population": "Prospective international DREAM diagnostic study at 21 centres: 233 registered initially unresectable/borderline CRLM patients, 112 planned conversion surgery, 109 operated. Primary diagnostic analysis had 152 evaluable CT-plus-MRI disappearing lesions from 44 patients.", "selection": "Post-treatment CT plus MRI (diffusion, T1/T2 and contrast); disappearance on both defined confirmed DLM. Reference was pathology for resected sites or no site recurrence over two years for unresected sites. Fifty-one confirmed lesions were non-evaluable, including deaths and incomplete imaging follow-up.", "results": "Nonviability NPV was 62.5% (95/152; 90% CI 50.8–74.2), failing the prespecified >85% benchmark; CT-alone NPV 52.9%. Resected confirmed DLM: 50/88 nonviable; left-behind: 45/64 without site recurrence. In the n=45 R0/1, no-extrahepatic-disease subgroup, resecting all confirmed DLM (19 patients) versus leaving at least one (26) yielded DFS HR 0.92 (95% CI 0.48–1.77), OS HR 0.80 (0.21–3.08), with time measured after surgery; survival comparisons were not powered or randomized. Median follow-up 26.1 months.", "limits": "Lesion-level diagnostic probability is not patient-level benefit. Two-year non-recurrence is not pathology; evaluability selection and noncentral imaging review are limitations. Neither disappearance equals cure nor uncertain viability requires removal/LT. A nonsignificant survival comparison is not equivalence or evidence that resection is futile.", "locator": "JAMA Surg 2025 DOI10.1001/jamasurg.2025.3600; PDF E1–E3 design/endpoint; E5 Figure 1 and survival; E7 Figure 4/limitations."}, {"key": "oba2018", "design_population": "Retrospective hepatectomy imaging series, 184 patients, 59 with 275 CT-disappearing metastases; primary published abstract verified, full PDF pending.", "selection": "Hepatocyte-specific MRI followed by contrast-enhanced intraoperative ultrasound (CE-IOUS); surgically selected population, unlike an all-transplant referral cohort.", "results": "MRI identified 71 CT-disappearing lesions, of which 65 were viable; CE-IOUS found 94 additional lesions. Of 110 undetected by both modalities, 68 were resected and three viable (4%); among 42 left behind, six recurred (14%) over median 27 months.", "limits": "Lesion-level retrospective selection and assay sequence differ from DREAM. More sensitive imaging can identify residual disease, but these data do not prove that every original site must be resected or that NED warrants LT.", "locator": "HPB 2018;20:708–714; DOI10.1016/j.hpb.2018.02.377; PMID29534862 abstract."}, {"key": "wehrle", "design_population": "Single-centre intensive pre-LT locoregional-treatment protocol: 27 evaluated, 16 included, nine transplanted (seven living donor). Abstract-only verification.", "selection": "Median 16 systemic cycles (10–40); Y90 in five, ablation in four, resection in four and HAIP in three. Five grafted patients had no detectable disease and four had treatment-induced cirrhosis.", "results": "Median follow-up 700 days; three recurrences. Reported RFS one year 6/8 (75%) and two years 3/5 (60%) reflects very small mature denominators.", "limits": "This is actual published experience with NED/injury routes, so it must not be described as nonexistent; it is not controlled proof of benefit or a universal cycle-count requirement. Patients likely overlap occult-explant/PET/ctDNA cohorts. Do not intensify treatment to manufacture liver failure.", "locator": "Liver Transpl 2024;30:1238–1249; PMID38833301 published abstract; complete methods pending."}, {"key": "transmet", "design_population": "Multicentre open-label randomized trial, 20 European centres, 157 screened and 94 randomized (47 LT-plus-chemotherapy, 47 chemotherapy); 63 screened excluded, including 13 with equivocal unresectability and 36 with progression.", "selection": "Age 18–65; ECOG 0–1; R0 colorectal primary; BRAF nonmutated; no prior or current extrahepatic disease/local recurrence; chemotherapy response or stable disease for at least 3 months, at most three lines. CEA <80 ng/mL OR at least 50% reduction from peak was permitted. Independent committee of at least two surgeons, two oncologists and one radiologist reviewed original and current lesion maps. These are trial criteria, not identical to current NLRB guidance.", "results": "Primary time origin was randomization. Median follow-up 59.3 months. Five-year ITT OS was 56.6% versus 12.6% (HR 0.37, 95% CI 0.21–0.65); per-protocol OS 73.3% versus 9.3%. Of 47 assigned LT, 38 received LT and 36 were per-protocol; nine had progression-related exclusion/dropout. The control arm included seven subsequent resections and two LT crossovers. Safety population comprised 40 grafted patients. Among 36 per-protocol LT recipients, 26 recurred; 19/26 received chemotherapy and 12/26 local curative-intent treatment. Median per-protocol PFS was 17.4 versus 6.4 months, and secondary PFS after salvage was 35.4 months in the LT arm. Three of 36 per-protocol recipients required retransplantation (primary nonfunction, donor gallbladder cancer, caval obstruction/large-for-size); one postoperative death was reported. Serious adverse events occurred in 32/40 safety LT recipients. Median wait to LT was 50.5 days, which limits transfer to longer-wait systems.", "limits": "Strong evidence for the selected trial population, not for BRAF-mutant, ECOG 2, active extrahepatic, truly NED, resectable or broadly expanded disease. PP survival conditions on reaching treatment and must not replace ITT. The Results recurrence denominator is 26/36; Figure 3 caption says 28 recurrences, consistent with a broader all-grafted report, so do not mix these denominators. QoL collection had only 55/74 per-protocol baseline questionnaires and is descriptive, not proof of a large QoL gain. Priority allocation and rapid access were part of the treatment strategy.", "locator": "Lancet 2024;404:1107–1118. PDF pp.2–4 eligibility/committee; pp.5–6 trial flow/Table 1; pp.8–9 recurrence, safety, retransplantation, Figure 3; p.10 QoL/limitations."}]}}, {"id": "CRLM-B3", "anchor": "crlm-b3", "title": "Molecular findings and previous extrahepatic disease", "status": "Initial expansion limits", "steps": ["biology", "clocks"], "context": "Review molecular markers, CEA, primary-tumor clearance, and any previous disease outside the liver.", "stance": "Do not open molecular/extrahepatic expansions initially; permit KRAS-mutant disease when all other selected criteria are met.", "rules": ["Initial proposed exclusions: BRAF-mutant disease, MSI-H/dMMR disease, R1 primary margins, prior post-primary extrahepatic metastases, pretreatment liver lesion >10 cm, or progression despite treatment. Preserve these as separate research questions; do not combine several relaxations.", "Proposed CEA requirement: strictly <80 ng/mL, including initial activation. Repeat a borderl
