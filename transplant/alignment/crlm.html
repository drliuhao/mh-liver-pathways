ine/unexpected result and review the trajectory; a falling value still ≥80 does not clear this local rule.", "Require ≥6 months of documented control and the applicable ≥12-month CRLM-diagnosis interval. Report ordinary RECIST separately from the NLRB >10% wording; new lesions or concerning growth are HOLD pending central measurement review.", "Confirmed progression resets the proposed six-month control clock after subsequent effective treatment; one improved scan is insufficient. Use the actual application imaging/CEA windows. Do not delay indicated primary surgery to manufacture eligibility."], "tests": "Primary R0 pathology; BRAF, RAS and MMR/MSI; original maximum lesion diameter; complete EHD history; dated CEA; dated response and primary/CRLM diagnosis; current staging.", "allocation": "National guidance, study criteria and local choices remain separate. Confirm current NLRB wording at application and do not substitute RECIST for an expressly different guidance threshold.", "references": ["nlrb", "armd", "transmet", "seca2_10year", "grut", "petcrlm", "ctdna", "ihpba"], "evidence": {"synthesis": "BRAF-wild-type, controlled liver-only disease with a cleared primary has the strongest treatment evidence. KRAS mutation alone was allowed in TransMet (17/47 assigned LT), so a blanket KRAS ban would exceed evidence; that does not prove every molecular subgroup derives equal benefit. Arm D is a warning against stacking expansions. PET/Oslo/CEA markers forecast prognosis in recipients but have not demonstrated that crossing a threshold changes the incremental benefit of LT over modern non-LT care.", "counterevidence": "IHPBA specifically excludes BRAF V600E, whereas NLRB requests BRAF wild type; non-V600E cases are therefore a true guideline/research gap, not automatically eligible. TransMet accepted CEA <80 OR a ≥50% decline, unlike the draft strict <80 rule. SECA-II's excellent long-term outcomes mostly occurred with CEA ≤33, small lesions and low MTV; they cannot establish safety at every nominal upper limit. Negative ctDNA has not been validated to rescue other exclusion criteria.", "certainty": "Moderate-to-high for narrow TransMet eligibility; low/very low for non-V600E BRAF, prior pulmonary disease, R1 primary, ECOG 2, or ctDNA-directed selection. Prognostic association does not equal predictive treatment-benefit validation. Allocation criteria have authoritative administrative status but are not randomized cutoff evidence.", "threshold_basis": "Current NLRB contains six-month/12-month/10-cm/CEA requirements and >10% growth wording. TransMet used at least three months control and a CEA-decline alternative. Oslo >5.5 cm, CEA >80, <2 years and progression are prognostic score components; MTV ~70 is data-derived; TLG 260 is consensus, not the same as Grut's 238.8. Resetting a six-month clock after confirmed progression and requiring repeat CEA are proposed local safeguards, not validated rescue rules.", "studies": [{"key": "transmet", "design_population": "Multicentre open-label randomized trial, 20 European centres, 157 screened and 94 randomized (47 LT-plus-chemotherapy, 47 chemotherapy); 63 screened excluded, including 13 with equivocal unresectability and 36 with progression.", "selection": "Age 18–65; ECOG 0–1; R0 colorectal primary; BRAF nonmutated; no prior or current extrahepatic disease/local recurrence; chemotherapy response or stable disease for at least 3 months, at most three lines. CEA <80 ng/mL OR at least 50% reduction from peak was permitted. Independent committee of at least two surgeons, two oncologists and one radiologist reviewed original and current lesion maps. These are trial criteria, not identical to current NLRB guidance.", "results": "Primary time origin was randomization. Median follow-up 59.3 months. Five-year ITT OS was 56.6% versus 12.6% (HR 0.37, 95% CI 0.21–0.65); per-protocol OS 73.3% versus 9.3%. Of 47 assigned LT, 38 received LT and 36 were per-protocol; nine had progression-related exclusion/dropout. The control arm included seven subsequent resections and two LT crossovers. Safety population comprised 40 grafted patients. Among 36 per-protocol LT recipients, 26 recurred; 19/26 received chemotherapy and 12/26 local curative-intent treatment. Median per-protocol PFS was 17.4 versus 6.4 months, and secondary PFS after salvage was 35.4 months in the LT arm. Three of 36 per-protocol recipients required retransplantation (primary nonfunction, donor gallbladder cancer, caval obstruction/large-for-size); one postoperative death was reported. Serious adverse events occurred in 32/40 safety LT recipients. Median wait to LT was 50.5 days, which limits transfer to longer-wait systems.", "limits": "Strong evidence for the selected trial population, not for BRAF-mutant, ECOG 2, active extrahepatic, truly NED, resectable or broadly expanded disease. PP survival conditions on reaching treatment and must not replace ITT. The Results recurrence denominator is 26/36; Figure 3 caption says 28 recurrences, consistent with a broader all-grafted report, so do not mix these denominators. QoL collection had only 55/74 per-protocol baseline questionnaires and is descriptive, not proof of a large QoL gain. Priority allocation and rapid access were part of the treatment strategy.", "locator": "Lancet 2024;404:1107–1118. PDF pp.2–4 eligibility/committee; pp.5–6 trial flow/Table 1; pp.8–9 recurrence, safety, retransplantation, Figure 3; p.10 QoL/limitations."}, {"key": "seca2_10year", "design_population": "Prospective SECA-II extended follow-up, 25 recipients from April 2012 to November 2023; analysis cutoff 1 January 2025. Includes the original SECA-II cohort.", "selection": "All grafted under SECA-II included. At least one year diagnosis to inclusion and no progression required; one inadvertently transplanted patient had progression on a scan not available to the transplant centre. One early postoperative death was included in survival analyses but excluded from other analyses, so baseline Table 1 denominator is 24. Among these 24, median largest lesion 24 mm (4–48), CEA 3.5 (1–33), PET MTV 7.3 cm³ (0–139); only two MTV >70, two KRAS-mutated, one right-sided ascending primary and one pN2. Oslo scores 0/1/2 were 9/13/2.", "results": "Time zero LT; median follow-up of survivors 97.2 months. Median OS 128.2 months (95% CI 74.8–181.6); five- and ten-year OS 77.8% and 51.5%. Median RFS 24.3 months; 12/25 relapsed, six initially lung-only. Median post-recurrence survival 62.9 months (25.7–101.1); nine had surgery as first recurrence treatment, but only three were classified curative-intent at that first treatment. Twelve had no recurrence over median 74 months; four exceeded ten years without recurrence. Four patients died of metastases more than five years after LT. Reported serious complications: five grade IIIa, three IIIb, one grade V hepatic-artery-thrombosis death.", "limits": "No contemporaneous control and only 25 recipients; highly favorable biology cannot justify broad expansion. Abstract speculates up to 15 potentially cured, body p.5 says up to 13; neither is an observed, validated cure fraction. Use observed survival/recurrence instead. The discussion's assertion that RFS is not valid for efficacy should not erase recurrence burden, treatment harms or QoL; RFS is insufficient alone, not unimportant. Updated survival supersedes rather than adds an independent 83% SECA-II estimate.", "locator": "Ann Surg 2026 early report DOI 10.1097/SLA.0000000000007200; PDF p.2 methods/time origins and early-death handling; p.3 Table 1 and outcomes; pp.4–5 salvage, late death, cure-count discrepancy and complications."}, {"key": "armd", "design_population": "Prospective SECA-II arm D expanded-criteria cohort, ten recipients, without control.", "selection": "Expanded both recipient and donor criteria, including resectable pulmonary metastases and omission of previous stringent response/time restrictions. Eight had pN2 primaries, six poorly differentiated or signet-ring pathology, five right-sided cancers; median 20 liver lesions and largest diameter 59 mm. This was a bundle of adverse features, not an isolated prior-lung-metastasis experiment.", "results": "From LT, median DFS four months and median OS 18 months. Rapid recurrence and limited survival contrast with strictly selected SECA-II, despite use of donor grafts intended to broaden access.", "limits": "Very small and uncontrolled; simultaneous biologic, anatomic and donor expansions prevent estimating the independent effect of prior pulmonary disease, BRAF status, grade or donor quality. Negative experience argues against opening several expansions at once, not that every single deviation has proven futility.", "locator": "BJS Open 2020;4:467–477; full text methods, Tables 1–3 and survival figures."}, {"key": "grut", "design_population": "Retrospective prognostic analysis of 40 SECA recipients (23 SECA-I, 17 SECA-II); overlapping, not a new transplant efficacy cohort.", "selection": "Pretransplant FDG-PET MTV quantified across liver lesions. Outcome-derived ROC cutoff 66.09 cm³ was rounded to 70; TLG cutoff was 238.8, not identical to IHPBA's 260 recommendation. PET timing relative to chemotherapy and LT affects measurement.", "results": "MTV <70 group n=26 versus higher MTV n=14: five-year OS 76% versus 21%, ten-year OS 50% versus 7%, measured from LT. This is a prognostic association in transplanted patients.", "limits": "Data-derived cutoff, small sample, SECA overlap and no non-LT interaction test. Reducing MTV below 70 with treatment has not been shown to cause improved LT benefit; PET negativity cannot certify microscopic eradication.", "locator": "Ann Nucl Med 2022;36:1073–1081; Methods ROC/cutoffs, Results survival tables/figures and PET-timing discussion."}, {"key": "petcrlm", "design_population": "Two-US-centre retrospective study of 26 recipients, 2017–2023; 24 received living-donor grafts. Published abstract reviewed; complete PDF unavailable in searched depots/Downloads.", "selection": "Highly selected CRLM recipients with pre-LT PET, not an unselected screening cohort. Possible institutional and patient overlap with US intensive-LRT, occult-explant and ctDNA reports.", "results": "Eight recurrences; median follow-up 609 days. Abstract reports two-year OS 11/13 and RFS 8/13 among those reaching that follow-up, and median RFS 0.83 versus 4.1 years with MTV at least 70 versus below 70.", "limits": "Small, short follow-up and abstract numerical/CI inconsistencies. Do not reproduce its inconsistent hazard ratio or call the 70-cm³ rule prospectively validated. Retrieve full methods before using for a binding operational cutoff.", "locator": "Liver Transpl 2025;31:298–310; PubMed PMID39526884 abstract only."}, {"key": "ctdna", "design_population": "Observational mixed resection/LT cohort, 52 patients with ctDNA data, 34 preoperative and 18 postoperative tests; only nine paired samples. Abstract-only verification.", "selection": "Guardant360 profiling, variable timing; the 29 mutation types reported are not 29 patients. Not a ctDNA-directed LT eligibility trial.", "results": "All nine paired patients were ctDNA-positive preoperatively; three remained positive postoperatively. Abstract reports postoperative recurrence 57% versus 0% by ctDNA status (P=0.0419).", "limits": "Small numbers, mixed operations, incomplete pairs, possible overlap with other centre cohorts and no strategy comparison. Association supports research and risk discussion, not mandatory negative ctDNA, empirical treatment until negative, or declaring cure from a negative result.", "locator": "JCO Clin Cancer Inform 2023;7:e2300111; PubMed PMID37820293 abstract only."}, {"key": "ihpba", "design_population": "2021 international multidisciplinary consensus; not a prospective eligibility-strategy trial.", "selection": "Distinguishes technical unresectability, biology and organ-allocation ethics. Recommends BRAF V600E exclusion; RAS mutation alone is not an absolute exclusion. MSI-H/dMMR cases should receive effective systemic options and are not routinely recommended for LT.", "results": "No original randomized outcome denominator. Consensus suggests response/observation, CEA trajectory and PET burden (MTV 70 cm³/TLG 260) as risk criteria. Rising CEA >80 is treated more adversely than falling CEA.", "limits": "Expert recommendations differ from current NLRB wording and TransMet criteria; do not merge them into a falsely universal threshold. Non-V600E BRAF is not thereby proven safe for LT, and contemporary guidance requests BRAF-wild-type tumours.", "locator": "Lancet Gastroenterol Hepatol 2021;6:933–946; full PDF selection, molecular, PET and tumour-response statements."}, {"key": "nlrb", "design_population": "Official Adult MELD Exceptions for Transplant Oncology guidance, December 2025 posting checked 24 October 2026. Allocation-review guidance, not national clinical policy or proof of efficacy.", "selection": "CRLM: BRAF wild type, microsatellite stable, R0 primary, at least 12 months from CRLM diagnosis and six months chemotherapy control; pretreatment largest lesion not >10 cm; no post-primary-resection extrahepatic disease, including nodes outside the primary field. Initial CEA exclusion is >80 ng/mL; extensions require <80. NET: known portal-drained GEP primary, well-differentiated G1/G2, Ki-67 <20%, primary and extrahepatic disease resected with at least six months NED; no active extrahepatic disease. Lung/bone/other solid-organ metastasis history is a permanent exception-guidance exclusion.", "results": "No efficacy denominator. NET guidance has no explicit numerical age or hepatic-volume cutoff. CRLM wording excludes >10% diameter growth or new lesions and labels this RECIST 1.1, although conventional RECIST 1.1 progression generally uses at least 20% summed-diameter increase plus an absolute change; record both, do not silently equate them.", "limits": "Clinical judgment, exception endorsement and graft availability are distinct. A reasonable research hypothesis or living donor does not override allocation guidance or demonstrate acceptable benefit. At exactly CEA 80 the initial/extension wording differs; the draft's strict <80 harmonization is a conservative local rule.", "locator": "Official PDF NET pp.8–9; CRLM pp.9–10; introduction on purpose/status."}]}}, {"id": "CRLM-B4", "anchor": "crlm-b4", "title": "Expected benefit, recurrence and graft use", "status": "Benefit and graft-use review", "steps": ["review"], "context": "Compare expected benefit with continued nontransplant treatment and discuss recurrence and future graft use.", "stance": "Accept that recurrence may coexist with meaningful survival benefit, but plan one graft and account for recurrence treatment and all additional graft use.", "rules": ["Before considering transplantation: a patient-specific benefit comparison against accessible non-LT care, feasible recurrence-treatment options, and a realistic local wait/treatment plan. Reassess about every eight weeks while waiting; no unsupported maximum-wait exclusion is imposed.", "Plan one graft per recipient; no planned retransplantation for oncologic recurrence. Rescue of early nononcologic graft failure remains a separate standard transplant/allocation decision and is never promised or withheld by this rule.", "No low recurrence-rate/RFS cutoff is substituted for survival or quality-of-life benefit. Record all-screened outcomes, recurrence treatment burden, time off therapy, graft loss/retransplantation and functional recovery. Apply the one-event early safety pause in ALLOC-B4 to newly activated experimental cohorts."], "tests": "Contemporary comparator; current fitness/control; recurrence options; local access estimate; patient priorities; graft-use and follow-up plan.", "allocation": "Do not promise trial survival where waiting/access differ materially. Count all grafts and downstream allocation consequences, including LDLT recipients who later need DDLT.", "references": ["transmet", "seca2_10year", "armd", "crlm_haip", "wehrle", "nlrb"], "evidence": {"synthesis": "The relevant endpoint is the entire strategy from a shared eligibility/randomization date: access to a first graft, wait-list progression, perioperative death, graft failure, recurrence, salvage treatment, long-term survival and QoL. Recurrence does not erase all benefit, but is a substantial burden; SECA-II shows both long post-recurrence survival and late metastatic death. TransMet's 56.6% ITT survival is the appropriate randomized headline, with 73.3% PP provided only secondarily.", "counterevidence": "TransMet's nine progression dropouts and three retransplants show why post-LT survival alone is inadequate. The 2026 SECA-II ten-year OS was 51.5%, not its five-year 77.8%; four metastatic deaths occurred after five years. Arm D's 18-month median OS cautions against assuming every expanded candidate obtains sufficient benefit. Selected HAIP/conversion patients can have durable survival without a graft, but cross-study comparisons cannot calculate an individual's LT gain.", "certainty": "Moderate-to-high for a survival advantage in selected TransMet patients; low for an individual numerical benefit model, long-wait extrapolation, high-risk graft strategies or predetermined retransplant policy. Long-term SECA-II is informative but small and uncontrolled.", "threshold_basis": "No validated minimum RFS, individual five-year benefit percentage or fixed number of salvage operations establishes acceptable LT value. The two-year/three-year thresholds sometimes used in economic models are not recipient-selection validation. One planned graft and safety-review triggers are institutional ethical/operational proposals.", "studies": [{"key": "transmet", "design_population": "Multicentre open-label randomized trial, 20 European centres, 157 screened and 94 randomized (47 LT-plus-chemotherapy, 47 chemotherapy); 63 screened excluded, including 13 with equivocal unresectability and 36 with progression.", "selection": "Age 18–65; ECOG 0–1; R0 colorectal primary; BRAF nonmutated; no prior or current extrahepatic disease/local recurrence; chemotherapy response or stable disease for at least 3 months, at most three lines. CEA <80 ng/mL OR at least 50% reduction from peak was permitted. Independent committee of at least two surgeons, two oncologists and one radiologist reviewed original and current lesion maps. These are trial criteria, not identical to current NLRB guidance.", "results": "Primary time origin was randomization. Median follow-up 59.3 months. Five-year ITT OS was 56.6% versus 12.6% (HR 0.37, 95% CI 0.21–0.65); per-protocol OS 73.3% versus 9.3%. Of 47 assigned LT, 38 received LT and 36 were per-protocol; nine had progression-related exclusion/dropout. The control arm included seven subsequent resections and two LT crossovers. Safety population comprised 40 grafted patients. Among 36 per-protocol LT recipients, 26 recurred; 19/26 received chemotherapy and 12/26 local curative-intent treatment. Median per-protocol PFS was 17.4 versus 6.4 months, and secondary PFS after salvage was 35.4 months in the LT arm. Three of 36 per-protocol recipients required retransplantation (primary nonfunction, donor gallbladder cancer, caval obstruction/large-for-size); one postoperative death was reported. Serious adverse events occurred in 32/40 safety LT recipients. Median wait to LT was 50.5 days, which limits transfer to longer-wait systems.", "limits": "Strong evidence for the selected trial population, not for BRAF-mutant, ECOG 2, active extrahepatic, truly NED, resectable or broadly expanded disease. PP survival conditions on reaching treatment and must not replace ITT. The Results recurrence denominator is 26/36; Figure 3 caption says 28 recurrences, consistent with a broader all-grafted report, so do not mix these denominators. QoL collection had only 55/74 per-protocol baseline questionnaires and is descriptive, not proof of a large QoL gain. Priority allocation and rapid access were part of the treatment strategy.", "locator": "Lancet 2024;404:1107–1118. PDF pp.2–4 eligibility/committee; pp.5–6 trial flow/Table 1; pp.8–9 recurrence, safety, retransplantation, Figure 3; p.10 QoL/limitations."}, {"key": "seca2_10year", "design_population": "Prospective SECA-II extended follow-up, 25 recipients from April 2012 to November 2023; analysis cutoff 1 January 2025. Includes the original SECA-II cohort.", "selection": "All grafted under SECA-II included. At least one year diagnosis to inclusion and no progression required; one inadvertently transplanted patient had progression on a scan not available to the transplant centre. One early postoperative death was included in survival analyses but excluded from other analyses, so baseline Table 1 denominator is 24. Among these 24, median largest lesion 24 mm (4–48), CEA 3.5 (1–33), PET MTV 7.3 cm³ (0–139); only two MTV >70, two KRAS-mutated, one right-sided ascending primary and one pN2. Oslo scores 0/1/2 were 9/13/2.", "results": "Time zero LT; median follow-up of survivors 97.2 months. Median OS 128.2 months (95% CI 74.8–181.6); five- and ten-year OS 77.8% and 51.5%. Median RFS 24.3 months; 12/25 relapsed, six initially lung-only. Median post-recurrence survival 62.9 months (25.7–101.1); nine had surgery as first recurrence treatment, but only three were classified curative-intent at that first treatment. Twelve had no recurrence over median 74 months; four exceeded ten years without recurrence. Four patients died of metastases more than five years after LT. Reported serious complications: five grade IIIa, three IIIb, one grade V hepatic-artery-thrombosis death.", "limits": "No contemporaneous control and only 25 recipients; highly favorable biology cannot justify broad expansion. Abstract speculates up to 15 potentially cured, body p.5 says up to 13; neither is an observed, validated cure fraction. Use observed survival/recurrence instead. The discussion's assertion that RFS is not valid for efficacy should not erase recurrence burden, treatment harms or QoL; RFS is insufficient alone, not unimportant. Updated survival supersedes rather than adds an independent 83% SECA-II estimate.", "locator": "Ann Surg 2026 early report DOI 10.1097/SLA.0000000000007200; PDF p.2 methods/time origins and early-death handling; p.3 Table 1 and outcomes; pp.4–5 salvage, late death, cure-count discrepancy and complications."}, {"key": "armd", "design_population": "Prospective SECA-II arm D expanded-criteria cohort, ten recipients, without control.", "selection": "Expanded both recipient and donor criteria, including resectable pulmonary metastases and omission of previous stringent response/time restrictions. Eight had pN2 primaries, six poorly differentiated or signet-ring pathology, five right-sided cancers; median 20 liver lesions and largest diameter 59 mm. This was a bundle of adverse features, not an isolated prior-lung-metastasis experiment.", "results": "From LT, median DFS four months and median OS 18 months. Rapid recurrence and limited survival contrast with strictly selected SECA-II, despite use of donor grafts intended to broaden access.", "limits": "Very small and uncontrolled; simultaneous biologic, anatomic and donor expansions prevent estimating the independent effect of prior pulmonary disease, BRAF status, grade or donor quality. Negative experience argues against opening several expansions at once, not that every single deviation has proven futility.", "locator": "BJS Open 2020;4:467–477; full text methods, Tables 1–3 and survival figures."}, {"key": "crlm_haip", "design_population": "Single-centre retrospective HAIP cohort: 1,110 patients treated in 2006–2016, 483 initially unresectable after exclusions; 83 met modified transplant criteria, but only 23 were pretreated, chemotherapy-controlled transplant-like candidates.", "selection": "Selected patients had liver-confined disease without progression on pre-HAIP chemotherapy. The study modified SECA/TransMet criteria: PET, molecular profile, CEA and standardized RECIST response were not mandatory, and primary resection could occur during/after HAIP. Applying at least one year from CRC diagnosis to HAIP left only five of 483 patients. Unresectability considered adequate functional remnant, vascular/biliary preservation and intraoperative ultrasound, not lesion number alone.", "results": "Time zero was HAIP placement, not a common LT-versus-HAIP eligibility date. In the 23 selected pretreated patients, 18/23 (78%) converted to resection; only 10/18 were R0, and 17/18 recurred, with salvage treatment in 15. Median follow-up was 97.7 months; median OS 61 months (95% CI 36–92), five-year OS 53% (36–79), PFS 13 months (9.6–22), hepatic PFS 16 months (11–61). Median treatment comprised five HAIP cycles and nine systemic cycles. Biliary sclerosis requiring stents occurred in 3/23 (13%); one pump-arterial dissection required revision.", "limits": "Selection from a large denominator, modified eligibility, expert-centre availability, retrospective ascertainment and a different time origin prohibit equivalence claims against TransMet. The high conversion rate is clinically important counterevidence to declaring unresectability before specialist conversion review. It does not make HAIP compulsory or establish that its toxicities are an indication to create for LT.", "locator": "Complete accepted manuscript, PDF pp.6–11: cohort derivation, modified criteria, conversion, survival and adverse events; subsequent tables."}, {"key": "wehrle", "design_population": "Single-centre intensive pre-LT locoregional-treatment protocol: 27 evaluated, 16 included, nine transplanted (seven living donor). Abstract-only verification.", "selection": "Median 16 systemic cycles (10–40); Y90 in five, ablation in four, resection in four and HAIP in three. Five grafted patients had no detectable disease and four had treatment-induced cirrhosis.", "results": "Median follow-up 700 days; three recurrences. Reported RFS one year 6/8 (75%) and two years 3/5 (60%) reflects very small mature denominators.", "limits": "This is actual published experience with NED/injury routes, so it must not be described as nonexistent; it is not controlled proof of benefit or a universal cycle-count requirement. Patients likely overlap occult-explant/PET/ctDNA cohorts. Do not intensify treatment to manufacture liver failure.", "locator": "Liver Transpl 2024;30:1238–1249; PMID38833301 published abstract; complete methods pending."}, {"key": "nlrb", "design_population": "Official Adult MELD Exceptions for Transplant Oncology guidance, December 2025 posting checked 24 October 2026. Allocation-review guidance, not national clinical policy or proof of efficacy.", "selection": "CRLM: BRAF wild type, microsatellite stable, R0 primary, at least 12 months from CRLM diagnosis and six months chemotherapy control; pretreatment largest lesion not >10 cm; no post-primary-resection extrahepatic disease, including nodes outside the primary field. Initial CEA exclusion is >80 ng/mL; extensions require <80. NET: known portal-drained GEP primary, well-differentiated G1/G2, Ki-67 <20%, primary and extrahepatic disease resected with at least six months NED; no active extrahepatic disease. Lung/bone/other solid-organ metastasis history is a permanent exception-guidance exclusion.", "results": "No efficacy denominator. NET guidance has no explicit numerical age or hepatic-volume cutoff. CRLM wording excludes >10% diameter growth or new lesions and labels this RECIST 1.1, although conventional RECIST 1.1 progression generally uses at least 20% summed-diameter increase plus an absolute change; record both, do not silently equate them.", "limits": "Clinical judgment, exception endorsement and graft availability are distinct. A reasonable research hypothesis or living donor does not override allocation guidance or demonstrate acceptable benefit. At exactly CEA 80 the initial/extension wording differs; the draft's strict <80 harmonization is a conservative local rule.", "locator": "Official PDF NET pp.8–9; CRLM pp.9–10; introduction on purpose/status."}]}}], "documents": [{"label": "V12 high-risk protocol · DOCX", "url": "/mh-liver-pathways/evidence/2026-10-25/docs/04_CRLM_High_Risk_Protocol_v12.docx", "format": "docx"}]}, "nelm": {"name": "Neuroendocrine liver metastases", "reviews": [{"id": "NET-B1", "anchor": "net-b1", "title": "Does transplantation offer enough additional benefit?", "status": "Benefit review", "steps": ["options"], "context": "Establish what additional benefit transplantation offers over available treatment or surveillance.", "stance": "Require a demonstrable benefit trigger; excellent predicted post-LT survival alone is not enough.", "rules": ["Proposed requirements: favorable-biology unresectable liver disease with controlled primary, plus at least one trigger—refractory functioning syndrome, clinically meaningful liver-related functional compromise, or a prospectively documented credible threat to durable hepatic control despite reasonable alternatives. Do not require established irreversible failure before assessing benefit.", "NET oncology and an independent transplant/HPB reviewer must agree that LT offers meaningful additional survival or symptom/function benefit over the patient’s accessible options, with B2 biological stability satisfied.", "Asymptomatic stable low-burden disease with preserved hepatic function and reasonable durable options defaults to continued non-LT care/observation. Evaluate at least one appropriate treatment strategy; do not require two failures or exhaustion of every therapy. Do not use ENETS illustrative <30%/≥70% figures as a validated calculator."], "tests": "Functional syndrome and treatment response; symptoms/liver reserve; growth trajectory; SSTR status and treatment alternatives; patient goals; independent benefit review.", "allocation": "Favorable clinical prognosis does not establish urgency, exception entitlement or a reason to expose a healthy donor.", "references": ["enets", "milan", "net_matched", "net_maspero2022", "net_kjaer2023", "cabinet", "clarinet", "netter1_final"], "evidence": {"synthesis": "Selected NET recipients can have excellent long-term survival, and comparative cohorts suggest potential benefit, especially over a decade. However, good post-LT survival is not synonymous with large incremental benefit: non-LT eligible patients can also live many years. The best Milan comparison adjusted delayed LT entry but remains confounded and predates most modern sequencing. The multicentre main-body matched OS difference is smaller than its abstract suggests. A credible benefit assessment must include both long-term hepatic threat and competing treatment/transplant harms.", "counterevidence": "Kjaer's eligibility-based non-LT cohort had substantial long-term survival; CLARINET supports prolonged control for indolent Ki-67 <10% disease. CABINET and PRRT offer additional disease-control options, but none is a randomized comparator to LT. Conversely, requiring every systemic option to fail may forfeit the transplant window and is not tested. Maspero documents late multisite recurrence and non-cancer deaths despite excellent LT survival.", "certainty": "Low certainty for a causal LT benefit magnitude and any individual benefit cutoff; moderate certainty that NET biology and modern alternatives vary greatly. High-quality systemic-trial efficacy is indirect for transplant selection. No validated calculator supports the ENETS illustrative 30%/70% survival targets.", "threshold_basis": "No randomized study validates a minimum survival-gain percentage, two-line failure count, or ENETS <30% versus ≥70% prediction. Six-month observation screens biology but does not prove added benefit. Any local two-reviewer requirement and reassessment cadence are governance, not biological cutoffs.", "studies": [{"key": "milan", "design_population": "Single-centre comparative Milan-NET study, 88 eligible patients: 42 LT and 46 non-LT, 1995–2010 era, nonrandomized.", "selection": "Well-differentiated portal-drained GEP primary, primary/extrahepatic disease removed, limited hepatic burden, at least six months stability; age <60 was relative. LT recipients were substantially younger (median 40.5 versus 55.5), and post hoc grading differed, including four G3 in non-LT versus none in LT. Primary regional nodes had been positive in 34/42 LT recipients; this is not evidence supporting active uncleared extrahepatic disease at LT.", "results": "Median follow-up 122 months. Five-/ten-year OS 97.2%/88.8% LT versus 50.9%/22.4% non-LT. Time origin was primary-tumour resection; authors used left-truncated Cox models to account for delayed LT entry. Propensity-adjusted restricted mean survival gain was 6.82 months at five years and 38.43 months at ten years. These are cohort estimates, not individual calculators.", "limits": "Major selection/age/treatment-era differences, small numbers and residual confounding remain despite statistical handling of delayed treatment. Only 4/46 non-LT patients received PRRT, so this is not a modern sequential-care comparator. Patients overlap subsequent Milan series and some multicentre LT studies; do not sum them as independent evidence.", "locator": "Am J Transplant 2016;16:2892–2902; full PDF Methods statistical time origin/left truncation, Tables 1–2 eligibility/characteristics, survival and restricted-mean analyses."}, {"key": "net_matched", "design_population": "International retrospective comparison from 15 centres, 1988–2021: 455 patients (225 LT, 230 liver resection); median follow-up 97 months. Propensity matching produced 96 patients per group.", "selection": "Surgically selected patients, matched on age, grade and primary location. Twenty-seven percent of LT cases had unknown grade; burden, era and treatment history remain imperfectly controlled. Resection and LT do not necessarily address anatomically interchangeable patients.", "results": "Use main Results p.e1067/Table 4: matched five-year OS 75% LT versus 68.3% LR, HR 0.56 (95% CI 0.35–0.90); five-year PFS 64.2% versus 14.2%, HR 0.25 (0.16–0.39), measured from operation. Ninety-day deaths 13/225 LT (5.8%) versus 3/230 LR (1.3%). LT G1 versus G2 five-year OS 92.9% versus 70%; adjusted G2 HR 2.52 (1.15–5.52). Outside-Milan matched OS HR 0.64 (0.31–1.33), not statistically conclusive.", "limits": "Material abstract/body discrepancy: abstract reports matched five-year OS 73% versus 52.8%, whereas main Results/Table 4 report 75% versus 68.3%. The latter is used with explicit discrepancy flag; clarification would be desirable. Matching does not remove unmeasured confounding, missing pathology, era or selection bias. The nonsignificant outside-Milan estimate does not prove no benefit, and ten G3 cases do not validate G3 LT. Overlaps centre cohorts including Milan.", "locator": "Ann Surg 2023 DOI10.1097/SLA.0000000000005663; PDF main Results printed p.e1067/Table 4 for matched outcomes; earlier Tables 1–3 for grade and mortality; abstract on first page differs."}, {"key": "net_maspero2022", "design_population": "Retrospective Milan single-centre series, 1984–2019: 149 liver operations (53 LT, 96 LR), with 104 Milan-eligible cases analysed (48 LT, 56 LR).", "selection": "Portal-drained G1/G2 primary previously resected, no extrahepatic disease, <50% hepatic involvement, at least six months stable disease, age <60 relative. LT and resection had different resectability/age indications. Minimum six-month follow-up inclusion needs care when interpreting early risk; this is not an all-referral cohort.", "results": "Time zero liver operation; median follow-up 158 months LT and 126 LR. Five-year OS 95.5% versus 90%; ten-year OS 93% versus 75%. Ten-year DFS 52% versus 18%; recurrence 25/48 versus 42/56 and median recurrence time 78 versus 24 months. LT recurrence was more often multisite; LR recurrence predominantly liver. Nine LT deaths included three cancer and six non-cancer deaths, including new malignancy, sepsis/lymphoproliferative and cardiovascular causes.", "limits": "Not randomized or anatomically exchangeable; prolonged selected follow-up and differing age can favor LT. Strong overlap with 2016 Milan-NET makes it long-term/alternative-comparator information, not independent confirmation. Late recurrence and immunosuppression-related competing causes matter even with excellent survival.", "locator": "Am J Transplant 2022 DOI10.1111/ajt.17156; complete PDF pp.2–4 methods/time origin/cohort; later survival figures, recurrence table and Discussion."}, {"key": "net_kjaer2023", "design_population": "Single-centre retrospective non-LT panNET cohort, 2000–2021: 519 screened, 41 G1/G2 metastatic patients included; 16 met at least one historical LT framework (Milan 11, ENETS 8, UNOS 13, overlapping).", "selection": "Resected primary, liver metastases, no extra-abdominal disease, age ≤75 and no G3. Definitions modified historical criteria, including Milan age <65 and two 'UNOS' patients with stable regional nodes, so not all meet today's NLRB requirements. Multimodal care included five liver resections, 15 ablations, six embolizations and later-line PRRT, not purely medical therapy.", "results": "Time zero was date LT criteria fulfilled (for remaining patients, initial institutional visit after primary resection with liver metastases). Mean follow-up 5.4 years. Overall 41-patient median OS 9.3 years; five-year OS 64.7% (95% CI 48.2–81.2). Milan subset five-year OS 64.9% (32.2–97.6), ENETS 85.7% (59.8–100), historical UNOS 55.4% (26.0–84.8).", "limits": "Small retrospective selected subgroups with very wide intervals; no internal LT comparator and treatment-era limitations. It challenges the assumption that eligible stage IV NET has uniformly poor non-LT survival; it cannot prove that non-LT is superior to LT. Avoid comparing its eligibility-based survival directly with post-LT curves as if randomized.", "locator": "World J Surg 2023 DOI10.1007/s00268-022-06736-1; complete PDF pp.2–5 methods, time origin, eligibility modifications, treatments and survival tables."}, {"key": "cabinet", "design_population": "CABINET double-blind phase III randomized trial, 298 previously treated progressive well-differentiated NET patients: independent extrapancreatic cohort n=203 and pancreatic cohort n=95, 2:1 cabozantinib versus placebo.", "selection": "Prior PRRT and/or targeted therapy; advanced progressive disease, not specifically liver-only Milan-eligible transplant candidates. Different disease strata and prior-treatment burden preclude direct comparison with LT series.", "results": "Time zero randomization. Median PFS 8.4 versus 3.9 months in extrapancreatic NET (HR 0.38, 95% CI 0.25–0.59), 13.8 versus 4.4 months in panNET (HR 0.23, 0.12–0.42). Objective response 5% and 19% in respective cabozantinib cohorts versus 0% placebo. Grade ≥3 adverse events approximately 62–65% versus 23–27%. The primary report does not establish an LT-comparable OS benefit.", "limits": "High-quality evidence for this systemic-treatment setting, indirect for transplant benefit. A treatment's availability does not mean every candidate must receive it before LT, and its toxicities/tempo must enter individualized comparison. PFS is not OS and placebo control does not represent an entire modern lifetime sequence.", "locator": "N Engl J Med 2025;392:653–665, online 2024; local complete PDF Methods, primary Results, response and safety tables."}, {"key": "clarinet", "design_population": "CLARINET randomized double-blind trial, 204 nonfunctioning advanced enteropancreatic NET patients (101 lanreotide, 103 placebo).", "selection": "SSTR-positive G1/G2 with Ki-67 <10%; 96% had stable disease over the prior 3–6 months; one-third had hepatic burden >25%. It represents indolent disease biology, not all progressive transplant candidates.", "results": "From randomization, median PFS not reached with lanreotide versus 18 months placebo; HR 0.47 (95% CI 0.30–0.73). Twenty-four-month PFS 65.1% versus 33.0%. No significant OS or QoL difference in the primary report. Diarrhea 26% versus 9%.", "limits": "Shows that stability and substantial survival without LT are plausible; does not estimate the added benefit of transplant or support treating all stable low-burden NET. G2 up to 20% and G3 are not represented by this <10% trial threshold.", "locator": "N Engl J Med 2014;371:224–233; local complete PDF eligibility, Results and adverse-event table."}, {"key": "netter1_final", "design_population": "NETTER-1 phase III randomized trial final OS follow-up: 360 assessed, 231 randomized (117 Lu-177-Dotatate, 114 high-dose octreotide), 223 treated in safety population.", "selection": "Progressive, well-differentiated G1/G2 SSTR-positive midgut NET on somatostatin analogue; not a liver-only transplant comparison. Corrected publisher version dated January 2022 reviewed.", "results": "Time zero randomization; median follow-up about 76 months. Median OS 48.0 versus 36.3 months, HR 0.84 (95% CI 0.60–1.17), P=0.30; primary final OS endpoint not met. Forty-one of 114 controls (36%) crossed to PRRT. Two of 111 Lu-treated safety patients developed myelodysplastic syndrome, one fatal. Previously established PFS benefit and long-term tolerability remain relevant despite nonsignificant OS.", "limits": "Crossover, additional therapies, attrition and distinct population prevent using median OS as a transplant counterfactual. Do not equate nonsignificant OS with no clinical activity, or assume PRRT has no long-term marrow risk.", "locator": "Lancet Oncol 2021;22:1752–1763; local corrected PDF pp.5–6 participant flow/crossover/OS; safety Results and Discussion."}, {"key": "enets", "design_population": "ENETS 2026 position statement explicitly addressing controversies; expert, hypothesis-generating framework rather than original comparative outcome study.", "selection": "Reorients toward incremental benefit and proposes substantial liver burden, young/fit patients and selected controllable extrahepatic disease; broadens beyond traditional Milan in some respects.", "results": "No original outcome denominator. Proposed liver-burden bands around 25–70%, age <60 as relative and six-month stability are pragmatic concepts. Illustrative non-LT five-year survival <30% versus post-LT ≥70% are not a calibrated individual benefit model.", "limits": "Do not turn an expert future-oriented proposal into validated numerical gates. Suggested controllable extrahepatic disease, including bone, conflicts with current NLRB solid-organ-metastasis exclusion. It identifies research needs rather than approving an expansion.", "locator": "J Neuroendocrinol 2026;38:e70250; complete position-statement PDF burden, benefit, age, stability and extrahepatic discussion."}]}}, {"id": "NET-B2", "anchor": "net-b2", "title": "Primary site, grade, spread and disease control", "status": "Initial selection limits", "steps": ["biology", "distribution", "observation"], "context": "Confirm differentiation, primary site, prior spread and the duration of disease control.", "stance": "Activate only well-differentiated G1/G2 disease from a known portal-drained GEP primary; retain a six-month biology test.", "rules": ["Require expert pathology with Ki-67 <20% and the applicable mitotic criterion; use the highest reliable representative grade. Exactly 20%, rounding uncertainty or discordance is HOLD for adjudication, not rounding down. Do not impose an unsupported Ki-67 <10 rule or blanket G2 ban.", "G3, NEC, unknown/nonportal primary and active extrahepatic disease have no active cohort in this edition. Previously resected nodes may qualify after complete clearance and the required disease-free interval; document stations and dates. Prior lung/bone/other solid-organ metastases remain outside the current opening pathway.", "Require ≥6 months of stable/responding hepatic disease and ≥6 months without recurrence after primary/extrahepatic clearance. Proposed documentation: at least three comparable assessments spanning baseline, about three months and six months. A suspicious new site is HOLD; confirmed progression restarts observation."], "tests": "Expert grade/Ki-67/mitoses and primary origin; SSTR staging and cross-sectional imaging; complete primary/node/EHD clearance history; three-assessment timeline.", "allocation": "Current NET guidance and clinical consensus differ on some boundaries; favorable guidance does not remove the need to prove B1 benefit.", "references": ["nlrb", "milan", "enets", "net_matched", "spainnet", "eltr213", "netter2", "prrtlt"], "evidence": {"synthesis": "Evidence supports carefully selected well-differentiated G1/G2 portal-drained GEP primaries with cleared primary/extrahepatic disease and observed control. G2 has worse prognosis than G1 in the multicentre series but still meaningful selected survival, so a universal Ki-67 <10% rule would discard potentially suitable G2 without validation. Well-differentiated G3 and poorly differentiated NEC must be separated diagnostically, yet neither has an established LT-benefit pathway. Prior primary regional nodal positivity is not equivalent to active unresected extrahepatic disease.", "counterevidence": "Milan LT cohorts included many patients whose primary nodes had been positive, so 'ever node-positive means never LT' is too broad. However, retrospective final-pathology positive nodes do not negate the current cleared-disease requirement. Spanish OUT cases and the tiny G3 subgroup are too heterogeneous to validate expansion. NETTER-2 proves PRRT activity in selected G3, not LT efficacy after response; seven post-LT PRRT cases cannot guarantee safe salvage. ENETS controllable bone disease conflicts with NLRB's solid-organ exclusion.", "certainty": "Low-to-moderate certainty for G1/G2 prognostic distinction and cautious standard selection; very low certainty for G3, nonportal/unknown primary, active nodes or prior solid-organ metastasis expansions. Official allocation exclusions should be reported separately from biological evidence.", "threshold_basis": "Ki-67 <20% and six months after primary/extrahepatic clearance reflect current NLRB wording; modern WHO grading and the exact-20 boundary need explicit reconciliation. Six months stability derives from selection traditions, not a randomized timing trial. Three serial scans at roughly 0/3/6 months are a proposed local demonstration schedule, not a national mandated scan count.", "studies": [{"key": "milan", "design_population": "Single-centre comparative Milan-NET study, 88 eligible patients: 42 LT and 46 non-LT, 1995–2010 era, nonrandomized.", "selection": "Well-differentiated portal-drained GEP primary, primary/extrahepatic disease removed, limited hepatic burden, at least six months stability; age <60 was relative. LT recipients were substantially younger (median 40.5 versus 55.5), and post hoc grading differed, including four G3 in non-LT versus none in LT. Primary regional nodes had been positive in 34/42 LT recipients; this is not evidence supporting active uncleared extrahepatic disease at LT.", "results": "Median follow-up 122 months. Five-/ten-year OS 97.2%/88.8% LT versus 50.9%/22.4% non-LT. Time origin was primary-tumour resection; authors used left-truncated Cox models to account for delayed LT entry. Propensity-adjusted restricted mean survival gain was 6.82 months at five years and 38.43 months at ten years. These are cohort estimates, not individual calculators.", "limits": "Major selection/age/treatment-era differences, small numbers and residual confounding remain despite statistical handling of delayed treatment. Only 4/46 non-LT patients received PRRT, so this is not a modern sequential-care comparator. Patients overlap subsequent Milan series and some multicentre LT studies; do not sum them as independent evidence.", "locator": "Am J Transplant 2016;16:2892–2902; full PDF Methods statistical time origin/left truncation, Tables 1–2 eligibility/characteristics, survival and restricted-mean analyses."}, {"key": "net_matched", "design_population": "International retrospective comparison from 15 centres, 1988–2021: 455 patients (225 LT, 230 liver resection); median follow-up 97 months. Propensity matching produced 96 patients per group.", "selection": "Surgically selected patients, matched on age, grade and primary location. Twenty-seven percent of LT cases had unknown grade; burden, era and treatment history remain imperfectly controlled. Resection and LT do not necessarily address anatomically interchangeable patients.", "results": "Use main Results p.e1067/Table 4: matched five-year OS 75% LT versus 68.3% LR, HR 0.56 (95% CI 0.35–0.90); five-year PFS 64.2% versus 14.2%, HR 0.25 (0.16–0.39), measured from operation. Ninety-day deaths 13/225 LT (5.8%) versus 3/230 LR (1.3%). LT G1 versus G2 five-year OS 92.9% versus 70%; adjusted G2 HR 2.52 (1.15–5.52). Outside-Milan matched OS HR 0.64 (0.31–1.33), not statistically conclusive.", "limits": "Material abstract/body discrepancy: abstract reports matched five-year OS 73% versus 52.8%, whereas main Results/Table 4 report 75% versus 68.3%. The latter is used with explicit discrepancy flag; clarification would be desirable. Matching does not remove unmeasured confounding, missing pathology, era or selection bias. The nonsignificant outside-Milan estimate does not prove no benefit, and ten G3 cases do not validate G3 LT. Overlaps centre cohorts including Milan.", "locator": "Ann Surg 2023 DOI10.1097/SLA.0000000000005663; PDF main Results printed p.e1067/Table 4 for matched outcomes; earlier Tables 1–3 for grade and mortality; abstract on first page differs."}, {"key": "spainnet", "design_population": "Spanish 13-centre retrospective series of 91 NET LT recipients, 1995–2024; 41 transplanted before 2007; 71 Milan-IN and 20 Milan-OUT.", "selection": "Mixed primary sites/eras and deviations. Pathology data missing in more than 30%; Ki-67 available in 51, with only one documented >20%. Milan-OUT combines different burden, primary, grade and other deviations; it is not a controlled trial of a single burden expansion.", "results": "Time zero LT; median follow-up 6.5 years. Table 5: five-year OS 71.0% IN versus 58.7% OUT, ten-year 55.5% versus 32.0%, fifteen-year 52.2% versus 16.0% (OS comparison P=0.03). Five-year DFS 58.8% versus 36.3%, not statistically significant. Recurrence 52/91; ninety-day mortality 9/91 (9.9%). Nine retransplants: two primary nonfunction, six hepatic artery thrombosis, one rejection.", "limits": "Era, missing pathology, small OUT group and composite deviations preclude validating 50–70% burden, age ≥60, G3 or extrahepatic expansion individually. Nonsignificant DFS is not equivalence. The abstract rounds OUT five-year OS differently; use Table 5 value with locator.", "locator": "J Clin Med 2026;15:938; complete PDF Results, Tables 2–5, postoperative mortality/retransplantation and limitations."}, {"key": "eltr213", "design_population": "European Liver Transplant Registry retrospective multicentre study, 213 recipients at 35 centres, 1982–2009; 107 before 2000 and 106 thereafter. Published primary abstract reviewed.", "selection": "Heterogeneous historical NET pathology and selection; 55% had hepatomegaly. Major additional resection in 24 and minor in 30. Historical poor differentiation is not interchangeable with modern well-differentiated G3.", "results": "Three-month mortality 10%. Five-year OS 52% measured from LT, versus 73% measured from liver-metastasis diagnosis; five-year DFS 30%. Post-2000 five-year OS 59%. Poor differentiation, hepatomegaly and concurrent major resection were adverse; age >45 was adverse in a later-era analysis.", "limits": "The striking time-origin difference illustrates why survival curves cannot be compared casually. Registry era, incomplete grading and nonrandom selection limit modern applicability. Age 45 association does not establish a biological exclusion threshold. Cohort overlap with later multicentre reports is likely.", "locator": "Ann Surg 2013 DOI10.1097/SLA.0b013e31828ee17c; PMID23532105 primary abstract; complete PDF not located."}, {"key": "netter2", "design_population": "NETTER-2 open-label phase III randomized trial: 261 screened, 226 randomized, 151 Lu-177-Dotatate plus octreotide and 75 high-dose octreotide.", "selection": "Newly diagnosed advanced well-differentiated G2 Ki-67 10–20% and G3 >20–55%, SSTR-positive in all target lesions. G3 NET is biologically distinct from poorly differentiated NEC. This was not a trial of transplant eligibility or transplant bridging.", "results": "Time zero randomization. Median PFS 22.8 versus 8.5 months, HR 0.276 (95% CI 0.182–0.418); objective response 43% versus 9.3%. OS was not mature. Safety populations 147 and 73: any grade ≥3 events 35% versus 27%, related grade ≥3 events 16% versus 4%; one myelodysplastic syndrome case and three grade-3 nephrotoxicity events in Lu-treated patients; no drug-related deaths reported.", "limits": "Compelling systemic disease-control evidence for selected well-differentiated G2/G3, not evidence that responding G3 becomes suitable for LT or that marrow/renal injury is irrelevant to future transplantation. No NEC efficacy extrapolation. Full article reviewed now, upgrading prior abstract-only status.", "locator": "Lancet 2024;403:2807–2817; complete PDF eligibility, efficacy, safety and Discussion."}, {"key": "prrtlt", "design_population": "Retrospective seven-recipient case series of PRRT for recurrent NET after LT; abstract-only verification.", "selection": "Post-LT recurrence, not pretransplant bridging or a selection study.", "results": "One partial response, five stable disease, one progression. Two grade-III myelosuppression events, one treatment cessation; proteinuria in four. No rejection reported over limited follow-up.", "limits": "No control, tiny denominator and short follow-up; does not demonstrate durable salvage, long-term graft safety, or justify enrolling G3/extrahepatic cases because PRRT is available later.", "locator": "Transplant Proc 2026;58:526–531; DOI10.1016/j.transproceed.2026.02.019, PMID41760506 abstract."}, {"key": "nlrb", "design_population": "Official Adult MELD Exceptions for Transplant Oncology guidance, December 2025 posting checked 24 October 2026. Allocation-review guidance, not national clinical policy or proof of efficacy.", "selection": "CRLM: BRAF wild type, microsatellite stable, R0 primary, at least 12 months from CRLM diagnosis and six months chemotherapy control; pretreatment largest lesion not >10 cm; no post-primary-resection extrahepatic disease, including nodes outside the primary field. Initial CEA exclusion is >80 ng/mL; extensions require <80. NET: known portal-drained GEP primary, well-differentiated G1/G2, Ki-67 <20%, primary and extrahepatic disease resected with at least six months NED; no active extrahepatic disease. Lung/bone/other solid-organ metastasis history is a permanent exception-guidance exclusion.", "results": "No efficacy denominator. NET guidance has no explicit numerical age or hepatic-volume cutoff. CRLM wording excludes >10% diameter growth or new lesions and labels this RECIST 1.1, although conventional RECIST 1.1 progression generally uses at least 20% summed-diameter increase plus an absolute change; record both, do not silently equate them.", "limits": "Clinical judgment, exception endorsement and graft availability are distinct. A reasonable research hypothesis or living donor does not override allocation guidance or demonstrate acceptable benefit. At exactly CEA 80 the initial/extension wording differs; the draft's strict <80 harmonization is a conservative local rule.", "locator": "Official PDF NET pp.8–9; CRLM pp.9–10; introduction on purpose/status."}, {"key": "enets", "design_population": "ENETS 2026 position statement explicitly addressing controversies; expert, hypothesis-generating framework rather than original comparative outcome study.", "selection": "Reorients toward incremental benefit and proposes substantial liver burden, young/fit patients and selected controllable extrahepatic disease; broadens beyond traditional Milan in some respects.", "results": "No original outcome denominator. Proposed liver-burden bands around 25–70%, age <60 as relative and six-month stability are pragmatic concepts. Illustrative non-LT five-year survival <30% versus post-LT ≥70% are not a calibrated individual benefit model.", "limits": "Do not turn an expert future-oriented proposal into validated numerical gates. Suggested controllable extrahepatic disease, including bone, conflicts with current NLRB solid-organ-metastasis exclusion. It identifies research needs rather than approving an expansion.", "locator": "J Neuroendocrinol 2026;38:e70250; complete position-statement PDF burden, benefit, age, stability and extrahepatic discussion."}]}}, {"id": "NET-B3", "anchor": "net-b3", "title": "Age and liver tumor burden", "status": "Individual review; expansion not activated", "steps": ["review"], "context": "Age and liver replacement require individual benefit assessment; proposed expanded groups remain unactivated.", "stance": "Use age as a review trigger, not an absolute exclusion; retain a conservative opening burden and a separately declared expansion band.", "rules": ["Age ≥60 triggers explicit physiological-reserve, competing-mortality and benefit review; no absolute chronological-age ceiling or invented NET-specific frailty score is adopted.", "Reproducibly estimate liver involvement. <50% is the conservative Milan-derived reference; exactly 50% through 70% is a separate prospective expansion stratum, not automatically active. >70% is outside the initial local program for conservative risk control, not because published evidence proves futility. The 50–70/>70 choices are local proposals, not national limits.", "Low burden, particularly <25%, defaults to non-LT care unless a documented NET-B1 benefit trigger overrides that default. Do not give harmful downstaging solely to cross a percentage boundary."], "tests": "Method/date of volumetric burden; functional reserve/frailty; competing illness; symptom/benefit trigger; current treatment alternatives.", "allocation": "NLRB guidance has no explicit age or liver-percentage ceiling; identify these as local clinical/research choices.", "references": ["milan", "enets", "net_maspero2022", "net_matched", "net_kjaer2023", "spainnet", "eltr213"], "evidence": {"synthesis": "The <50% burden and relative age <60 framework has the best selected-cohort lineage, not proof of a sharp treatment-benefit boundary. Registry associations with age >45 or hepatomegaly do not establish universal bans. More burden may increase need for organ replacement but also worsen prognosis; low burden may predict good post-LT survival while yielding little extra benefit. NLRB's lack of explicit age/burden limits does not validate any expansion.", "counterevidence": "Spanish Milan-OUT survival is lower, but OUT combines many deviations and cannot isolate >50% burden or age ≥60. Matched outside-Milan confidence intervals are wide, not proof of futility. Kjaer's non-LT survival cautions against assuming any eligible patient needs LT. ENETS 25–70% proposal is an expert benefit-oriented hypothesis, not outcome-validated proof that 70% is a biological ceiling.", "certainty": "Low certainty for any causal age/burden threshold; moderate confidence that these variables and liver function must be measured and followed. No prospective trial validates 25%, 50%, 70% or age 60 as a universal increment-benefit boundary.", "threshold_basis": "<50% and age <60 relative originate in Milan selection; age >45 is historical prognostic association, not selection validation. ENETS 25–70% and six-month stability are pragmatic proposals. The V6 50–70% unopened stratum and >70% initial closure are local conservative design choices. Serial volumetry and trajectory matter more than a single imprecise percentage.", "studies": [{"key": "milan", "design_population": "Single-centre comparative Milan-NET study, 88 eligible patients: 42 LT and 46 non-LT, 1995–2010 era, nonrandomized.", "selection": "Well-differentiated portal-drained GEP primary, primary/extrahepatic disease removed, limited hepatic burden, at least six months stability; age <60 was relative. LT recipients were substantially younger (median 40.5 versus 55.5), and post hoc grading differed, including four G3 in non-LT versus none in LT. Primary regional nodes had been positive in 34/42 LT recipients; this is not evidence supporting active uncleared extrahepatic disease at LT.", "results": "Median follow-up 122 months. Five-/ten-year OS 97.2%/88.8% LT versus 50.9%/22.4% non-LT. Time origin was primary-tumour resection; authors used left-truncated Cox models to account for delayed LT entry. Propensity-adjusted restricted mean survival gain was 6.82 months at five years and 38.43 months at ten years. These are cohort estimates, not individual calculators.", "limits": "Major selection/age/treatment-era differences, small numbers and residual confounding remain despite statistical handling of delayed treatment. Only 4/46 non-LT patients received PRRT, so this is not a modern sequential-care comparator. Patients overlap subsequent Milan series and some multicentre LT studies; do not sum them as independent evidence.", "locator": "Am J Transplant 2016;16:2892–2902; full PDF Methods statistical time origin/left truncation, Tables 1–2 eligibility/characteristics, survival and restricted-mean analyses."}, {"key": "net_maspero2022", "design_population": "Retrospective Milan single-centre series, 1984–2019: 149 liver operations (53 LT, 96 LR), with 104 Milan-eligible cases analysed (48 LT, 56 LR).", "selection": "Portal-drained G1/G2 primary previously resected, no extrahepatic disease, <50% hepatic involvement, at least six months stable disease, age <60 relative. LT and resection had different resectability/age indications. Minimum six-month follow-up inclusion needs care when interpreting early risk; this is not an all-referral cohort.", "results": "Time zero liver operation; median follow-up 158 months LT and 126 LR. Five-year OS 95.5% versus 90%; ten-year OS 93% versus 75%. Ten-year DFS 52% versus 18%; recurrence 25/48 versus 42/56 and median recurrence time 78 versus 24 months. LT recurrence was more often multisite; LR recurrence predominantly liver. Nine LT deaths included three cancer and six non-cancer deaths, including new malignancy, sepsis/lymphoproliferative and cardiovascular causes.", "limits": "Not randomized or anatomically exchangeable; prolonged selected follow-up and differing age can favor LT. Strong overlap with 2016 Milan-NET makes it long-term/alternative-comparator information, not independent confirmation. Late recurrence and immunosuppression-related competing causes matter even with excellent survival.", "locator": "Am J Transplant 2022 DOI10.1111/ajt.17156; complete PDF pp.2–4 methods/time origin/cohort; later survival figures, recurrence table and Discussion."}, {"key": "net_matched", "design_population": "International retrospective comparison from 15 centres, 1988–2021: 455 patients (225 LT, 230 liver resection); median follow-up 97 months. Propensity matching produced 96 patients per group.", "selection": "Surgically selected patients, matched on age, grade and primary location. Twenty-seven percent of LT cases had unknown grade; burden, era and treatment history remain imperfectly controlled. Resection and LT do not necessarily address anatomically interchangeable patients.", "results": "Use main Results p.e1067/Table 4: matched five-year OS 75% LT versus 68.3% LR, HR 0.56 (95% CI 0.35–0.90); five-year PFS 64.2% versus 14.2%, HR 0.25 (0.16–0.39), measured from operation. Ninety-day deaths 13/225 LT (5.8%) versus 3/230 LR (1.3%). LT G1 versus G2 five-year OS 92.9% versus 70%; adjusted G2 HR 2.52 (1.15–5.52). Outside-Milan matched OS HR 0.64 (0.31–1.33), not statistically conclusive.", "limits": "Material abstract/body discrepancy: abstract reports matched five-year OS 73% versus 52.8%, whereas main Results/Table 4 report 75% versus 68.3%. The latter is used with explicit discrepancy flag; clarification would be desirable. Matching does not remove unmeasured confounding, missing pathology, era or selection bias. The nonsignificant outside-Milan estimate does not prove no benefit, and ten G3 cases do not validate G3 LT. Overlaps centre cohorts including Milan.", "locator": "Ann Surg 2023 DOI10.1097/SLA.0000000000005663; PDF main Results printed p.e1067/Table 4 for matched outcomes; earlier Tables 1–3 for grade and mortality; abstract on first page differs."}, {"key": "net_kjaer2023", "design_population": "Single-centre retrospective non-LT panNET cohort, 2000–2021: 519 screened, 41 G1/G2 metastatic patients included; 16 met at least one historical LT framework (Milan 11, ENETS 8, UNOS 13, overlapping).", "selection": "Resected primary, liver metastases, no extra-abdominal disease, age ≤75 and no G3. Definitions modified historical criteria, including Milan age <65 and two 'UNOS' patients with stable regional nodes, so not all meet today's NLRB requirements. Multimodal care included five liver resections, 15 ablations, six embolizations and later-line PRRT, not purely medical therapy.", "results": "Time zero was date LT criteria fulfilled (for remaining patients, initial institutional visit after primary resection with liver metastases). Mean follow-up 5.4 years. Overall 41-patient median OS 9.3 years; five-year OS 64.7% (95% CI 48.2–81.2). Milan subset five-year OS 64.9% (32.2–97.6), ENETS 85.7% (59.8–100), historical UNOS 55.4% (26.0–84.8).", "limits": "Small retrospective selected subgroups with very wide intervals; no internal LT comparator and treatment-era limitations. It challenges the assumption that eligible stage IV NET has uniformly poor non-LT survival; it cannot prove that non-LT is superior to LT. Avoid comparing its eligibility-based survival directly with post-LT curves as if randomized.", "locator": "World J Surg 2023 DOI10.1007/s00268-022-06736-1; complete PDF pp.2–5 methods, time origin, eligibility modifications, treatments and survival tables."}, {"key": "spainnet", "design_population": "Spanish 13-centre retrospective series of 91 NET LT recipients, 1995–2024; 41 transplanted before 2007; 71 Milan-IN and 20 Milan-OUT.", "selection": "Mixed primary sites/eras and deviations. Pathology data missing in more than 30%; Ki-67 available in 51, with only one documented >20%. Milan-OUT combines different burden, primary, grade and other deviations; it is not a controlled trial of a single burden expansion.", "results": "Time zero LT; median follow-up 6.5 years. Table 5: five-year OS 71.0% IN versus 58.7% OUT, ten-year 55.5% versus 32.0%, fifteen-year 52.2% versus 16.0% (OS comparison P=0.03). Five-year DFS 58.8% versus 36.3%, not statistically significant. Recurrence 52/91; ninety-day mortality 9/91 (9.9%). Nine retransplants: two primary nonfunction, six hepatic artery thrombosis, one rejection.", "limits": "Era, missing pathology, small OUT group and composite deviations preclude validating 50–70% burden, age ≥60, G3 or extrahepatic expansion individually. Nonsignificant DFS is not equivalence. The abstract rounds OUT five-year OS differently; use Table 5 value with locator.", "locator": "J Clin Med 2026;15:938; complete PDF Results, Tables 2–5, postoperative mortality/retransplantation and limitations."}, {"key": "eltr213", "design_population": "European Liver Transplant Registry retrospective multicentre study, 213 recipients at 35 centres, 1982–2009; 107 before 2000 and 106 thereafter. Published primary abstract reviewed.", "selection": "Heterogeneous historical NET pathology and selection; 55% had hepatomegaly. Major additional resection in 24 and minor in 30. Historical poor differentiation is not interchangeable with modern well-differentiated G3.", "results": "Three-month mortality 10%. Five-year OS 52% measured from LT, versus 73% measured from liver-metastasis diagnosis; five-year DFS 30%. Post-2000 five-year OS 59%. Poor differentiation, hepatomegaly and concurrent major resection were adverse; age >45 was adverse in a later-era analysis.", "limits": "The striking time-origin difference illustrates why survival curves cannot be compared casually. Registry era, incomplete grading and nonrandom selection limit modern applicability. Age 45 association does not establish a biological exclusion threshold. Cohort overlap with later multicentre reports is likely.", "locator": "Ann Surg 2013 DOI10.1097/SLA.0b013e31828ee17c; PMID23532105 primary abstract; complete PDF not located."}, {"key": "enets", "design_population": "ENETS 2026 position statement explicitly addressing controversies; expert, hypothesis-generating framework rather than original comparative outcome study.", "selection": "Reorients toward incremental benefit and proposes substantial liver burden, young/fit patients and selected controllable extrahepatic disease; broadens beyond traditional Milan in some respects.", "results": "No original outcome denominator. Proposed liver-burden bands around 25–70%, age <60 as relative and six-month stability are pragmatic concepts. Illustrative non-LT five-year survival <30% versus post-LT ≥70% are not a calibrated individual benefit model.", "limits": "Do not turn an expert future-oriented proposal into validated numerical gates. Suggested controllable extrahepatic disease, including bone, conflicts with current NLRB solid-organ-metastasis exclusion. It identifies research needs rather than approving an expansion.", "locator": "J Neuroendocrinol 2026;38:e70250; complete position-statement PDF burden, benefit, age, stability and extrahepatic discussion."}]}}], "documents": [{"url": "/mh-liver-pathways/transplant/high-risk/docs/05_NELM_High_Risk_Protocol_v7.pdf", "label": "V7 high-risk protocol · PDF", "format": "pdf", "sha256": "67cb3506b86f5b3ab479c607cbee7a13a40401cc6d2c968902438672108f0af0"}, {"url": "/mh-liver-pathways/transplant/high-risk/docs/05_NELM_High_Risk_Protocol_v7.docx", "label": "V7 high-risk protocol · DOCX", "format": "docx", "sha256": "94c0d1fa300929279855bd6926f5e6569297d612aca4e2393e7465ca7ab27c7e"}]}, "hehe": {"name": "Hepatic epithelioid hemangioendothelioma", "reviews": [{"id": "HEHE-B1", "anchor": "hehe-b1", "title": "Observation and the need for transplantation", "status": "Clinical boundary review", "steps": ["risk"], "context": "Balance observation of disease behavior against liver failure or other reasons transplantation cannot safely wait.", "stance": "Use six months of documented stability as an OPEN default for clinically stable HEHE, with explicit exceptions and continued assessment of whether LT is needed.", "rules": ["In stable disease, propose six months of largely stable biology before final a final decision to proceed with transplantation, with comparable staging and approximately eight-week reassessment. Reliable earlier imaging can count; document the actual diagnosis, staging, registration and observation dates rather than restart a clock at referral.", "Do not delay threatening liver failure, significant progressive symptoms or rapid progression solely to complete six months. Obtain urgent multidisciplinary review of LT versus non-LT treatment; urgency does not itself establish oncologic suitability.", "Six months is an expert-guidance-informed local default, not a national requirement or validated cutoff. Continued stability does not mandate LT: reassess resection, symptom burden, function and benefit over continued observation."], "tests": "Expert EHE pathology; complete liver/systemic staging; symptoms and liver function; interval growth and vascular/node assessment; resection review.", "allocation": "This is a proposed clinical timing choice, not an added NLRB exception requirement. Standard HEHE protocol content is not rewritten in this edition.", "references": ["ehe_lai", "dgvs_lt2024", "ehe_brahmbhatt", "ehe_thomas", "ehe_liu228", "ehe_consensus"], "evidence": {"synthesis": "Observation can expose indolent biology and avoid unnecessary graft use. The 120-day signal is prognostic association among recipients, not a tested intervention. Good US outcomes with a shorter median wait and poor outcomes in a small high-burden cohort both argue for clinical context rather than a stopwatch. DGVS explicitly favors six months of largely stable disease. This expert-guidance counterpoint is more conservative than the earlier four-month local proposal; neither interval has causal comparative validation.", "counterevidence": "There is no randomized immediate-versus-delayed LT comparison. Time accrued before referral, urgent liver failure, selection to survive waiting, lead time and different OS clocks can generate apparent benefits of observation.", "certainty": "Low certainty for selected post-LT survival; very low certainty that a fixed observation interval improves outcomes. No validated universal 120-day eligibility cliff. Lai measured waiting time from waiting-list registration, not completed staging, diagnosis or referral; our proposed staging-based clock is an explicit adaptation.", "threshold_basis": ["Six months: international expert-guidance default, not US policy or a proven biological cliff. Reliable pre-referral stability may contribute.", "120 days: Lai registry exposure measured from waiting-list registration to LT; it is not the same as diagnosis-to-treatment or completed-staging observation and does not causally validate four months.", "Approximately eight-week reassessment and exceptions: local workflow/safety judgment; adjust to disease trajectory."], "studies": [{"key": "ehe_lai", "design_population": "Retrospective ELTR/ELITA; 149 adult LT recipients, 1984–2014; median post-LT follow-up 7.6 years.", "selection": "Transplanted patients only; no randomized observation policy.", "results": "Post-LT 5-year OS 79.5%; 37/149 recurred. Waiting ≤120 days associated with recurrence: Table 5 adjusted HR 2.5 (95% CI 1.2–5.3); 5-year DFS 73.3% versus 86.7% with longer waiting.", "limits": "Confounding by urgency and survivorship; association does not show that waiting causes benefit. Earlier ELTR series overlap. Abstract HR differs slightly from Table 5.", "locator": "Results, Table 5 and Figure 3; use post-LT, not diagnosis-based OS."}, {"key": "ehe_brahmbhatt", "design_population": "UNOS 2002–2018: 131 adults listed; 88 transplanted.", "selection": "Median MELD at LT 7; median wait 78.5 days (IQR 29.5–237.5); 120/131 sought exceptions.", "results": "Post-LT 1/3/5-year OS 88.6%/78.9%/77.2%. Early hepatic-artery-thrombosis graft failure 4.6% versus 0.5% in non-HEHE comparators.", "limits": "Abstract-only extraction. Favorable survival despite median wait <120 days argues against a proven mandatory four-month threshold; not a randomized timing comparison. Older UNOS reports overlap.", "locator": "Published abstract Results; PMID 31577674."}, {"key": "ehe_thomas", "design_population": "Single-center retrospective cohort, n=50; initial surgery 7, systemic/embolization 18, observation 25.", "selection": "Histologically confirmed EHE; 24/50 metastatic at diagnosis; treatment selected clinically.", "results": "Five-year OS from diagnosis: surgery 83.3%, systemic/embolization 71.3%, observation 72.4% (P=.9). Localized versus metastatic: 69% versus 78.3% (P=.7).", "limits": "Small, nonrandom groups; no metastatic patients in initial surgery group. Supports observing selected indolent disease, not equivalence of therapies or a 120-day cutoff.", "locator": "Methods time-origin definition; Table 1 and survival Results."}, {"key": "ehe_liu228", "design_population": "Single-team retrospective cohort 2014–2024: 228 evaluable; LT 8, resection/ablation 49, nonsurgical 171.", "selection": "Half the eight LT patients had a lesion >10 cm, versus 10% of non-LT patients.", "results": "Overall 5-year OS 84.9%; LT 1/3-year OS 62.5%/25%; non-LT 5-year OS 87.8%. Survival time zero is not clearly specified in the extracted Methods; do not relabel as standard post-LT estimates.", "limits": "Major confounding by indication, eight recipients and loss-to-follow-up exclusion. Poor LT results cannot prove LT causes harm; they challenge assuming all HEHE has excellent transplant outcomes.", "locator": "Methods; Tables 1–3; Survival Outcomes/Figure 2."}, {"key": "ehe_consensus", "design_population": "International expert consensus; evidence predominantly retrospective and very-low certainty.", "selection": "Distinguishes asymptomatic/stable systemic EHE from unresectable liver-confined disease.", "results": "Supports initial active surveillance for suitable stable disease and consideration of LT for selected unresectable liver-only EHE; advises against LT with EHD (V,A).", "limits": "Expert recommendation conflicts with ACG key concepts and NLRB guidance. Neither side has randomized EHD transplant-benefit evidence.", "locator": "Management of liver EHE, PDF p8; active-surveillance discussion."}, {"key": "dgvs_lt2024", "design_population": "German S2k consensus guideline; HEHE recommendations dated 2023, publication 2024.", "selection": "Recommendation 3.86 addresses stable disease before LT; 3.85 concerns eligibility for evaluation.", "results": "Recommends at least six months of largely stable disease before LT. Macrovascular invasion or hilar nodes are not absolute barriers to evaluation, which is not equivalent to recommending transplantation.", "limits": "Expert consensus, not a randomized timing comparison or US allocation rule. It supplies a competing six-month option, not proof of superiority to four months.", "locator": "Official society HEHE chapter, recommendations 3.85–3.86."}]}}, {"id": "HEHE-B2", "anchor": "hehe-b2", "title": "Extrahepatic disease and vascular invasion", "status": "Clinical boundary review", "steps": ["stage"], "context": "Assess vascular invasion and any extrahepatic disease separately from the usual liver-only pathway.", "stance": "Start with liver-only disease and no macrovascular invasion; do not automatically broaden access using stable extrahepatic disease or an explant score.", "rules": ["Proposed opening boundary: unresectable liver-only EHE with no macrovascular invasion. Extrahepatic disease is a separate unactivated stratum requiring case-specific discussion, not a national absolute prohibition.", "Resolve suspicious nodes/extrahepatic lesions before proceeding. Do not use an explant-derived score as if it were a validated pretransplant eligibility test.", "Record the guideline disagreement explicitly. A future EHD proposal must specify site, control duration, symptoms, comparator and independent review; “stable EHD” alone is insufficient."], "tests": "Complete staging; expert pathology; vascular assessment; targeted evaluation of suspicious extrahepatic sites; technical resectability and alternative-treatment review.", "allocation": "Clinical selection and exception-review eligibility answer different questions. The proposed liver-only choice is local, not a rewrite of national guidance.", "references": ["nlrb", "ehe_consensus", "acg_fll2024", "ehe_lai", "ehe_liu228", "dgvs_lt2024"], "evidence": {"synthesis": "The disagreement is genuine: ACG/NLRB are permissive about selected EHD, whereas the disease-specific consensus is restrictive. The best registry suggests macrovascular invasion and hilar nodes are adverse; selected EHD was not independently adverse, but the study was too small to establish equivalence. Histology-derived risk scoring cannot be substituted for preoperative staging.", "counterevidence": "A blanket statement that any EHD absolutely forbids LT is inaccurate. Conversely, favorable survival in selected EHD recipients does no
