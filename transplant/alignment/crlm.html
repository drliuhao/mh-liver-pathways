t establish benefit over observation or systemic options for all sites/burdens.", "certainty": "Low certainty for prognostic association; very low for causal EHD benefit or pre-LT score-driven selection.", "threshold_basis": ["No macrovascular invasion: aligns with current favorable NLRB consideration and adverse ELTR prognosis.", "Liver-only opening cohort: conservative local choice despite permissive ACG/NLRB wording; cannot be called universally guideline-mandated.", "EHE-LT score cutoffs: post-LT risk stratification, not a validated pre-LT exclusion test."], "studies": [{"key": "ehe_lai", "design_population": "Same 149-recipient ELTR series; 40 had pre-LT extrahepatic disease.", "selection": "EHD comparison restricted to 23 matched pairs; score uses explant/pathological variables.", "results": "Matched 5-year DFS: EHD 73.5% versus 81.6% without, P=.54. macrovascular invasion adjusted recurrence HR 4.9 (2.4–9.9); hilar nodes HR 2.2 (1.1–4.5). Score groups 0–2/3–5/6–10: 5-year DFS 93.9%/76.9%/38.5%.", "limits": "A nonsignificant small comparison is not equivalence. Score was not validated as a pre-LT eligibility test; grade/stage can be missed before explant.", "locator": "Table 5; propensity-matched analysis; EHE-LT score section."}, {"key": "acg_fll2024", "design_population": "ACG 2024 focal liver lesion guideline, key concepts 34–36.", "selection": "Whole-body CT/MRI staging; recognize variable, sometimes low PET avidity.", "results": "Key concept 35 supports resection if possible and LT when unresectable, including selected EHD. This is a clinical position, not an allocation entitlement.", "limits": "These statements are key concepts, not GRADE-rated recommendations; optimistic comparative language rests on selected series.", "locator": "Table 3 key concepts 34–36, PDF p5; EHE discussion."}, {"key": "ehe_consensus", "design_population": "International expert consensus; evidence predominantly retrospective and very-low certainty.", "selection": "Distinguishes asymptomatic/stable systemic EHE from unresectable liver-confined disease.", "results": "Supports initial active surveillance for suitable stable disease and consideration of LT for selected unresectable liver-only EHE; advises against LT with EHD (V,A).", "limits": "Expert recommendation conflicts with ACG key concepts and NLRB guidance. Neither side has randomized EHD transplant-benefit evidence.", "locator": "Management of liver EHE, PDF p8; active-surveillance discussion."}, {"key": "nlrb", "design_population": "Official December 2025 transplant-oncology exception guidance, current posting checked 24 October 2026.", "selection": "HEHE diagnosis, unresectability and absence of macrovascular invasion are separately considered.", "results": "EHD is not an absolute contraindication in this guidance. No mandatory four-month observation rule is specified.", "limits": "Nonbinding allocation-review guidance; does not demonstrate individual clinical benefit or override donor/clinical judgment.", "locator": "HEHE section p11 and disclaimer p2."}, {"key": "ehe_liu228", "design_population": "Single-team retrospective cohort 2014–2024: 228 evaluable; LT 8, resection/ablation 49, nonsurgical 171.", "selection": "Half the eight LT patients had a lesion >10 cm, versus 10% of non-LT patients.", "results": "Overall 5-year OS 84.9%; LT 1/3-year OS 62.5%/25%; non-LT 5-year OS 87.8%. Survival time zero is not clearly specified in the extracted Methods; do not relabel as standard post-LT estimates.", "limits": "Major confounding by indication, eight recipients and loss-to-follow-up exclusion. Poor LT results cannot prove LT causes harm; they challenge assuming all HEHE has excellent transplant outcomes.", "locator": "Methods; Tables 1–3; Survival Outcomes/Figure 2."}, {"key": "dgvs_lt2024", "design_population": "German S2k consensus guideline; HEHE recommendations dated 2023, publication 2024.", "selection": "Recommendation 3.86 addresses stable disease before LT; 3.85 concerns eligibility for evaluation.", "results": "Recommends at least six months of largely stable disease before LT. Macrovascular invasion or hilar nodes are not absolute barriers to evaluation, which is not equivalent to recommending transplantation.", "limits": "Expert consensus, not a randomized timing comparison or US allocation rule. It supplies a competing six-month option, not proof of superiority to four months.", "locator": "Official society HEHE chapter, recommendations 3.85–3.86."}]}}], "documents": [{"url": "/mh-liver-pathways/transplant/high-risk/docs/06_HEHE_Clinical_Protocol_Boundary_Addendum_v7.pdf", "label": "V7 high-risk boundary addendum · PDF", "format": "pdf", "sha256": "49e34b4546b0e7e8750dba64f33ff1eb4214458e283e1115e905486947dbaf8b"}, {"url": "/mh-liver-pathways/transplant/high-risk/docs/06_HEHE_Clinical_Protocol_Boundary_Addendum_v7.docx", "label": "V7 high-risk boundary addendum · DOCX", "format": "docx", "sha256": "c0a7043c45c8838b100d7c6c98bf75b803178685e1b64a6f37412aab1be408f5"}]}, "hca": {"name": "Hepatocellular adenoma", "reviews": [{"id": "HCA-B1", "anchor": "hca-b1", "title": "Which NLRB recommendation applies?", "status": "Allocation and clinical review", "steps": ["exception-route"], "context": "Review which NLRB recommendation applies, while separately establishing a clinical indication for transplantation.", "stance": "Use the four NLRB routes as OR alternatives, then separately prove a clinical indication for LT.", "rules": ["Document at least one actual guidance route: (1) adenoma with GSD or Abernethy; OR (2) unresectable β-catenin-mutated adenoma; OR (3) unresectable adenoma with adenomatosis >10 lesions (at least 11); OR (4) unresectable AND unresponsive to nonoperative therapy AND progressive or complicated disease.", "Do not require all four routes, and do not impose cirrhosis as a national prerequisite. Conversely, meeting one guidance route does not itself justify surgery.", "Require specialist pathology/radiology and an alternatives review before requesting an exception; proven malignant transformation must be evaluated under the appropriate cancer pathway."], "tests": "Subtype/β-catenin result where needed; lesion count and distribution; GSD/shunt status; resectability; prior nonoperative treatment and complication record. Record the exact lesion count and, when available, the CTNNB1 exon/activation phenotype; exactly ten is not >10.", "allocation": "NLRB wording concerns exception review and remains nonbinding. Submission, eligibility and approval are distinct.", "references": ["nlrb", "acg_fll2024", "easl_benign", "hca_nault", "hca_ziogas"], "evidence": {"synthesis": "Allocation-route eligibility and clinical necessity must be recorded separately. Lesion number, size and molecular subtype identify different questions. The NLRB four-route OR structure is more permissive than older clinical LT guidance; clinical risk still needs confirmation and alternatives review.", "counterevidence": "Adenomatosis is ≥10 in ACG terminology but >10 in the cited NLRB route: exactly ten lesions cannot be silently rounded into >10. Molecular subtypes are not biologically interchangeable. Selected-registry survival does not quantify the benefit of replacing an otherwise functioning liver.", "certainty": "High confidence in the meaning of the current guidance text; low certainty for phenotype-specific LT benefit; moderate biological evidence for subtype heterogeneity, not a validated LT threshold.", "threshold_basis": [">10: literal allocation-guidance wording (at least 11); different from ACG’s diagnostic definition.", "β-catenin: guidance category; genotype/phenotype should inform clinical risk, without silently rewriting the allocation category.", "Need for LT: multidisciplinary clinical decision beyond exception eligibility."], "studies": [{"key": "nlrb", "design_population": "Current NLRB hepatic-adenoma guidance.", "selection": "Four alternative routes; route four contains conjunctive clinical requirements.", "results": "GSD/Abernethy; OR unresectable β-catenin-mutated HCA; OR unresectable adenomatosis >10 lesions; OR unresectable, nonoperative-unresponsive and progressive/complicated HCA.", "limits": "These are review routes, not proof of benefit or a mandatory transplant recommendation. Current text does not require all four conditions simultaneously or cirrhosis for all routes.", "locator": "December 2025 oncology guidance, hepatic adenoma p11."}, {"key": "acg_fll2024", "design_population": "ACG 2024, HCA recommendations/key concepts 11–18.", "selection": "Risk-stratified management and explicit alternative approaches to resection.", "results": "Stable women with lesions ≥5 cm: risk-factor change and 6–12-month observation, resection if not <5 cm. Men/β-catenin lesions warrant earlier definitive review; LT may be considered in selected unresectable/complicated disease.", "limits": "Six versus 6–12 months is a real timing nuance. ACG adenomatosis definition is ≥10, whereas current NLRB route says >10; definitions cannot silently replace each other.", "locator": "Table 3 key concepts 11–18 and HCA management text."}, {"key": "easl_benign", "design_population": "EASL 2016 benign liver tumor guideline.", "selection": "Women after risk-factor modification versus men/β-catenin disease; multifocal disease addressed separately.", "results": "Six-month observation in suitable women; ≥5 cm or growth prompts resection. LT is not routine for multiple adenomas; underlying liver disease can alter consideration.", "limits": "Older clinical guidance is narrower than current NLRB alternative exception routes. A resection threshold is not an LT threshold.", "locator": "HCA recommendations and multiple-HCA discussion, PDF pp9–10."}, {"key": "hca_nault", "design_population": "Molecular study: 533 adenomas from 411 patients across 28 centers.", "selection": "Tissue-based classification, predominantly women; not a prospective population natural-history sample.", "results": "Symptomatic bleeding in 14% of patients; 3% developed HCC. Strong exon-3 CTNNB1 activation tracks malignant risk; exon-7/8 activation is biologically different; sonic-hedgehog subtype associates with bleeding.", "limits": "Observed prevalence is not individual lifetime risk. Molecular risk supports definitive-treatment assessment, not automatic LT or equivalence of all β-catenin variants.", "locator": "Abstract; molecular classification and clinicopathological Results; pp880–894."}, {"key": "hca_ziogas", "design_population": "UNOS 1987–2020: 199 listed; 142 transplanted, including 118 listed for HCA and 24 incidental diagnoses.", "selection": "Mixed adults/children; 32/142 children; 89.4% had no HCC; size/count unavailable.", "results": "Crude waitlist mortality 9.0%. Post-LT 1/3/5-year OS 94.2%/89.7%/86.3%; 5-year CI 78.5–91.5%; median follow-up 62.9 months.", "limits": "No contemporary non-LT comparator; registry indication misclassification. Separate systematic-review patients must not be pooled with UNOS or Chiche as independent evidence.", "locator": "Methods; UNOS Results pp3–5 and Figure 2; not the review-only survival curve."}]}}, {"id": "HCA-B2", "anchor": "hca-b2", "title": "Is transplantation clinically justified?", "status": "Clinical benefit review", "steps": ["standard-care"], "context": "Use transplantation only when standard treatment is not feasible and a clear clinical benefit is established.", "stance": "Keep LT exceptional; size or concern about malignancy alone is not a transplant indication.", "rules": ["For suitable stable women, reassess after six months of hormone/lifestyle optimization; consider continued observation toward twelve months if the lesion is regressing and delay is clinically safe. A lesion ≥5 cm or continued growth triggers resection/other definitive-treatment review, not automatic LT.", "Do not impose that waiting period on hemorrhage, high-risk male/β-catenin disease or confirmed malignant transformation when earlier treatment is appropriate.", "Proposed transplant requirements: two independent specialist reviews confirm that resection is not feasible and nonoperative options are unsuitable or have failed, plus a documented clinical-benefit basis: progressive/complicated disease, underlying liver-disease risk, or a high-risk molecular/malignant-transformation phenotype. Stable unresectable high-risk exon-3 disease is not automatically excluded. Pure diagnostic anxiety or an allocation route without a defined benefit is insufficient."], "tests": "Subtype and malignancy review; sex/hormonal history; serial size; complications; embolization/resection feasibility; hepatic reserve; documented expected benefit and alternatives.", "allocation": "An exception is an allocation mechanism, not proof that expected benefit exceeds donor/graft risk.", "references": ["easl_benign", "hca_chiche", "hca_ziogas", "hca_haring", "hca_tae", "acg_fll2024"], "evidence": {"synthesis": "LT is feasible in carefully selected adenoma patients, but the strongest comparative gap is benefit versus less invasive care. Overdiagnosed malignant transformation, real perioperative/retransplant burden and frequent regression after hormone withdrawal argue against transplantation for concern alone.", "counterevidence": "Some patients have unresectable β-catenin lesions, underlying metabolic/vascular disease, recurrent hemorrhage or uncontrolled progression. For them, waiting or repeated local therapy may be harmful. A six-month reassessment is not a reason to postpone urgent definitive treatment or automatically transplant a stable lesion.", "certainty": "Low certainty for selected LT prognosis; very low for comparative LT benefit. Nonrandomized alternative-treatment data support individualized sequencing, not a universal delay.", "threshold_basis": ["Six months: EASL reassessment point; ACG allows 6–12 months in selected women. Not a mandatory waiting period for men, hemorrhage or malignant transformation.", "≥5 cm/growth: trigger for definitive-treatment/resection assessment, not automatic LT.", "Two independent reviews: local anti-overtreatment safeguard, not a trial-validated number."], "studies": [{"key": "hca_chiche", "design_population": "European retrospective adenomatosis LT series, n=49, 1986–2013.", "selection": "LT for proven HCC 16, suspected HCC 15, progression 8, hemorrhage 5, symptoms 5.", "results": "Only 1/15 suspected-HCC cases had HCC confirmed. Three deaths within 90 days; five retransplants. HCC recurrence in 3/17 with malignant explants, all fatal; 41/49 alive and well at final report.", "limits": "Selected surgical series, not untreated transformation risk; overlaps European cases in later reviews. Low diagnostic yield warns against using suspicion alone.", "locator": "Indications, explant pathology and patient-outcome Results; published pp516–526."}, {"key": "hca_ziogas", "design_population": "UNOS 1987–2020: 199 listed; 142 transplanted, including 118 listed for HCA and 24 incidental diagnoses.", "selection": "Mixed adults/children; 32/142 children; 89.4% had no HCC; size/count unavailable.", "results": "Crude waitlist mortality 9.0%. Post-LT 1/3/5-year OS 94.2%/89.7%/86.3%; 5-year CI 78.5–91.5%; median follow-up 62.9 months.", "limits": "No contemporary non-LT comparator; registry indication misclassification. Separate systematic-review patients must not be pooled with UNOS or Chiche as independent evidence.", "locator": "Methods; UNOS Results pp3–5 and Figure 2; not the review-only survival curve."}, {"key": "hca_haring", "design_population": "Retrospective hormone-withdrawal cohort, n=78.", "selection": "Stopped oral contraception; RECIST diameter response of largest HCA.", "results": "At median 1.3 years after withdrawal, regression >30% 37.2%, complete regression 5.1%, stable 56.4%, progression 1.3%; no HCA-related complications reported.", "limits": "Primary abstract/repository extraction; not a transplant comparison. Follow-up exceeds six months, so it does not prove that six months is a biological deadline.", "locator": "Published/institutional abstract Results; DOI 10.1111/liv.14074."}, {"key": "hca_tae", "design_population": "Six-center retrospective embolization cohort, n=59; 23 bleeding and 36 nonbleeding.", "selection": "Median lesion 76 mm; 57/59 women.", "results": "Six major complications (10%); median diameter 48 mm at median 5.5-month imaging. One death at three months after emergency embolization with hemorrhagic shock; no clinically overt rebleeding of treated lesions.", "limits": "No randomized comparator; embolization is neither harmless nor proven to eliminate malignant potential. Requires lesion-specific technical and pathology assessment.", "locator": "Methods; Safety section pp1364–1365; size-response Results/Figure 1."}, {"key": "easl_benign", "design_population": "EASL 2016 benign liver tumor guideline.", "selection": "Women after risk-factor modification versus men/β-catenin disease; multifocal disease addressed separately.", "results": "Six-month observation in suitable women; ≥5 cm or growth prompts resection. LT is not routine for multiple adenomas; underlying liver disease can alter consideration.", "limits": "Older clinical guidance is narrower than current NLRB alternative exception routes. A resection threshold is not an LT threshold.", "locator": "HCA recommendations and multiple-HCA discussion, PDF pp9–10."}, {"key": "acg_fll2024", "design_population": "ACG 2024, HCA recommendations/key concepts 11–18.", "selection": "Risk-stratified management and explicit alternative approaches to resection.", "results": "Stable women with lesions ≥5 cm: risk-factor change and 6–12-month observation, resection if not <5 cm. Men/β-catenin lesions warrant earlier definitive review; LT may be considered in selected unresectable/complicated disease.", "limits": "Six versus 6–12 months is a real timing nuance. ACG adenomatosis definition is ≥10, whereas current NLRB route says >10; definitions cannot silently replace each other.", "locator": "Table 3 key concepts 11–18 and HCA management text."}]}}], "documents": [{"url": "/mh-liver-pathways/transplant/high-risk/docs/07_HCA_Clinical_Protocol_Boundary_Addendum_v7.pdf", "label": "V7 high-risk boundary addendum · PDF", "format": "pdf", "sha256": "82b1648ce409b3d0de7d100c2d6f4a725f5f090d6cb6cc2466550a84b9ea9bdb"}, {"url": "/mh-liver-pathways/transplant/high-risk/docs/07_HCA_Clinical_Protocol_Boundary_Addendum_v7.docx", "label": "V7 high-risk boundary addendum · DOCX", "format": "docx", "sha256": "003cc1443d5e02c5203e08151dd97049033fb8998db1afbeb653eb8424eb4974"}]}}, "readiness": [{"id": "ALLOC-B1", "anchor": "alloc-b1", "title": "Separate clinical, allocation, donor and study approval", "status": "Proposed operating requirement", "steps": [], "context": "", "stance": "Require 100% completion of the applicable clinical, allocation, donor and research determinations before activation.", "rules": ["Complete six separate dated determinations: clinical suitability; standardized-exception eligibility; nonstandard NLRB review status; calculated-MELD access; LDLT donor clearance; and research authorization. Mark nonapplicable domains explicitly with a reason—do not manufacture six approvals for every patient.", "Any required missing, pending or adverse determination is a HOLD. An exception application is not approval, a donor is not recipient benefit, and clinical approval is not study activation.", "Recheck the current policy/guidance version before each request; record actual decision and priority rather than predicted entitlement."], "tests": "Signed suitability record; exact allocation route and policy version; exception outcome; donor-team status; study and institutional activation record.", "allocation": "Policy 9.4 permits discretionary requests where appropriate; absence of favorable diagnosis-specific guidance is not absence of a review mechanism, and a request does not promise approval.", "references": ["nlrb", "optn", "hhs_irb", "optn_ethics"], "evidence": {"synthesis": "The separation is a governance requirement, not an empirical survival cutoff. A clinically appropriate patient can lack exception eligibility, and an approved exception does not prove clinical benefit. LDLT requires an independent donor determination; a registry entry is not permission to perform experimental transplantation.", "counterevidence": "Not every case needs six separate affirmative approvals: several routes are alternatives or not applicable. An indiscriminate six-approval rule could obstruct appropriate standard care.", "certainty": "High confidence in the separation of applicable authorities; no trial establishes that six boxes improve survival. Local workflow must map to current institutional obligations.", "threshold_basis": ["Six domains: local checklist architecture, not six mandatory national approvals.", "100% applicable completion: governance safeguard, not an outcome-derived percentage.", "Hold pending required authorization: operational implementation of separate clinical, donor and research responsibilities."], "studies": [{"key": "optn", "design_population": "Binding OPTN policy posting effective 1 October 2026, checked 24 October 2026.", "selection": "Clinical candidacy, exception scoring, living-donor protection and reporting have different policy sections.", "results": "Policy 9 governs liver allocation; Policy 14 requires independent donor advocacy/consent; Policy 18 specifies reporting. None establishes a universal cancer-benefit cutoff.", "limits": "A center’s additional safeguards are not national policy. Review the active text and applicability before individual decisions.", "locator": "Policies 9, 14.2–14.4 and 18; current official PDF."}, {"key": "nlrb", "design_population": "Current NLRB hepatic-adenoma guidance.", "selection": "Four alternative routes; route four contains conjunctive clinical requirements.", "results": "GSD/Abernethy; OR unresectable β-catenin-mutated HCA; OR unresectable adenomatosis >10 lesions; OR unresectable, nonoperative-unresponsive and progressive/complicated HCA.", "limits": "These are review routes, not proof of benefit or a mandatory transplant recommendation. Current text does not require all four conditions simultaneously or cirrhosis for all routes.", "locator": "December 2025 oncology guidance, hepatic adenoma p11."}, {"key": "hhs_irb", "design_population": "Federal human-subject protection regulation.", "selection": "Applicability determined by institutional research/regulatory review.", "results": "46.111 requires risk minimization, reasonable risk–benefit, equitable selection, informed consent and appropriate monitoring. IRB approval is separate from OPTN allocation and clinical acceptance.", "limits": "No prescribed ten-patient cap, five-patient interim or one-event statistical boundary; those require protocol-specific design and independent approval.", "locator": "45 CFR 46.111(a)(1–7), current official eCFR text checked 24 October 2026."}, {"key": "optn_ethics", "design_population": "OPTN Ethics Committee white paper, not a trial or binding allocation algorithm.", "selection": "Scarce-organ allocation must balance utility, justice and respect for persons.", "results": "High predicted recipient survival alone is insufficient: opportunity cost, equity and access also matter. Donor autonomy does not remove clinical obligations.", "limits": "Provides an ethical framework, not numeric weights, a universal survival threshold or permission to depart from allocation rules.", "locator": "Introduction; utility/justice/respect-for-persons sections."}]}}, {"id": "ALLOC-B2", "anchor": "alloc-b2", "title": "Assess expected recipient benefit and organ use", "status": "Proposed operating requirement", "steps": [], "context": "", "stance": "Require two independent recipient-benefit reviews and an explicit organ-use case; do not adopt a universal five-year survival cutoff.", "rules": ["Proposed requirements: two reviewers not both responsible for recruitment must document expected incremental benefit over the actual contemporary alternative, with unresolved disagreement referred to the full committee.", "For DDLT, show local expected access/dropout and sensitivity scenarios at 6, 12 and 18 months, total graft use including retransplantation, and plausible alternative recipients. These are planning scenarios, not imposed waiting periods.", "For LDLT, separately show healthy-donor risk and potential downstream deceased-donor graft use. Do not call DCD, extended-criteria grafts or machine perfusion “zero opportunity cost.” No priority changes follow from an AI-selected survival threshold."], "tests": "Same-eligibility/time-zero comparator; expected access; dropout; donor/graft type; uncertainty intervals; graft loss/retransplant estimate; written independent reviews.", "allocation": "Only the applicable allocation process determines priority. Favorable post-LT prognosis, evidence grade and urgency are not interchangeable measures.", "references": ["transmet", "round2_kelly", "optn_ethics", "optn", "hcc_design", "xxl", "hcc_allen2024"], "evidence": {"synthesis": "Use pathway-level benefit from an agreed entry date, not recipient-only survival. Compare with contemporary tumor-specific care and actual local access. LDLT avoids one direct deceased-donor allocation but creates healthy-donor risk and may generate rescue graft use. Graft quality/perfusion changes do not make opportunity cost zero.", "counterevidence": "An ambitious prognosis threshold can exclude patients with substantial incremental benefit, while an indolent tumor can have excellent post-LT survival and little incremental benefit. Local wait times and unequal access can reverse a study’s apparent advantage.", "certainty": "Benefit evidence differs by disease: randomized selected CRLM/HCC pathways cannot be generalized to all expanded indications. Ethical principles are authoritative frameworks, not empirically optimized allocation weights.", "threshold_basis": ["Two reviewers: local independence safeguard, not validated optimum.", "6/12/18 months: sensitivity scenarios for access/dropout, not mandatory waits.", "HCC ≥60% five-year ITT OS: one expert trial-design benchmark; not a cross-cancer allocation policy.", "All grafts: count initial and rescue/retransplant grafts; donor morbidity remains a separate outcome."], "studies": [{"key": "optn_ethics", "design_population": "OPTN Ethics Committee white paper, not a trial or binding allocation algorithm.", "selection": "Scarce-organ allocation must balance utility, justice and respect for persons.", "results": "High predicted recipient survival alone is insufficient: opportunity cost, equity and access also matter. Donor autonomy does not remove clinical obligations.", "limits": "Provides an ethical framework, not numeric weights, a universal survival threshold or permission to depart from allocation rules.", "locator": "Introduction; utility/justice/respect-for-persons sections."}, {"key": "optn", "design_population": "Binding OPTN policy posting effective 1 October 2026, checked 24 October 2026.", "selection": "Clinical candidacy, exception scoring, living-donor protection and reporting have different policy sections.", "results": "Policy 9 governs liver allocation; Policy 14 requires independent donor advocacy/consent; Policy 18 specifies reporting. None establishes a universal cancer-benefit cutoff.", "limits": "A center’s additional safeguards are not national policy. Review the active text and applicability before individual decisions.", "locator": "Policies 9, 14.2–14.4 and 18; current official PDF."}, {"key": "hcc_design", "design_population": "EASL–AASLD–ILCA 2026 trial-design consensus, LT section.", "selection": "Separates standard/UNOS-DS, expanded intermediate HCC and advanced segmental vascular-invasion research populations.", "results": "Calls for entry-level dropout/feasibility, ITT EFS/OS and graft/immune harms; discusses ≥60% five-year ITT OS benchmark in HCC.", "limits": "Expert benchmark, not a validated cross-tumor allocation cutoff or a ten-patient stopping rule; mature five-year endpoints cannot be established after one year.", "locator": "Accepted manuscript pp19–22, LT trial design."}, {"key": "round2_kelly", "design_population": "National SRTR donor cohort 1989–2023: 8,619 with mortality ascertainment; 8,314 with any recovery record.", "selection": "Adults 18–65; 362 eligible donors excluded for missing mortality status.", "results": "Eight deaths by 90 days and 18 by two years; contemporary-era perioperative mortality approximately 0.04%. Only 37–39% had two-year recovery data.", "limits": "All-cause deaths, mostly unavailable cause; not oncology-specific. Low mortality cannot substitute for complete morbidity, psychological and financial follow-up.", "locator": "Methods; Results 3.1–3.4; limitations pp6–7."}, {"key": "xxl", "design_population": "Multicenter randomized phase 2b/3 trial: 74 entered downstaging; 29 dropped out before randomization; 45 responders were randomized, 23 to LT and 22 to nontransplant treatment.", "selection": "Child-Pugh A–B7, ECOG 0–1, predicted five-year post-LT survival ≥50%, and ≥3 months sustained response. AFP rules depended on baseline value and response, not an unconditional AFP <400 entry rule.", "results": "From randomization, five-year overall survival was 77.5% with LT versus 31.2% without LT; tumor-event-free survival 76.8% versus 18.3%; median follow-up 71 months.", "limits": "Strongest causal evidence for LT among selected responders, not for all 74 entrants or unlimited initial burden. Small, prematurely stopped trial. Appendix allowed uncertain bland-versus-neoplastic segmental/type-I portal thrombosis under additional response conditions; the actual PVTT denominator/outcomes are not reported. It must not be relabeled a proven-PVTT trial.", "locator": "Complete accepted manuscript and protocol appendix; final published abstract for survival estimates. Avoid mixing accepted-manuscript and final-publication hazard ratios."}, {"key": "transmet", "design_population": "Multicentre open-label randomized trial, 20 European centres, 157 screened and 94 randomized (47 LT-plus-chemotherapy, 47 chemotherapy); 63 screened excluded, including 13 with equivocal unresectability and 36 with progression.", "selection": "Age 18–65; ECOG 0–1; R0 colorectal primary; BRAF nonmutated; no prior or current extrahepatic disease/local recurrence; chemotherapy response or stable disease for at least 3 months, at most three lines. CEA <80 ng/mL OR at least 50% reduction from peak was permitted. Independent committee of at least two surgeons, two oncologists and one radiologist reviewed original and current lesion maps. These are trial criteria, not identical to current NLRB guidance.", "results": "Primary time origin was randomization. Median follow-up 59.3 months. Five-year ITT OS was 56.6% versus 12.6% (HR 0.37, 95% CI 0.21–0.65); per-protocol OS 73.3% versus 9.3%. Of 47 assigned LT, 38 received LT and 36 were per-protocol; nine had progression-related exclusion/dropout. The control arm included seven subsequent resections and two LT crossovers. Safety population comprised 40 grafted patients. Among 36 per-protocol LT recipients, 26 recurred; 19/26 received chemotherapy and 12/26 local curative-intent treatment. Median per-protocol PFS was 17.4 versus 6.4 months, and secondary PFS after salvage was 35.4 months in the LT arm. Three of 36 per-protocol recipients required retransplantation (primary nonfunction, donor gallbladder cancer, caval obstruction/large-for-size); one postoperative death was reported. Serious adverse events occurred in 32/40 safety LT recipients. Median wait to LT was 50.5 days, which limits transfer to longer-wait systems.", "limits": "Strong evidence for the selected trial population, not for BRAF-mutant, ECOG 2, active extrahepatic, truly NED, resectable or broadly expanded disease. PP survival conditions on reaching treatment and must not replace ITT. The Results recurrence denominator is 26/36; Figure 3 caption says 28 recurrences, consistent with a broader all-grafted report, so do not mix these denominators. QoL collection had only 55/74 per-protocol baseline questionnaires and is descriptive, not proof of a large QoL gain. Priority allocation and rapid access were part of the treatment strategy.", "locator": "Lancet 2024;404:1107–1118. PDF pp.2–4 eligibility/committee; pp.5–6 trial flow/Table 1; pp.8–9 recurrence, safety, retransplantation, Figure 3; p.10 QoL/limitations."}, {"key": "hcc_allen2024", "design_population": "UK national liver-offering policy evaluation: separate simulation dataset of 1,287 registrations/629 donors plus early real-world NLOS implementation, 2018–2020.", "selection": "Transplant-benefit scoring governed national deceased-donor offers; not a high-risk-HCC validation sample.", "results": "Simulation compared observed 2013 deaths/removals 93 (7%) and 4,581 patient-years with modeled TBS outcomes 48 (4%) and 5,262 patient-years. During the first two implementation years, 68% of DBD livers were allocated by TBS; observed waitlist mortality decreased (P<.0001), postlisting survival improved (P=.005), with no adverse post-LT survival signal.", "limits": "Simulated gains are not observed outcomes. Before/after implementation is nonrandomized and can reflect secular changes. Nonetheless it is meaningful evidence that a governed benefit-based system can be deployed, unlike a claim that all such models are unusable.", "locator": "Primary abstract and full publisher Methods/Results, Table 3, DOI 10.1016/j.jhep.2024.03.020; PDF pending."}]}}, {"id": "ALLOC-B3", "anchor": "alloc-b3", "title": "Protect the living donor", "status": "Proposed operating requirement", "steps": [], "context": "", "stance": "Do not relax donor criteria; fund independent follow-up and pause after a serious sentinel donor event.", "rules": ["Proposed readiness requirements: independent donor evaluation/advocacy, documented freedom to withdraw, recipient-benefit uncertainty consent, and funded medical, psychological, recovery and financial follow-up before investigational LDLT.", "Proposed local follow-up: baseline, six weeks, six months, one year, two years, then annually through five years. Meet current OPTN reporting duties separately; this five-year support plan is not claimed to be a national reporting requirement.", "One donor death, life-threatening complication, permanent major disability or liver failure requiring transplantation triggers an immediate pause of the relevant investigational LDLT activity and independent review. Other serious donor harm also warrants review; reopening needs independent authorization."], "tests": "Graft/resection-specific and center-specific risk; donor recovery/employment baseline; independent consent and advocate records; funded follow-up/support; sentinel-event response owner.", "allocation": "LDLT clearance is separate from recipient selection; the potential need for retransplantation must be included in organ-use discussions.", "references": ["optn", "round2_kelly", "donor_a2all", "donor_finance", "donor_xiao"], "evidence": {"synthesis": "Donor mortality is low but not zero; complication, recovery and financial burdens are more frequent. Registry missingness and selected healthy donors limit reassurance. Consent must include uncertain recipient benefit, recurrence and possible early graft loss, without pressure to proceed or relax donor criteria.", "counterevidence": "Older A2ALL complication rates and modern SRTR mortality are different outcomes from overlapping eras/cohorts; do not pool them. Five-year support is a reasonable local response to late morbidity, not a proven optimal schedule. Social vulnerability should trigger assistance, not categorical exclusion.", "certainty": "Moderate certainty for the existence of material donor burden; lower certainty for individual risk and long-term recovery because of incomplete follow-up. No oncology-specific randomized donor-safety comparison.", "threshold_basis": ["Baseline/6 weeks/6 months/1/2 years then annually to five: proposed support schedule; current mandatory reporting remains separately checked.", "One sentinel event: conservative review/pause trigger, not a statistically estimated harm boundary.", "No relaxed donor criteria: protection against shifting uncertain recipient benefit onto a healthy person."], "studies": [{"key": "round2_kelly", "design_population": "National SRTR donor cohort 1989–2023: 8,619 with mortality ascertainment; 8,314 with any recovery record.", "selection": "Adults 18–65; 362 eligible donors excluded for missing mortality status.", "results": "Eight deaths by 90 days and 18 by two years; contemporary-era perioperative mortality approximately 0.04%. Only 37–39% had two-year recovery data.", "limits": "All-cause deaths, mostly unavailable cause; not oncology-specific. Low mortality cannot substitute for complete morbidity, psychological and financial follow-up.", "locator": "Methods; Results 3.1–3.4; limitations pp6–7."}, {"key": "donor_a2all", "design_population": "A2ALL cohort: 760 donor operations begun; 740 completed, mostly right lobes.", "selection": "Multicenter selected donors, older era; standardized complication ascertainment.", "results": "296/740 (40%) had ≥1 complication; 20/760 operations aborted. Five grade-3 residual-disability events and three grade-4 deaths were reported; two deaths were late, not perioperative.", "limits": "Different grading/eras from modern cohorts; A2ALL partly overlaps US registry data. Late hernia/psychological events support follow-up beyond surgical recovery.", "locator": "Methods and Results; complications tables, Am J Transplant 12:1208–1217."}, {"key": "donor_finance", "design_population": "Prospective A2ALL-2 interviews: 271/297 eligible donors, before and through 24 months after donation.", "selection": "Costs and social recovery reported by participants, not randomized financial support.", "results": "Across follow-up, 75% reported nonmedical out-of-pocket expenses and 45% lost wages. Clinical recovery alone therefore misses an important burden of donation.", "limits": "Response/recall and selected-center limitations. Does not validate a particular five-year schedule or predict an individual donor’s financial outcome.", "locator": "Financial Outcomes section and expense tables; Am J Transplant 17:1081–1096."}, {"key": "donor_xiao", "design_population": "Published meta-analysis of 60,829 donors; primary abstract reports 87 articles.", "selection": "Heterogeneous centers, eras and complication definitions; full overlap audit pending.", "results": "Pooled any complication 24.7% (95% CI 21.6–28.1), major 5.5% (4.5–6.7); mortality 0.06% among 49,027 with mortality data.", "limits": "Primary-abstract extraction; not an independent extra 60,829 patients beyond registries. Do not combine with Kelly/A2ALL or promise these rates locally.", "locator": "Published journal abstract; complete PDF requested."}, {"key": "optn", "design_population": "Binding OPTN policy posting effective 1 October 2026, checked 24 October 2026.", "selection": "Clinical candidacy, exception scoring, living-donor protection and reporting have different policy sections.", "results": "Policy 9 governs liver allocation; Policy 14 requires independent donor advocacy/consent; Policy 18 specifies reporting. None establishes a universal cancer-benefit cutoff.", "limits": "A center’s additional safeguards are not national policy. Review the active text and applicability before individual decisions.", "locator": "Policies 9, 14.2–14.4 and 18; current official PDF."}]}}, {"id": "ALLOC-B4", "anchor": "alloc-b4", "title": "Monitor all patients considered for the study", "status": "Proposed operating requirement", "steps": [], "context": "", "stance": "Use a small staged pilot with all-screened accounting and explicit safety pauses; no automatic expansion on favorable recipient survival.", "rules": ["Proposed initial cap: ten transplants per separately approved biological stratum. Review after the first five have 90-day follow-up; no expansion decision until all first ten have at least 12-month follow-up. Reconcile vital status, graft events and known serious harms for every participant; require ≥90% completeness for other prespecified key outcomes.", "In an initial experimental cohort, one all-cause recipient death, graft loss or retransplantation within 90 days triggers a pause of further experimental enrollment/transplantation pending independent review. A later possibly treatment-related death/graft loss or a donor sentinel event also triggers review/pause. Rescue care is never withheld; reopening requires independent authorization.", "These are proposed conservative review triggers, not statistically validated efficacy/futility boundaries. Before opening, biostatistics and the independent board must ratify or replace them with indication-specific rules, denominators, pause authority and reopening criteria.", "Capture every screened candidate, including nonrecipients, conversion to resection, dropout, deaths and access barriers; report survival from entry and from LT, recurrence, graft use, donor recovery and quality of life. Ten survivors alone do not establish benefit or authorize expansion."], "tests": "Locked eligibility strata; prospective entry/time-zero dataset; modern comparator; adverse-event definitions; follow-up-completeness report; independently signed statistical and safety plan.", "allocation": "Study monitoring never changes exception criteria or guarantees future access. Audit access by referral, geography, resources and donor availability without turning protected characteristics into exclusion rules.", "references": ["hcc_design", "consort_pilot", "hhs_irb", "round2_kelly", "systare", "icca_tesla"], "evidence": {"synthesis": "A small pilot can test feasibility, staging fidelity, data capture and acute safety, not prove durable survival benefit. Define time zero, all-screened enrollment, waitlist failures, post-LT survival/recurrence, competing death, all grafts, donor harms and patient-reported outcomes before opening. An independent board needs actual pause/reopening authority.", "counterevidence": "Zero observed events among ten fully followed independent patients still has a one-sided exact 95% binomial upper bound of 25.9% (1−0.05^(1/10)). Thus ten survivors cannot establish a <5% event risk. Ninety percent data completeness permits one missing patient; safety events and vital status require active ascertainment, not tolerance of unaccounted loss.", "certainty": "Strong methodological rationale for predefinition and ITT accounting; no empirical validation of our exact cap/interim/completeness thresholds. Late recurrence demands multi-year follow-up.", "threshold_basis": ["Ten per stratum and interim after five at 90 days: local feasibility cap and safety review cadence.", "Twelve-month minimum: earliest expansion discussion, not proof of long-term cancer benefit.", "≥90%: proposed non-vital key-measure completeness threshold; not permission to ignore deaths/graft events or unknown status.", "One early death/graft loss/re-LT: review/pause trigger, not automatic futility or withholding rescue."], "studies": [{"key": "hcc_design", "design_population": "EASL–AASLD–ILCA 2026 trial-design consensus, LT section.", "selection": "Separates standard/UNOS-DS, expanded intermediate HCC and advanced segmental vascular-invasion research populations.", "results": "Calls for entry-level dropout/feasibility, ITT EFS/OS and graft/immune harms; discusses ≥60% five-year ITT OS benchmark in HCC.", "limits": "Expert benchmark, not a validated cross-tumor allocation cutoff or a ten-patient stopping rule; mature five-year endpoints cannot be established after one year.", "locator": "Accepted manuscript pp19–22, LT trial design."}, {"key": "consort_pilot", "design_population": "CONSORT extension for randomized pilot/feasibility studies.", "selection": "Explores whether/how a definitive study can proceed, distinct from proving efficacy.", "results": "Predefine feasibility objectives and progression criteria; justify sample size and report harms. These principles inform a staged pilot but do not validate our numbers.", "limits": "Scope is randomized pilots; applying principles to single-arm transplant feasibility studies is explicitly an extrapolation.", "locator": "Scope statement and checklist items on objectives, sample size and progression criteria."}, {"key": "hhs_irb", "design_population": "Federal human-subject protection regulation.", "selection": "Applicability determined by institutional research/regulatory review.", "results": "46.111 requires risk minimization, reasonable risk–benefit, equitable selection, informed consent and appropriate monitoring. IRB approval is separate from OPTN allocation and clinical acceptance.", "limits": "No prescribed ten-patient cap, five-patient interim or one-event statistical boundary; those require protocol-specific design and independent approval.", "locator": "45 CFR 46.111(a)(1–7), current official eCFR text checked 24 October 2026."}, {"key": "round2_kelly", "design_population": "National SRTR donor cohort 1989–2023: 8,619 with mortality ascertainment; 8,314 with any recovery record.", "selection": "Adults 18–65; 362 eligible donors excluded for missing mortality status.", "results": "Eight deaths by 90 days and 18 by two years; contemporary-era perioperative mortality approximately 0.04%. Only 37–39% had two-year recovery data.", "limits": "All-cause deaths, mostly unavailable cause; not oncology-specific. Low mortality cannot substitute for complete morbidity, psychological and financial follow-up.", "locator": "Methods; Results 3.1–3.4; limitations pp6–7."}, {"key": "systare", "design_population": "Prospective institutional SYS-TARE pathway; 13 entered, 4 LT, 9 dropout.", "selection": "Single bulky measurable iCCA±peritumoral satellites; diffuse/multisegment multifocal disease excluded; intrahepatic vessel encasement permitted without tumor thrombus.", "results": "Four recipients alive without recurrence at 73, 40, 12, 8 months; dropouts: three unrecovered intrahepatic progression, four with extrahepatic disease, two occult nodes.", "limits": "Only 4 recipients; no validated maximum diameter or comparative proof of satellites being equivalent to a solitary tumor.", "locator": "Transpl Int 2024; 37: 13641; Eligibility, Figure 1 and Results; full PDF."}, {"key": "icca_tesla", "design_population": "Norwegian prospective early report; 7 referred, 6 enrolled, 5 LT.", "selection": "Response-selected liver-confined iCCA; median imaging lesion count 7, median diameter 11.5 cm; no size/number cap.", "results": "All five alive at 10–55 months; 2 recurrences at 12/13 months, both patients with >20 lesions. One HAT required re-LT; one occult 2-mm positive node.", "limits": "Research letter, very small denominator; recurrence pattern argues caution with diffuse multifocal disease, not a validated lesion-count cutoff.", "locator": "BJS 2025; 112: znaf054; main text, Table 1 and Figure 1; complete indexed letter."}]}}], "sources": {"aasld": {"key": "aasld", "short": "AASLD HCC 2023", "title": "AASLD Practice Guidance on prevention, diagnosis, and treatment of hepatocellular carcinoma", "author": "Singal", "journal": "Hepatology (Baltimore, Md.)", "year": 2023, "pmid": "37199193", "doi": "10.1097/HEP.0000000000000466", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10663390/", "pdf_links": [{"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10663390/pdf/nihms-1931411.pdf", "label": "Full PDF · PMC", "method": "PDF link in PMC article HTML"}, {"url": "https://europepmc.org/articles/PMC10663390?pdf=render", "label": "Full PDF · Europe PMC", "method": "Europe PMC DOI-matched fullTextUrlList"}], "tmc": "https://thslc-houston.primo.exlibri ": [{"text": "Include histology/molecular results, primary R0 report, unresectability assessment, baseline tumor burden, all required time intervals and current imaging/CEA. Guidance supports MMaT−20, with floor 15.", "refs": ["N-crlm"]}]}, {"label": "Extension evidence", "items": [{"text": "Every 3 months: CT/MRI chest/abdomen/pelvis and CEA; no hepatic progression or extrahepatic disease, and CEA <80 µg/L.", "refs": ["N-crlm"]}]}], "branches": [{"title": "Clinical and allocation reviews satisfactory", "criteria": [{"text": "The transplant team has accepted the patient, and the NLRB decision and current supporting tests are recorded separately.", "refs": ["N-crlm"]}], "action": "Continue surveillance through final pretransplant review.", "to": "transplant", "kind": "advance", "refs": []}, {"title": "Pending review or borderline renewal", "criteria": [{"text": "A score recommendation is not an entitlement to transplant. Resolve exact CEA 80 or ambiguous progression explicitly.", "refs": ["N-crlm"]}], "action": "Resolve uncertain CEA or progression findings before requesting MELD-exception renewal. Reassess clinical suitability separately before activating the patient for organ offers.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "New extrahepatic disease, hepatic progression or CEA outside the required limit does not meet the CRLM MELD-exception extension criteria; review other treatment options.", "refs": ["N-crlm"]}], "issues": ["cea-progression", "ownership"]}, {"id": "transplant", "title": "Transplant and follow-up", "question": "Do the expected benefits still justify transplantation, and who will monitor for recurrence?", "owner": "Transplant team · colorectal oncology", "timing": "Before transplant and longitudinally afterward", "orders": [{"label": "Final MDT handoff", "items": [{"text": "Recheck stage, disease control, fitness and whether a nontransplant curative option has become feasible.", "refs": ["C-consensus"]}, {"text": "Agree postoperative systemic-treatment considerations and recurrence surveillance with oncology; record outcomes.", "refs": ["C-consensus", "C-transmet"]}]}], "branches": [{"title": "Final clinical acceptance", "criteria": [{"text": "Current selection criteria, consent and responsibility for follow-up are documented; donor acceptance remains a separate clinical decision.", "refs": ["C-consensus"]}], "action": "Proceed to transplantation under the approved program, then follow the agreed oncology and transplant care plan.", "to": null, "kind": "advance", "refs": []}], "stops": [], "issues": ["ownership"]}], "issues": [{"id": "unresectability", "question": "What evidence establishes persistent unresectability?", "comparisons": [{"ref": "N-crlm", "text": "not eligible for curative resection", "quote": true, "locator": "CRLM inclusion criteria"}, {"ref": "C-consensus", "text": "resection should still be done where possible", "quote": true, "locator": "PDF p.3"}, {"ref": "C-transmet", "text": "The randomized evidence concerns carefully selected permanently unresectable disease, not all technically complex CRLM.", "quote": false, "locator": ""}], "proposal": "Require a dated expert HPB assessment of the feasibility of treating all liver disease, the future liver remnant and anatomy at baseline and after treatment response.", "rationale": "Lesion number, bilobar distribution or a historical label alone is insufficient documentation.", "owners": "HPB surgery · transplant surgery · IR · radiology", "record": "CRLM G1", "status": "Discussion required — not yet approved"}, {"id": "treated-lesions", "question": "Does a nonviable-appearing or disappearing liver lesion count as persistent disease?", "comparisons": [{"ref": "C-consensus", "text": "a complete response", "quote": true, "locator": "Statement 24 includes complete response among favorable biology patterns"}, {"ref": "N-crlm", "text": "Guidance requires unresectability/recurrence context and durable control; it does not specify a universal minimum viable or RECIST-measurable lesion count.", "quote": false, "locator": ""}], "proposal": "Map original and current sites, distinguish scar from suspected residual tumor, and assess whether all disease can be treated by resection or ablation. A residual scar or a negative PET alone should not determine transplant selection.", "rationale": "Response, residual viability and technical unresectability answer different questions. This remains case-level judgment, not a new numerical eligibility rule.", "owners": "HPB radiology · HPB/transplant surgery", "record": "CRLM G1 — detailed web subquestion", "status": "Discussion required — not yet approved"}, {"id": "molecular-gates", "question": "Which biomarkers affect CRLM MELD-exception eligibility, and which help estimate prognosis?", "comparisons": [{"ref": "N-crlm", "text": "BRAF wild type, microsatellite stable", "quote": true, "locator": "CRLM inclusion criteria"}, {"ref": "C-consensus", "text": "RAS and other biological factors inform risk and treatment; not every prognostic feature is an automatic allocation exclusion.", "quote": false, "locator": ""}], "proposal": "Identify BRAF wild type and microsatellite stability as the described MELD-exception criteria. Discuss RAS, ctDNA and PET-derived markers separately as prognostic or investigational information.", "rationale": "Do not promote cohort-derived cutoffs into universal policy.", "owners": "Molecular pathology · oncology · transplant team", "record": "CRLM G2", "status": "Discussion required — not yet approved"}, {"id": "control-clock", "question": "Which observation window governs: trial, consensus or NLRB?", "comparisons": [{"ref": "N-crlm", "text": "6 months", "quote": true, "locator": "Stable/regressing disease requirement"}, {"ref": "C-transmet", "text": "Trial eligibility and observation definitions are study-specific; they do not replace current allocation review requirements.", "quote": false, "locator": ""}], "proposal": "Record both clinical treatment-response milestones and the complete NLRB chronology; do not use a shorter response interval as a substitute.", "rationale": "Evidence supporting benefit and rules governing an exception have different purposes.", "owners": "Oncology · coordinator", "record": "CRLM G3", "status": "Discussion required — not yet approved"}, {"id": "primary-clocks", "question": "What if the timing of primary-tumor treatment does not meet the guidance?", "comparisons": [{"ref": "N-crlm", "text": "Guidance contains additional synchronous-primary timing requirements, including primary resection >6 months after diagnosis and further chemotherapy/stability windows.", "quote": false, "locator": ""}, {"ref": "C-consensus", "text": "Primary-tumor management must remain clinically appropriate; transplant selection must not drive unsafe delay of needed surgery.", "quote": false, "locator": ""}], "proposal": "Create a dated chronology and request a documented interpretation if the sequence differs. Do not retrospectively relabel dates or defer necessary care to satisfy wording.", "rationale": "This is a true allocation interpretation issue, not a website checkbox.", "owners": "Colorectal surgery · transplant physician · coordinator", "record": "CRLM G4", "status": "Discussion required — not yet approved"}, {"id": "cea-progression", "question": "How should CEA exactly 80 and the progression footnote be interpreted?", "comparisons": [{"ref": "N-crlm", "text": "Carcinoembryonic antigen (CEA) greater than 80 µg/L", "quote": true, "locator": "Initial exclusion wording"}, {"ref": "N-crlm", "text": "CEA less than 80 µg/L", "quote": true, "locator": "Extension wording"}, {"ref": "N-crlm", "text": "The progression footnote uses >10% diameter increase or any new lesion, while calling it RECIST; usual RECIST 1.1 progression is not this threshold.", "quote": false, "locator": ""}, {"ref": "C-consensus", "text": "Statement 25 distinguishes rising versus falling CEA >80; this is not the same as
