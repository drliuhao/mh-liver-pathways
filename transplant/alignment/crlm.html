rofessionals/physician_gls/pdf/neuroendocrine.pdf", "note": ""}, "NCI-support": {"short": "NCI · supportive and palliative care", "title": "Palliative Care in Cancer", "kind": "Supportive-care reference", "locator": "National Cancer Institute · symptom relief, concurrent palliative care, goals of care and hospice", "url": "https://www.cancer.gov/about-cancer/advanced-cancer/care-choices/palliative-care-fact-sheet", "pdf": "https://www.cancer.gov/about-cancer/advanced-cancer/care-choices/palliative-care-fact-sheet", "note": ""}, "H-yao": {"short": "Yao · Hepatology 2015", "title": "Downstaging of hepatocellular cancer before liver transplant: long-term outcome compared to tumors within Milan criteria", "kind": "Cohort evidence", "locator": "Yao et al. · Hepatology · 2015 · PMID 25689978 · DOI 10.1002/hep.27752", "url": "https://doi.org/10.1002/hep.27752", "pdf": "https://doi.org/10.1002/hep.27752", "note": "Long-term downstaging cohort compared with patients initially within T2. Supports the downstaging approach; it is not the source of current allocation-policy wording."}, "H-milan": {"short": "Mazzaferro · NEJM 1996", "title": "Liver transplantation for the treatment of small hepatocellular carcinomas in patients with cirrhosis", "kind": "Cohort evidence", "locator": "Mazzaferro et al. · New England Journal of Medicine · 1996 · PMID 8594428 · DOI 10.1056/NEJM199603143341104", "url": "https://doi.org/10.1056/NEJM199603143341104", "pdf": "https://doi.org/10.1056/NEJM199603143341104", "note": "Foundational Milan selection cohort; Milan tumor criteria are not identical to OPTN T2 exception requirements."}, "H-merits": {"short": "Mehta · Gastroenterology 2021 · MERITS-LT", "title": "Downstaging Outcomes for Hepatocellular Carcinoma: Results From the MERITS-LT Consortium", "kind": "Prospective cohort evidence", "locator": "Mehta et al. · Gastroenterology · 2021 · PMID 34331914 · DOI 10.1053/j.gastro.2021.07.033", "url": "https://doi.org/10.1053/j.gastro.2021.07.033", "pdf": "https://doi.org/10.1053/j.gastro.2021.07.033", "note": "Prospective multicenter UNOS-downstaging cohort. The current allocation policy controls exact numerical boundaries; cohort selection does not establish exception approval."}, "I-focality": {"short": "CAP · tumor focality", "title": "Intrahepatic bile ducts resection protocol v4.3.0.0", "kind": "Pathology reporting standard", "locator": "June 2025 · AJCC8 pT categories PDF p8; focality PDF p11", "url": "https://www.cap.org/wp-content/uploads/documents/New-Cancer-Protocols-June-2025/BileDuctIH_4.3.0.0.REL_CAPCP.pdf", "pdf": "https://www.cap.org/wp-content/uploads/documents/New-Cancer-Protocols-June-2025/BileDuctIH_4.3.0.0.REL_CAPCP.pdf", "note": ""}, "I-satellites": {"short": "RCPA · tumor focality", "title": "Structured pathology reporting: liver cancer, tumor focality", "kind": "Pathology reporting standard", "locator": "iCCA focality: no clear universal satellite definition", "url": "https://www.rcpa.edu.au/Library/Practising-Pathology/Structured-Pathology-Reporting-of-Cancer/Cancer-Protocols-Pre/Gastrointestinal/Elements-liver-cancer", "pdf": "https://www.rcpa.edu.au/Library/Practising-Pathology/Structured-Pathology-Reporting-of-Cancer/Cancer-Protocols-Pre/Gastrointestinal/Elements-liver-cancer", "note": ""}, "H-policy": {"short": "OPTN 9.5.I", "title": "OPTN Policies — HCC standardized exception", "kind": "Allocation policy", "locator": "Effective October 1, 2026 · §§9.5.I.i–vii · pp.196–200", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=196", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=196", "note": "Policy determines exception eligibility, not whether transplantation is the best clinical treatment. Class 5 now explicitly includes eligible LI-RADS 5 CT/MRI/CEUS or biopsy pathways."}, "P-policy": {"short": "OPTN 9.5.A", "title": "OPTN Policies — hilar CCA standardized exception", "kind": "Allocation policy", "locator": "Effective October 1, 2026 · §9.5.A · pp.190–191", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=190", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=190", "note": "Requires an approved written center protocol, neoadjuvant therapy and operative staging. The mass threshold is strictly <3 cm in radial diameter."}, "N-hcc": {"short": "NLRB · HCC", "title": "Adult MELD exception review guidance — HCC", "kind": "NLRB guidance", "locator": "December 2025 · HCC section · pp.2–4", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=2", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=2", "note": ""}, "N-icca": {"short": "NLRB · iCCA", "title": "Adult MELD exception review guidance — iCCA / mixed HCC-iCCA", "kind": "NLRB guidance", "locator": "December 2025 · pp.7–8", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=7", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=7", "note": ""}, "N-crlm": {"short": "NLRB · CRLM", "title": "Adult MELD exception review guidance — CRLM", "kind": "NLRB guidance", "locator": "December 2025 · pp.9–10, including timing/progression footnotes", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=9", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=9", "note": "Nonstandard consideration, not an automatic exception. The >10% progression footnote must not be presented as the usual RECIST 1.1 progression definition."}, "N-net": {"short": "NLRB · NET", "title": "Adult MELD exception review guidance — NET", "kind": "NLRB guidance", "locator": "December 2025 · pp.8–9", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=8", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=8", "note": ""}, "N-hehe": {"short": "NLRB · HEHE", "title": "Adult MELD exception review guidance — HEHE", "kind": "NLRB guidance", "locator": "December 2025 · pp.10–11", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=10", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=10", "note": ""}, "N-hca": {"short": "NLRB · HCA", "title": "Adult MELD exception review guidance — hepatic adenoma", "kind": "NLRB guidance", "locator": "December 2025 · p.11", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=11", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=11", "note": ""}, "H-aasld": {"short": "AASLD · HCC", "title": "AASLD Practice Guidance: prevention, diagnosis, and treatment of HCC", "kind": "Clinical guidance", "locator": "2023 · diagnosis pp.11–13; resection pp.15–18; transplant pp.19–23 (PDF pages)", "url": "https://doi.org/10.1097/HEP.0000000000000466", "pdf": "https://doi.org/10.1097/HEP.0000000000000466", "note": "The transplant/diagnostic sections are cited here. Systemic treatment updates belong in the linked cancer roadmap, not this transplant checklist."}, "C-aasld": {"short": "AASLD · CCA", "title": "AASLD Practice Guidance on PSC and cholangiocarcinoma", "kind": "Clinical guidance", "locator": "2023 · pCCA diagnosis / transplantation · PDF pp.26–28; iCCA treatment section", "url": "https://doi.org/10.1002/hep.32771", "pdf": "https://doi.org/10.1002/hep.32771", "note": ""}, "P-cohort": {"short": "pCCA · multicenter", "title": "Neoadjuvant chemoradiation followed by LT for perihilar CCA: 12-center experience", "kind": "Cohort evidence", "locator": "Darwish Murad et al. · Gastroenterology · 2012", "url": "https://doi.org/10.1053/j.gastro.2012.04.008", "pdf": "https://doi.org/10.1053/j.gastro.2012.04.008", "note": ""}, "I-cohort": {"short": "Very-early iCCA", "title": "Liver transplantation for very early iCCA: international retrospective study", "kind": "Cohort evidence", "locator": "Sapisochin et al. · Hepatology · 2016", "url": "https://doi.org/10.1002/hep.28744", "pdf": "https://doi.org/10.1002/hep.28744", "note": ""}, "C-consensus": {"short": "IHPBA · CRLM", "title": "Liver transplantation for non-resectable CRLM: IHPBA consensus guidelines", "kind": "Expert consensus", "locator": "2021 · resectability / selection pp.3–5; response assessment pp.7–8 (PDF pages)", "url": "https://doi.org/10.1016/S2468-1253(21)00219-3", "pdf": "https://doi.org/10.1016/S2468-1253(21)00219-3", "note": ""}, "C-transmet": {"short": "TransMet · RCT", "title": "Liver transplantation plus chemotherapy versus chemotherapy alone: TransMet", "kind": "Randomized trial", "locator": "Adam et al. · Lancet · 2024", "url": "https://doi.org/10.1016/S0140-6736(24)01595-2", "pdf": "https://doi.org/10.1016/S0140-6736(24)01595-2", "note": "Trial selection and outcomes support a selected permanently unresectable population; trial eligibility is not interchangeable with NLRB guidance."}, "NET-milan": {"short": "Milan-NET · cohort", "title": "The long-term benefit of liver transplantation for hepatic metastases from NETs", "kind": "Cohort evidence", "locator": "Mazzaferro et al. · AJT · 2016 · Table 1, PDF p.2", "url": "https://doi.org/10.1111/ajt.13831", "pdf": "https://doi.org/10.1111/ajt.13831", "note": "Nonrandomized selected cohort. Milan-NET age and burden criteria are not identical to all NLRB wording."}, "E-consensus": {"short": "EHE · consensus", "title": "Epithelioid hemangioendothelioma: international consensus", "kind": "Expert consensus", "locator": "ESMO Open · 2021 · liver-specific / transplant management", "url": "https://doi.org/10.1016/j.esmoop.2021.100170", "pdf": "https://doi.org/10.1016/j.esmoop.2021.100170", "note": ""}, "E-score": {"short": "HEHE-LT · cohort", "title": "HEHE and adult LT: a prognostic score based on the ELTR-ELITA registry", "kind": "Cohort evidence", "locator": "Lai et al. · Transplantation · 2017", "url": "https://doi.org/10.1097/TP.0000000000001603", "pdf": "https://doi.org/10.1097/TP.0000000000001603", "note": "Retrospective prognostic model. Some variables are established pathologically; do not assume they are all reliably known before transplant."}, "A-easl": {"short": "EASL · benign tumors", "title": "EASL Clinical Practice Guidelines on benign liver tumours", "kind": "Clinical guidance", "locator": "2016 · HCA management / multiple lesions · PDF pp.9–10", "url": "https://doi.org/10.1016/j.jhep.2016.04.001", "pdf": "https://doi.org/10.1016/j.jhep.2016.04.001", "note": ""}, "A-molecular": {"short": "HCA · molecular", "title": "Molecular classification of HCA associates with bleeding and malignant transformation", "kind": "Cohort evidence", "locator": "Nault et al. · Gastroenterology · 2017", "url": "https://doi.org/10.1053/j.gastro.2016.11.042", "pdf": "https://doi.org/10.1053/j.gastro.2016.11.042", "note": "Molecular risk stratification informs clinical judgment. Any local restriction to a particular β-catenin exon must be distinguished from the NLRB criteria for MELD-exception review."}, "V12-AFP_RESPONSE": {"short": "Mehta 2019: AFP response", "title": "Alpha-Fetoprotein Decrease from > 1,000 to < 500 ng/mL in Patients with Hepatocellular Carcinoma Leads to Improved Posttransplant Outcomes.", "kind": "Full-text clinical evidence", "locator": "Main PDF pp 3–9; Tables 1–3 and Figures 1–3.", "url": "https://doi.org/10.1002/hep.30413", "doi": "10.1002/hep.30413", "pmid": "30548884", "note": "Five-year post-LT OS: 48.8% with final AFP >1000, 67.0% at 101–499, and 88.4% at ≤100. Corresponding Kaplan–Meier recurrence estimates: 35.0%, 13.3%, and 7.2%. The 500–1000 group had only 17 patients. Differences between ≤100 and 101–499 were not statistically significant. Recipient-only, selected historical cohort; treatment and waiting time differed substantially between groups. Non-HCC death was censored for recurrence. No proof that forcing AFP lower causes benefit, no AFP-only/imaging-complete-response subgroup, and no LDLT validation. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1002/hep.30413"}, "V12-AFP_500": {"short": "Goldman 2022: final AFP ≥500", "title": "Lower Alpha-Fetoprotein Threshold of 500 ng/mL for Liver Transplantation May Improve Posttransplant Outcomes in Patients With Hepatocellular Carcinoma.", "kind": "Full-text clinical evidence", "locator": "Main PDF pp 4–9; Tables 1–3 and Figures 1–3.", "url": "https://doi.org/10.1002/lt.26392", "doi": "10.1002/lt.26392", "pmid": "34927344", "note": "Five-year OS at final AFP <100 / 100–499 / ≥500: 72.7% / 70.4% / 56.1%; recurrence: 13.1% / 18.7% / 24.2%. Final AFP ≥500: adjusted mortality HR 1.50 (95% CI 1.07–2.10), recurrence HR 1.88 (1.13–3.14). Historical recipient-only study, not a comparison of transplant versus no transplant. Many had only one AFP. In the ≥500 subgroup, 40.4% were ≥1000; small subgroups cannot establish equivalence. Recurrence estimates censor competing death. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1002/lt.26392"}, "V12-AFP_SLOPE": {"short": "Giard 2018: AFP slope", "title": "Alpha-Fetoprotein Slope >7.5 ng/mL per Month Predicts Microvascular Invasion and Tumor Recurrence After Liver Transplantation for Hepatocellular Carcinoma.", "kind": "Full-text clinical evidence", "locator": "Main PDF pp 2–6; Tables 1–4 and Figure 1.", "url": "https://doi.org/10.1097/TP.0000000000002094", "doi": "10.1097/TP.0000000000002094", "pmid": "29505494", "note": "AFP slope >7.5 ng/mL/month: adjusted recurrence HR 3.0 (1.1–8.1), microvascular invasion OR 6.8 (1.6–28.7). Five-year recurrence-free probability 69.8% versus 87.4%; survival without recurrence 59.5% versus 75.3%. These are different endpoints, neither pair should be labeled overall survival. Small, data-selected cutoff group; no prospective hold/release validation. The long-term fitted slope cannot be inferred reliably from two closely spaced noisy results. Death was censored for recurrence-free probability. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1097/TP.0000000000002094"}, "V12-AFP_NYCA": {"short": "Halazun 2021: dynamic AFP/NYCA", "title": "Dynamic α-Fetoprotein Response and Outcomes After Liver Transplant for Hepatocellular Carcinoma.", "kind": "Full-text clinical evidence", "locator": "Main PDF pp 1–8; Table 1, Figures 1–3. Trailing commentary is not a separate reviewed study.", "url": "https://doi.org/10.1001/jamasurg.2021.0954", "doi": "10.1001/jamasurg.2021.0954", "pmid": "33950167", "note": "Five-year competing-risk cumulative recurrence: 9.5%, 20.5%, 40.5% for low/intermediate/high NYCA categories. Discrimination C statistic 0.66. These are composite-score categories, not isolated AFP ranges. Recipient selection, exclusion of early deaths, no waitlist dropout or transplant-benefit comparison. Maximum-to-final AFP can miss a rebound below the original peak. Extreme-AFP response subgroup was tiny. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1001/jamasurg.2021.0954"}, "V12-AFP_OCCULT": {"short": "Moriyama 2026: markers before imaging recurrence", "title": "Management and Prognosis of HCC Patients With Elevated Tumor Markers but no Imaging Recurrence After Radiofrequency Ablation.", "kind": "Full-text clinical evidence", "locator": "All nine main-PDF pages; methods, Tables 2–4, Figures 1–3. External Tables S1/S2 not supplied.", "url": "https://doi.org/10.1002/cam4.71812", "doi": "10.1002/cam4.71812", "pmid": "42010805", "note": "Recurrence was subsequently identified in 886 episodes; median detection interval 89 days. Local curative treatment 83.5% versus 78.8% and post-recurrence OS 3.55 versus 3.31 years for detection ≤180 versus >180 days; differences were not statistically significant. RFA-specific, repeated episodes and competing losses; no LT cohort or tested optimal recall interval. Routine imaging is described as every four months in methods versus quarterly in abstract. Case-level AFP discrepancy between Figure 3 and Table 4 is not used. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1002/cam4.71812"}, "V12-SHARP": {"short": "SHARP: sorafenib", "title": "Sorafenib in Advanced Hepatocellular Carcinoma", "kind": "Full-text clinical evidence", "locator": "NEJM main PDF pp 1–13, especially efficacy and safety Tables 2–3.", "url": "https://doi.org/10.1056/NEJMoa0708857", "doi": "10.1056/NEJMoa0708857", "pmid": "18650514", "note": "Median OS 10.7 versus 7.9 months; HR 0.69 (0.55–0.87). Radiologic time to progression 5.5 versus 2.8 months, HR 0.58; this is not PFS. ORR 2% versus 1%, no complete responses. Historical placebo comparison, not a comparison with current ICI combinations. Grade 3 diarrhea and hand–foot reaction each 8%; dose interruptions/reductions frequent. Little evidence for decompensated cirrhosis. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1056/NEJMoa0708857"}, "V12-ASCO_BTC": {"short": "ASCO BTC living guideline 2026.1.0", "title": "Treatment of Advanced Biliary Tract Cancer: ASCO Living Guideline, Version 2026.1.0.", "kind": "Full-text clinical evidence", "locator": "All 56 pages; recommendations Table 1 pp 40–42; Figure 1 p 34 visually inspected. Separate data supplement not reviewed.", "url": "https://doi.org/10.1200/JCO-26-02462", "doi": "10.1200/JCO-26-02462", "pmid": "42874012", "note": "Broad tissue DNA/RNA profiling, MMR and HER2 testing at diagnosis. For eligible MSS/pMMR disease: GemCis plus durvalumab or pembrolizumab (high-quality/strong); GemCis without ICI if unsuitable (conditional). After progression without an actionable target: FOLFOX plus active symptom control or active symptom control alone (conditional). For oxaliplatin-ineligible patients, irinotecan/nal-IRI-based options have low-quality conditional support, not equal default status. Rare targets often rely on small basket cohorts. Accepted-manuscript tables/narrative contain inconsistent estimates; primary trial results govern this update. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1200/JCO-26-02462"}, "V12-NALIRICC": {"short": "NALIRICC: negative BTC randomized trial", "title": "Nanoliposomal irinotecan and fluorouracil plus leucovorin versus fluorouracil plus leucovorin in patients with cholangiocarcinoma and gallbladder carcinoma previously treated with gemcitabine-based therapies (AIO NALIRICC): a multicentre, open-label, randomised, phase 2 trial", "kind": "Full-text clinical evidence", "locator": "Main PDF pp 1–11; Figure 2 and Tables 1–3.", "url": "https://doi.org/10.1016/S2468-1253(24)00119-5", "doi": "10.1016/S2468-1253(24)00119-5", "pmid": "38870977", "note": "PFS 2.6 versus 2.3 months, HR 0.87 (0.56–1.35); OS 6.9 versus 8.2 months, HR 1.08 (0.68–1.72). ORR 14% versus 4% did not translate into PFS/OS benefit. Grade ≥3 events 71% versus 50%; treatment-related serious events 33% versus 2%. Small phase II trial; subsequent therapy differed (more control patients received later therapy). This does not erase the negative primary PFS result. Contrasts with positive NIFTY; population and treatment differences do not resolve the inconsistency. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1016/S2468-1253(24)00119-5"}, "V12-MOUNTAINEER": {"short": "MOUNTAINEER final: HER2-positive CRC", "title": "Tucatinib plus trastuzumab for chemotherapy-refractory, HER2 + , RAS wild-type metastatic colorectal cancer (MOUNTAINEER): final analysis.", "kind": "Full-text clinical evidence", "locator": "All 12 main-PDF pages; methods, efficacy Table 2, safety Table 4 and biomarker figures.", "url": "https://doi.org/10.1038/s41467-025-67824-z", "doi": "10.1038/s41467-025-67824-z", "pmid": "41526345", "note": "Tucatinib plus trastuzumab: confirmed ORR 39.3% (28.8–50.5), median response duration 15.2 months, PFS 8.1 months, OS 23.9 months. Grade 3 and 4 events 33.7% and 7.0%; 5.8% discontinued for adverse events. No randomized combination comparator or proven best sequence after other HER2 drugs. Do not rank its median OS against unrelated later-line trials. Exploratory HER2 copy-number thresholds are not mandatory selection cutoffs. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1038/s41467-025-67824-z"}, "V12-SUNLIGHT": {"short": "SUNLIGHT: FTD/TPI plus bevacizumab", "title": "Trifluridine-Tipiracil and Bevacizumab in Refractory Metastatic Colorectal Cancer.", "kind": "Full-text clinical evidence", "locator": "All 11 main-PDF pages; Figures 1–2 and Tables 1–2.", "url": "https://doi.org/10.1056/NEJMoa2214963", "doi": "10.1056/NEJMoa2214963", "pmid": "37133585", "note": "OS 10.8 versus 7.5 months, HR 0.61 (0.49–0.77); PFS 5.6 versus 2.4 months, HR 0.44. ORR 6.1% versus 1.2%. Grade ≥3 events 72.4% versus 69.5%; neutropenia 43.1% versus 32.1%. Open-label; no head-to-head comparison with fruquintinib/regorafenib. Low response rate and an advanced refractory population: not a preferred curative conversion regimen or LT trial. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1056/NEJMoa2214963"}, "V12-FRESCO2": {"short": "FRESCO-2: fruquintinib", "title": "Fruquintinib versus placebo in patients with refractory metastatic colorectal cancer (FRESCO-2): an international, multicentre, randomised, double-blind, phase 3 study.", "kind": "Full-text clinical evidence", "locator": "All 13 main-PDF pages; Figures 2–3 and Tables 1–3.", "url": "https://doi.org/10.1016/S0140-6736(23)00772-9", "doi": "10.1016/S0140-6736(23)00772-9", "pmid": "37331369", "note": "Fruquintinib versus placebo plus supportive care: OS 7.4 versus 4.8 months, HR 0.66 (0.55–0.80); PFS 3.7 versus 1.8, HR 0.32. Seven partial responses among 461; no complete response. Grade ≥3 events 63% versus 50%. Very late-line population, no direct comparison with SUNLIGHT. Grade ≥3 hypertension 14%, asthenia 8%, hand–foot syndrome 6%; one treatment-related intestinal-perforation death. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1016/S0140-6736(23)00772-9"}, "V12-CASSANDRA": {"short": "CASSANDRA: preoperative PAXG", "title": "Preoperative mFOLFIRINOX versus PAXG for stage I–III resectable and borderline resectable pancreatic ductal adenocarcinoma (PACT-21 CASSANDRA): results of the first randomisation analysis of a randomised, open-label, 2 × 2 factorial phase 3 trial", "kind": "Full-text clinical evidence", "locator": "All 12 main-PDF pages; endpoint definition, Figure 3 and Tables 1–3.", "url": "https://doi.org/10.1016/S0140-6736(25)01685-X", "doi": "10.1016/S0140-6736(25)01685-X", "pmid": "41275879", "note": "Median event-free survival 16.0 versus 10.2 months, HR 0.63 (0.47–0.84). EFS included confirmed CA19-9 rises and unresectability, not just progression/death. Resection 75% versus 67% (not significant); R0 rates similar. Grade ≥3 toxicity 66% versus 61%. OS immature; no established OS superiority. Open-label, high-volume Italian centers, all White population, age cap. Converted phase II to III after 86% enrollment; no independent monitoring committee. Thirty-three EFS events were marker-only. Do not relabel EFS as OS or PFS. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1016/S0140-6736(25)01685-X"}, "V12-NAPOLI1": {"short": "NAPOLI-1: nal-IRI after gemcitabine", "title": "Nanoliposomal irinotecan with fluorouracil and folinic acid in metastatic pancreatic cancer after previous gemcitabine-based therapy (NAPOLI-1): a global, randomised, open-label, phase 3 trial.", "kind": "Full-text clinical evidence", "locator": "All 13 main-PDF pages; Figures 1–3 and Tables 1–3.", "url": "https://doi.org/10.1016/S0140-6736(15)00986-1", "doi": "10.1016/S0140-6736(15)00986-1", "pmid": "26615328", "note": "nal-IRI plus 5-FU/LV: OS 6.1 versus 4.2 months, HR 0.67 (0.49–0.92); PFS 3.1 versus 1.5, HR 0.56. ORR 16% versus 1%. nal-IRI monotherapy did not improve OS (HR 0.99). Grade 3–4 neutropenia 27%, diarrhea 13%. Small prior-irinotecan subgroup, different 5-FU schedules, selected organ function. No validated immediate reuse after FOLFIRINOX/NALIRIFOX. One combination treatment-related septic-shock death. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1016/S0140-6736(15)00986-1"}, "V12-MIXED_PRIMARY": {"short": "Kobayashi 2018: combined HCC-CCA", "title": "Multicenter retrospective analysis of systemic chemotherapy for unresectable combined hepatocellular and cholangiocarcinoma.", "kind": "Full-text clinical evidence", "locator": "All nine main-PDF pages; Table 2 and Figure 3 p 5 visually inspected; Table 3 p 6.", "url": "https://doi.org/10.1111/cas.13656", "doi": "10.1111/cas.13656", "pmid": "29856900", "note": "Overall OS 8.9 months, PFS 2.8 months, ORR 5.6%. Pooled platinum regimens had longer observed OS than sorafenib; adjusted sorafenib-versus-platinum mortality HR 15.83 (2.25–111.43). All seven sorafenib exposures including later line had progression. Tiny nonrandomized groups, major confounding and very wide CI. Abstract and body reverse individual GemCis/5-FU-cisplatin median ordering; do not present those medians as settled. Old pathology classification; no modern ICI comparison. Full PDF saved privately; TMC: https://libkey.io/libraries/480/10.1111/cas.13656"}}, "assistants": {"hcc/diagnosis": {"questions": [{"id": "diagnosis", "label": "What establishes the diagnosis?", "options": [{"value": "hcc", "label": "HCC established by eligible LR-5 imaging or pathology", "details": []}, {"value": "lr4", "label": "LR-4: probable HCC", "details": []}, {"value": "lr3", "label": "LR-3: intermediate probability", "details": []}, {"value": "inadequate", "label": "Imaging incomplete or technically inadequate", "details": []}, {"value": "other", "label": "LR-M or a non-HCC diagnosis", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-policy", "H-aasld"], "help": "Imaging-only diagnosis requires the appropriate at-risk population. AFP alone does not diagnose HCC.", "criteria": []}], "rules": [{"when": {"diagnosis": "other"}, "branch": null, "kind": "stop", "title": "Review the treatment and transplant plan", "text": "Establish the tumor type before using the HCC pathway. LR-M requires diagnostic assessment; do not count it as HCC.", "refs": ["H-policy", "H-aasld"]}, {"when": {"diagnosis": ["lr4", "lr3", "inadequate"]}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"diagnosis": "hcc"}, "branch": 0, "kind": null, "title": null, "text": null, "refs": []}], "example": {"diagnosis": "hcc"}}, "hcc/curative-route": {"questions": [{"id": "spread", "label": "What is the status of vascular invasion, extrahepatic spread or prior tumor rupture?", "options": [{"value": "clear", "label": "None of these findings", "details": []}, {"value": "excluded", "label": "Active invasion, spread or rupture", "details": []}, {"value": "prior", "label": "Previously treated rupture or vascular invasion", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["N-hcc"], "help": "", "criteria": []}, {"id": "operation", "label": "Which curative approach is supported by liver reserve and anatomy?", "options": [{"value": "resection", "label": "Safe complete resection is feasible", "details": []}, {"value": "transplant", "label": "Transplant is favored and fitness is acceptable", "details": []}, {"value": "review", "label": "Neither approach is established / fitness unresolved", "details": []}, {"value": "u st remain <500.", "criteria": []}, {"id": "spread", "label": "Has imaging excluded macrovascular tumor invasion and extrahepatic disease?", "options": [{"value": "yes", "label": "Yes", "details": []}, {"value": "no", "label": "No", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-policy", "N-hcc"], "help": "", "criteria": []}], "rules": [{"when": {"spread": "no"}, "branch": null, "kind": "stop", "title": "Review the treatment and transplant plan", "text": "Macrovascular tumor invasion or extrahepatic disease prevents a standardized HCC MELD exception. Reassess transplant suitability and review other HCC treatment options.", "refs": ["H-policy", "N-hcc"]}, {"when": {"burden": "other"}, "branch": null, "kind": "hold", "title": "Clarify the qualifying tumor burden", "text": "Confirm qualifying Class 5 lesions and pretreatment measurements before determining whether a standardized HCC MELD-exception request is appropriate.", "refs": ["H-policy"]}, {"when": {"burden": "beyond"}, "branch": 3, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"burden": "t1", "spread": "yes"}, "branch": 2, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"afp": "not-met"}, "branch": null, "kind": "hold", "title": "AFP does not meet the HCC MELD-exception requirement", "text": "Reassess AFP trend, viable tumor, liver function and treatment response. Choose the next treatment or individual exception review from the options below; tumor size alone does not establish eligibility for HCC MELD-exception points.", "refs": ["H-policy", "N-hcc", "NCCN-hcc"]}, {"when": {"burden": "t2", "afp": "met", "spread": "yes"}, "branch": 0, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"burden": "ds", "afp": "met", "spread": "yes"}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}], "example": {"burden": "t2", "afp": "met", "spread": "yes"}}, "hcc/treatment": {"questions": [{"id": "response", "label": "What does post-treatment imaging show?", "options": [{"value": "controlled", "label": "Viable burden within required limits / no viable tumor", "details": []}, {"value": "residual", "label": "Residual burden above limits or equivocal response", "details": []}, {"value": "spread", "label": "New macrovascular invasion or extrahepatic disease", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-policy", "H-aasld"], "help": "Assess viable tumor separately from the treated cavity and retain pretreatment stage. For downstaging, guidance advises imaging ≥4 weeks after the last treatment.", "criteria": []}, {"id": "afp", "label": "Required AFP response maintained?", "options": [{"value": "yes", "label": "Yes", "details": []}, {"value": "no", "label": "No", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-policy"], "help": "If AFP has never exceeded 1,000 ng/mL: current AFP ≤1,000. If it ever exceeded 1,000: treatment must reduce AFP to <500 and it must remain <500.", "criteria": []}, {"id": "reserve", "label": "Liver reserve and treatment safety acceptable?", "options": [{"value": "yes", "label": "Yes", "details": []}, {"value": "no", "label": "No", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-aasld"], "help": "Treatment-related decompensation needs reassessment. Prior checkpoint immunotherapy requires transplant/pharmacy review before transplantation.", "criteria": []}], "rules": [{"when": {"response": "spread"}, "branch": null, "kind": "stop", "title": "Review the treatment and transplant plan", "text": "New macrovascular invasion or extrahepatic disease prevents a standardized HCC MELD exception and requires a new treatment and transplant assessment.", "refs": ["N-hcc"]}, {"when": {"response": "residual"}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"afp": "no"}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"reserve": "no"}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"response": "controlled", "afp": "yes", "reserve": "yes"}, "branch": 0, "kind": null, "title": null, "text": null, "refs": []}], "example": {"response": "controlled", "afp": "yes", "reserve": "yes"}}, "hcc/listing": {"questions": [{"id": "exception", "label": "Applicable HCC MELD-exception criteria and supporting evidence verified?", "options": [{"value": "yes", "label": "Yes", "details": []}, {"value": "no", "label": "No", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-policy"], "help": "Baseline/response imaging, qualifying lesions, AFP history, chest staging and resection assessment. Adults retain calculated MELD initially and at first extension; later eligible extensions use MMaT−3.", "criteria": []}, {"id": "fitness", "label": "Transplant selection and treatment-safety reviews complete?", "options": [{"value": "yes", "label": "Yes", "details": []}, {"value": "no", "label": "No", "details": []}, {"value": "unknown", "label": "Uncertain / not yet assessed", "details": []}], "refs": ["H-aasld", "N-hcc"], "help": "Include cardiopulmonary, infectious, functional and psychosocial suitability; any prior ICI exposure needs a specific rejection-risk plan.", "criteria": []}], "rules": [{"when": {"exception": "no"}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"fitness": "no"}, "branch": 1, "kind": null, "title": null, "text": null, "refs": []}, {"when": {"exception": "yes", "fitness": "yes"}, "branch": 0, "kind": null, "title": null, "text": null, "refs": []}], "example": {"exception": "yes", "fitness": "yes"}}, "hcc/waitlist": {"questions": [{"id": "control", "label": "Current tumor / AFP assessment?", "options": [{"value": "maintained", "label": "Qualifying disease control and AFP mai s": "Proposed study cohort", "steps": ["allocation", "treatment"], "context": "Consider this review when the original tumor burden exceeded UNOS downstaging entry criteria.", "stance": "Open a bounded prospective beyond-UNOS downstaging cohort, not an unrestricted all-comers pathway.", "rules": ["Proposed entry ceiling: original pretreatment tumor count plus largest tumor diameter in cm ≤12; AFP <100 ng/mL; Child-Pugh A; no macrovascular invasion, extrahepatic disease or unmeasurable infiltrative tumor. These restrictions apply to the expanded arm, not to otherwise standard-eligible HCC.", "Before LT: viable tumor burden within Milan, or complete nonviability, with at least six months of documented stability from the first assessment meeting that target. Repeat liver CT/MRI and AFP at least every three months; confirmed progression holds the route and resets the study control clock after new successful downstaging.", "Preserve baseline measurements and AFP. A prior AFP ≥100 or Child-Pugh B/C at expanded-arm entry belongs to a separately approved stratum; do not erase that history after response. Do not combine this expansion with the portal-vein tumor invasion study."], "tests": "Central review of pretreatment and current multiphasic CT/MRI; chest CT; dated AFP series; Child-Pugh components; resection/ablation assessment; dated response and progression record. Record first treatment, first successful downstaging, latest progression, listing, first exception request and LT dates separately; report all-entry, waitlist and recipient outcomes with their own time origins.", "allocation": "Reaching Milan/T2 does not retrospectively create standardized downstaging entry eligibility. A nonstandard exception request, calculated-MELD route or LDLT review remains separate; apply the actual allocation clock.", "references": ["xu", "aasld", "xxl", "hcc_design", "hcc_yao2015", "hcc_merits2021", "hcc_sinha2019", "hcc_merits_ac2023", "hcc_huang2023", "hcc_tabrizian2022"], "evidence": {"synthesis": "Evidence supports offering a bounded downstaging pathway to selected beyond-UNOS patients, not unrestricted transplantation. Attrition before LT materially changes the counseling estimate: survival among recipients is consistently better than survival from treatment entry. Randomized XXL supports LT after sustained response but does not validate the proposed baseline burden/AFP/reserve combination. The ≤12, AFP <100, Child-Pugh A pilot envelope is a deliberately conservative candidate rule derived from observational risk signals. Observation is a test of behavior, not proof that dormant metastases are absent.", "counterevidence": "Favorable MERITS recipient survival and the randomized responder benefit argue against declaring all beyond-UNOS disease futile. Conversely, high dropout in historical all-comers, worse entry survival, increased long-term recurrence and explant understaging argue against accepting a radiographic Milan endpoint alone. Child-Pugh B/C patients may need transplantation most, yet poorer downstaging tolerance makes an initial Child-Pugh-A-only pilot a local safety restriction rather than a universal oncologic exclusion.", "certainty": "Moderate for a benefit of LT in carefully selected sustained responders, limited by one small responder-randomized trial; low for the exact expanded-entry limits; very low for a jointly validated ≤12/AFP <100/Child-Pugh A/six-month rule. This is an informal certainty assessment, not a formal GRADE exercise.", "threshold_basis": "Number-plus-largest-diameter ≤12 and AFP <100/Child-Pugh A: cohort-derived risk refinement, not validated cutoff. Six months: proposed conservative operational observation period; studies used differing clocks and intervals. Imaging/AFP every three months: proposed monitoring cadence. A five-year ≥60% intention-to-treat target is a research-design benchmark, not an achieved or validated eligibility estimate for this pilot. The clinical stability clock must remain separate from OPTN/NLRB exception timing.", "policy_context": "Current NLRB adult transplant-oncology guidance (12/2025, HCC p3) permits individualized review after successful beyond-standard downstaging; clinical eligibility and exception priority are separate. Its first-exception-request waiting interval is not the same clock as the proposed six months of stable response. Standard OPTN 9.5.I requirements remain a separate allocation check.", "studies": [{"key": "hcc_yao2015", "design_population": "Single-center prospective downstaging protocol; 118 downstaging patients versus 488 initially T2 controls, treated in 2002–January 2012.", "selection": "Entry: one lesion ≤8 cm; two/three lesions each ≤5 cm and total ≤8 cm; or four/five each ≤3 cm and total ≤8 cm; no macrovascular invasion; ≥3 months observation after successful downstaging.", "results": "Downstaging succeeded in 77/118 (65.3%); 64/118 (54.2%) underwent LT. Five-year post-LT survival was 77.8% versus 81.0%; recurrence-free probability 90.8% versus 88.0%. Five-year intention-to-treat survival was 56.1% versus 63.3%; two-year dropout 34.2% versus 25.6%. Five transplanted downstaging patients developed recurrence.", "limits": "Bounded protocol, older treatments and selected recipients; recipient survival excludes downstaging failure. Recurrence-free probability is not automatically a death-inclusive DFS endpoint.", "locator": "Primary PMC full text: Methods, Results and survival figures; DOI 10.1002/hep.27752. Complete PDF not saved."}, {"key": "hcc_merits2021", "design_population": "Prospective MERITS-LT cohort: 209 UNOS-DS patients at seven centers in four US regions, 2016–2019.", "selection": "UNOS-DS entry limits; predominantly Child-Pugh A/B; bilirubin ≤4 mg/dL; Child-Pugh B/C with AFP >1,000 excluded. Initial TACE versus Y90 was not randomized.", "results": "174/209 (83.3%) achieved downstaging; two-year estimated success 87.7%. Observed dropout was 75/209, including 51 tumor progressions and nine liver-related deaths; two-year competing-risk dropout 37.3%. LT occurred in 63/209 by cutoff; three-year LT probability 46.6%. Median post-LT follow-up 1.7 years; two-year recipient survival 95%, three-year 83.1%; recurrence 5/63. Three-year treatment-entry survival 73%. Explants exceeded Milan in 42.8%, with microvascular invasion in 17.5%.", "limits": "Early post-LT follow-up and substantial radiology/explant discordance; success of an imaging endpoint does not establish absence of viable cancer. Overlaps later MERITS expansions.", "locator": "Complete local author manuscript, PDF pp6–9, Table 3."}, {"key": "hcc_sinha2019", "design_population": "Single-center all-comers analysis: 74 beyond-UCSF-DS patients versus 133 bounded UCSF-DS patients.", "selection": "All-comers exceeded the established downstaging burden limits; full-text confirmation of era and entry exclusions remains pending.", "results": "Downstaging success: 64.8% versus 84.2%. Three-year dropout: 80.0% versus 36.1%. LT: 10/74 (13.5%) all-comers versus 59.0% of bounded patients. Five-year intention-to-treat survival: 21.1% versus 56.0%; three of ten all-comer recipients recurred. Number plus largest diameter >8 and Child-Pugh B/C predicted dropout.", "limits": "Strong counterevidence to unlimited entry, but small historical single-center cohort. Primary abstract only; treatment-entry timing and endpoint definitions require full text. Not a validation of a ≤12 cutoff.", "locator": "Published primary abstract, PMID 30779440, Results."}, {"key": "hcc_merits_ac2023", "design_population": "Prospective MERITS-LT expansion: 82 all-comers versus 229 UNOS-DS patients, seven centers, 2015–2020.", "selection": "All-comers exceeded UNOS-DS. Liver reserve and AFP identified poor-prognosis subgroups rather than a randomized selection rule.", "results": "Twelve-month downstaging: 67% versus 83%. Three-year entry survival: 58% versus 69%; approximately 30% in all-comers with Child-Pugh B/C or AFP ≥500. LT occurred in 20/82 versus 85/229; five-year LT probability 42.2% versus 73.6%. Recipient three-year survival: 90.9% versus 80.6%; recurrence 1/20 versus 7/85. Median post-LT follow-up was only about 18.5 months. All-comer dropouts numbered 39: 25 before and 14 after downstaging.", "limits": "Immature recipient estimates and substantial attrition. Cohort overlaps earlier MERITS and Xu 2025; do not sum patients or treat as independent validation.", "locator": "Primary PMC full text, Results §3.5 and outcome tables, PMC10998692; PDF pending."}, {"key": "xu", "design_population": "National prospective cohort, nine centers, 2015–2023: 190 all-comers and 326 UNOS-DS patients; intention-to-treat clock starts at first locoregional treatment.", "selection": "No extrahepatic disease or macrovascular invasion; all-comers exceeded UNOS-DS. Proposed burden and biologic refinements were derived from this cohort, not prospectively locked eligibility criteria.", "results": "Two-year downstaging: 66% versus 82%. Among all-comers, number plus largest diameter <10, 10–12 and >12 had success of 72%, 51% and 39%. Five-year treatment-entry survival: 45.0% versus 58.8%. LT occurred in 76/190 versus 155/326; median downstaging-to-LT 10.6 months. Five-year recipient survival: 71.5% versus 73.6%; recurrence: 29.8% versus 13.7%, with median post-LT follow-up 27.4 months. AFP ≥100 and Child-Pugh B predicted worse entry survival.", "limits": "Selected-recipient success cannot replace entry survival; five-year tails are immature. Y90/TACE comparisons were observational. The proposed number-plus-diameter ≤12, AFP <100 and Child-Pugh A combination remains unvalidated.", "locator": "Complete local PDF, Results pp6–9, Tables 3–4; proposed refinements in Discussion pp9–11."}, {"key": "xxl", "design_population": "Multicenter randomized phase 2b/3 trial: 74 entered downstaging; 29 dropped out before randomization; 45 responders were randomized, 23 to LT and 22 to nontransplant treatment.", "selection": "Child-Pugh A–B7, ECOG 0–1, predicted five-year post-LT survival ≥50%, and ≥3 months sustained response. AFP rules depended on baseline value and response, not an unconditional AFP <400 entry rule.", "results": "From randomization, five-year overall survival was 77.5% with LT versus 31.2% without LT; tumor-event-free survival 76.8% versus 18.3%; median follow-up 71 months.", "limits": "Strongest causal evidence for LT among selected responders, not for all 74 entrants or unlimited initial burden. Small, prematurely stopped trial. Appendix allowed uncertain bland-versus-neoplastic segmental/type-I portal thrombosis under additional response conditions; the actual PVTT denominator/outcomes are not reported. It must not be relabeled a proven-PVTT trial.", "locator": "Complete accepted manuscript and protocol appendix; final published abstract for survival estimates. Avoid mixing accepted-manuscript and final-publication hazard ratios."}, {"key": "hcc_huang2023", "design_population": "UNOS national cohort, 2010–2019: 23,398 HCC exception applicants—20,579 initially Milan, 2,151 UNOS-DS, 668 all-comers.", "selection": "Time zero was first HCC exception application, not first downstaging treatment. Patients had already reached the allocation/application stage.", "results": "Two-year dropout: 19.3%, 25.3% and 29.7%, respectively; the direct all-comer versus UNOS-DS difference was not significant (P=.07). In all-comers with initial AFP >100, two-year dropout was 52%, versus 26% in the comparison beyond-Milan patients. Higher MELD and total tumor diameter predicted dropout.", "limits": "Useful real-world waitlist counterevidence, but excludes patients lost before exception application and cannot supply first-LRT intention-to-treat survival. National registry overlaps other US registry studies.", "locator": "Primary abstract plus publisher Methods/Results, DOI 10.1016/j.cgh.2022.08.023; complete PDF pending."}, {"key": "hcc_tabrizian2022", "design_population": "Five-center US recipient cohort, 2001–2015: 2,645 transplanted patients, including 2,122 always within Milan, 341 downstaged and 182 still beyond Milan.", "selection": "Only 168 of the 341 downstaged patients originally met UNOS-DS limits. All analyses start with patients who actually received a graft.", "results": "Ten-year post-LT overall survival was 61.5%, 52.1% and 43.3%; ten-year recurrence was 13.3%, 20.6% and 41.1%, respectively. Median follow-up was 55.3 months.", "limits": "Longer-term cancer risk persists after successful downstaging. Recipient-only retrospective data do not estimate entry survival or probability of ever reaching LT; long-term tails have fewer patients.", "locator": "Primary PMC Methods/Results and survival tables, PMC9301590; complete PDF pending."}]}}, {"id": "HCC-B1.1", "anchor": "hcc-b1-1", "title": "AFP-only failure or discordance with imaging", "status": "OPEN clinical proposal — not active", "steps": ["allocation", "treatment", "listing", "waitlist"], "context": "High or rising AFP despite controlled/uncertain imaging, including patients otherwise within Milan. Do not inherit B1 expanded-burden AFP <100.", "stance": "Use a distinct biological-risk review; confirm the signal and restage. Do not permanently delist or treat a nonexistent target based on one AFP result.", "rules": ["Repeat AFP using the same laboratory/assay in 2–4 weeks, sooner for a major jump or clinical concern. Review all dated prior values, baseline and peak AFP, treatment dates and the current response scan. The 2–4 week interval is an OPEN local operational proposal.", "Check ALT/AST, bilirubin and active viral hepatitis or other plausible hepatic inflammation. Consider assay interference or an extrahepatic AFP source when clinically indicated; do not order indiscriminate tests without a differential diagnosis.", "Have transplant radiology re-review adequate multiphasic CT/MRI and the treatment-specific response category. With a persistent unexplained rise, consider the alternate contrast modality and chest/pelvic evaluation. PET is selective after unrevealing evaluation, not routine proof of no HCC.", "The governing allocation rule is met, or an individual review outcome is documented; technically adequate imaging shows no exclusionary progression, vascular invasion or extrahepatic disease; no unresolved alternative cause or unexplained accelerating AFP remains.", "OPEN proposal after a biochemical hold: at least two AFP values at least 4 weeks apart showing a stable or falling trajectory below the applicable threshold, with contemporaneous reviewed imaging. Do not require AFP normalization or below 100 for every within-Milan patient. This confirmation interval is not prospectively validated.", "All other observation requirements remain in force. B1 expanded-burden patients retain the separately proposed AFP below 100 and longer biology observation; satisfying B1.1 does not shorten B1, ICI washout, or OPTN waiting requirements.", "POLICY: after any prior AFP above 1000, AFP at least 500 after treatment prevents automatic advancement through the standardized exception route and requires NLRB consideration. The team should not promise exception approval.", "OPEN clinical proposal: confirmed AFP at least 500 is a high-risk LT hold pending biological and allocation review even if AFP never exceeded 1000. This deliberately conservative local rule is supported by retrospective outcomes, not mandated by OPTN for every candidate.", "OPEN clinical proposal below 500: AFP at least 200 with two consecutive increases or a confirmed doubling prompts temporary hold and expedited restaging if the rise is unexplained. Lesser rises prompt repeat testing and MDT review, not automatic delisting. These combined thresholds are operational proposals, not a validated prediction rule.", "A fitted slope above 7.5 ng/mL per month is an additional warning, not a stand-alone stop. Review multiple dated values, timing of LRT and inflammation; do not extrapolate a long-term slope model from two closely spaced noisy measurements.", "Do not permanently exclude for one AFP result. Persistent biochemical nonresponse after adequate evaluation may lead the group to decline the current transplant plan, but the rationale and possibility of reassessment must be documented.", "Do not call AFP-only rise RECIST or LI-RADS treatment progression. Do not give empiric LRT without an identified target, or add systemic therapy solely to make the AFP cross an allocation threshold without a justified oncologic indication.", "Do not treat LDLT as an automatic escape from unfavorable tumor biology. Donor risk, recipient benefit and recurrence must be reviewed independently. New ICI use requires the separate B3 transplant safety decision."], "tests": "Dated AFP series and peak; repeat same assay, liver inflammation/viral activity review; expert multiphasic CT/MRI review and alternate imaging when indicated; current allocation route; all treatment dates. Proposed 2–4-week repeat and 4-week confirmation intervals are unvalidated local choices.", "allocation": "After prior AFP >1000, standardized exception requires AFP <500 and remaining <500. Persistent failure requires individual NLRB review, without a promise of approval. LDLT does not bypass unfavorable biology or donor-risk review.", "references": ["AFP_RESPONSE", "AFP_500", "AFP_SLOPE", "AFP_NYCA", "AFP_OCCULT", "optn", "nlrb"], "evidence": {"synthesis": "AFP level and trajectory add risk information to imaging. Selected recipient cohorts support concern, not a validated AFP-only transplant-benefit cutoff.", "counterevidence": "Most studies excluded waitlist dropout; NYCA is a composite and excluded early deaths. Post-RFA marker episodes are not AFP-only transplant candidates.", "certainty": "Observational association; very low certainty for the proposed hold/release combination.", "threshold_basis": "Confirmed AFP ≥500 clinical hold; AFP ≥200 plus two rises or confirmed doubling; release after two stable/falling values ≥4 weeks apart: OPEN proposals, not validated rules.", "policy_context": "Clinical suitability and allocation exceptions are separate.", "studies": [{"key": "AFP_RESPONSE", "title": "Mehta 2019: AFP response", "design": "Retrospective UNOS recipient cohort, 2005–2015; 407 patients with AFP >1000 at least once and final AFP within 90 days of LT. Living-donor and multiorgan recipients excluded; 93.6% initially within Milan.", "results": "Five-year post-LT OS: 48.8% with final AFP >1000, 67.0% at 101–499, and 88.4% at ≤100. Corresponding Kaplan–Meier recurrence estimates: 35.0%, 13.3%, and 7.2%. The 500–1000 group had only 17 patients. Differences between ≤100 and 101–499 were not statistically significant.", "limitations": "Recipient-only, selected historical cohort; treatment and waiting time differed substantially between groups. Non-HCC death was censored for recurrence. No proof that forcing AFP lower causes benefit, no AFP-only/imaging-complete-response subgroup, and no LDLT validation.", "implication": "Supports response-based biological review and the existing >1000-to-<500 allocation framework. Does not require AFP <100 for every within-Milan candidate or prove a safe AFP-only exception.", "locator": "Main PDF pp 3–9; Tables 1–3 and Figures 1–3."}, {"key": "AFP_500", "title": "Goldman 2022: final AFP ≥500", "design": "UNOS 2005–2015; 1766 LT recipients with initial AFP 100–999. Only 879 had serial values; final AFP ≥500 subgroup n=109. LDLT excluded.", "results": "Five-year OS at final AFP <100 / 100–499 / ≥500: 72.7% / 70.4% / 56.1%; recurrence: 13.1% / 18.7% / 24.2%. Final AFP ≥500: adjusted mortality HR 1.50 (95% CI 1.07–2.10), recurrence HR 1.88 (1.13–3.14).", "limitations": "Historical recipient-only study, not a comparison of transplant versus no transplant. Many had only one AFP. In the ≥500 subgroup, 40.4% were ≥1000; small subgroups cannot establish equivalence. Recurrence estimates censor competing death.", "implication": "Supports discussing a conservative clinical hold at confirmed AFP ≥500, even without a prior >1000 result. This is an OPEN local proposal, not a universal OPTN contraindication or a proven transplant-benefit cutoff.", "locator": "Main PDF pp 4–9; Tables 1–3 and Figures 1–3."}, {"key": "AFP_SLOPE", "title": "Giard 2018: AFP slope", "design": "Single-center 336 transplanted T2/Milan patients, 2003–2013; 98.2% received LRT. Median five AFP measurements over 9.8 months. Slope fitted to all values; >7.5 subgroup n=23.", "results": "AFP slope >7.5 ng/mL/month: adjusted recurrence HR 3.0 (1.1–8.1), microvascular invasion OR 6.8 (1.6–28.7). Five-year recurrence-free probability 69.8% versus 87.4%; survival without recurrence 59.5% versus 75.3%. These are different endpoints, neither pair should be labeled overall survival.", "limitations": "Small, data-selected cutoff group; no prospective hold/release validation. The long-term fitted slope cannot be inferred reliably from two closely spaced noisy results. Death was censored for recurrence-free probability.", "implication": "Use slope as an alert to reassess biology, imaging and inflammation, not a stand-alone absolute stop or permanent delisting rule.", "locator": "Main PDF pp 2–6; Tables 1–4 and Figure 1."}, {"key": "AFP_NYCA", "title": "Halazun 2021: dynamic AFP/NYCA", "design": "External retrospective validation in 2236 LT recipients at eight centers, 2001–2013; 545 beyond Milan. Composite score combines tumor size, count and AFP response. Deaths within 90 postoperative days excluded.", "results": "Five-year competing-risk cumulative recurrence: 9.5%, 20.5%, 40.5% for low/intermediate/high NYCA categories. Discrimination C statistic 0.66. These are composite-score categories, not isolated AFP ranges.", "limitations": "Recipient selection, exclusion of early deaths, no waitlist dropout or transplant-benefit comparison. Maximum-to-final AFP can miss a rebound below the original peak. Extreme-AFP response subgroup was tiny.", "implication": "Use dynamic AFP as complementary risk information. The NYCA definition of response does not supersede the stricter OPTN requirement to fall below 500 after AFP >1000.", "locator": "Main PDF pp 1–8; Table 1, Figures 1–3. Trailing commentary is not a separate reviewed study."}, {"key": "AFP_OCCULT", "title": "Moriyama 2026: markers before imaging recurrence", "design": "Retrospective post-RFA, nontransplant cohort. Among 1620 initially treated patients, 907 episodes in 509 patients had elevated AFP, AFP-L3 and/or DCP without imaging evidence. Episodes are not independent patients and this is not AFP alone.", "results": "Recurrence was subsequently identified in 886 episodes; median detection interval 89 days. Local curative treatment 83.5% versus 78.8% and post-recurrence OS 3.55 versus 3.31 years for detection ≤180 versus >180 days; differences were not statistically significant.", "limitations": "RFA-specific, repeated episodes and competing losses; no LT cohort or tested optimal recall interval. Routine imaging is described as every four months in methods versus quarterly in abstract. Case-level AFP discrepancy between Figure 3 and Table 4 is not used.", "implication": "Supports prompt repeat markers and high-quality/alternate imaging for an unexplained rise. Does not prove occult recurrence in every individual, justify empiric systemic/LRT treatment without a target, or validate an AFP-only transplant cutoff.", "locator": "All nine main-PDF pages; methods, Tables 2–4, Figures 1–3. External Tables S1/S2 not supplied."}]}}, {"id": "HCC-B2", "anchor": "hcc-b2", "title": "Previously treated portal-vein tumor invasion", "status": "Proposed study cohort", "steps": ["curative-route"], "context": "A history of tumor invasion into the portal vein requires a separate assessment, even after a radiographic response.", "stance": "Develop an initial Vp1–2-only transplanting study; keep Vp3 registry-first and Vp4/hepatic-vein expansion closed.", "rules": ["Proposed anatomy: original Vp1 or Vp2 only, centrally confirmed. Exclude Vp3, Vp4/main or contralateral branch, hepatic-vein tumor invasion, previous tumor rupture and combined expanded-burden risk from the initial pilot. These are study boundaries, not universal declarations of futility.", "Require complete absence of enhancing viable vascular tumor, remaining viable parenchymal disease within Milan or completely nonviable, no extrahepatic disease, and ≥12 continuous months meeting these conditions. Scan approximately every three months; count from the first qualifying scan.", "Any recurrent vascular enhancement or new metastasis stops progression to LT. Indeterminate thrombus or imaging discordance is a hold, not automatic clearance."], "tests": "Original vessel-by-vessel map with Vp grade; expert serial contrast CT/MRI; chest staging; AFP; separate vascular and parenchymal response; resection options. Crosswalk the original study/anatomic vascular definition to current Vp grade. Record vascular response separately from overall mRECIST response; neither excludes microscopic viable PVTT.", "allocation": "Clinical study eligibility cannot override the main-portal/hepatic-vein exception contraindications or grant priority. Obtain a separate documented organ route.", "references": ["round2_yoon", "pvtt_ye", "nlrb", "pvtt_choi", "pvtt_yang", "pvtt_soin", "assalino", "hcc_sposito2026"], "evidence": {"synthesis": "Anatomy, treatment response and biology all matter, but the available cohorts do not validate a sharp universal Vp2/Vp3 boundary or a single control-duration requirement. Several selected branch or even main-trunk recipients survived long term; this argues against a blanket futility claim. Conversely, small anatomy strata, highly selective transplantation, exclusion of perioperative deaths in some cohorts and absent entry denominators prevent a routine-policy expansion. Overall mRECIST response is not synonymous with vascular sterilization, and imaging disappearance can coexist with viable explant PVTT.", "counterevidence": "Poorer outcomes for lobar/main-trunk groups in Choi, Yang and Ye favor caution, while Yoon's selected Vp4 survivors and Sposito's downstaged cohort show that advanced anatomy is not invariably fatal. Assalino included hepatic-vein and mixed first-order/main-trunk disease, but its selected-recipient results cannot establish that these groups should enter an initial US pilot. Differences in anatomical definitions prevent a valid pooled Vp-grade survival estimate.", "certainty": "Very low for a specific anatomy or waiting-time threshold; low for an association between response/biologic selection and better recipient outcomes. No reviewed randomized study directly established the transplant strategy's net benefit from confirmed-PVTT treatment entry.", "threshold_basis": "Vp1–2 restriction, complete vascular radiographic response and 12-month control are proposed local safeguards, not a jointly tested published rule. Sposito accepted sustained vascular CR/PR for ≥6 months; Assalino reported a median, not a minimum, 11.4-month interval. NLRB guidance permits selected branch-invasion/rupture cases after prolonged stability but does not mandate clinical acceptance or convert main-trunk/hepatic-vein disease into a standard exception. Preserve separate original and current vascular extent.", "policy_context": "Current NLRB guidance treats main portal/hepatic-vein invasion, extrahepatic disease and rupture as major exception barriers; selected treated branch-invasion or rupture cases may be considered after prolonged stable disease. Case consideration is not automatic exception approval, and exception guidance is not a clinical declaration of futility.", "studies": [{"key": "round2_yoon", "design_population": "Retrospective Asan LDLT cohort, 1997–2022, 137 selected PVTT recipients; median follow-up 38.3 months.", "selection": "Original Vp1/Vp2/Vp3/Vp4 counts were 51/36/36/14. Overall mRECIST CR/PR defined responders, not necessarily complete vascular response.", "results": "Vp1 five-year OS 69.5%, DFS 56.2%; Vp4 OS 50.0%, DFS 34.3%. Exact Vp2/Vp3 five-year values were not tabulated. Vp4 recurrence was 9/14 (64.3%) by Table 2 count, not a five-year risk. Responders: 83 patients, five-year OS 66.6%, DFS 64.7%, recurrence 28/83; nonresponders: 54, OS 35.1%, DFS 19.7%, recurrence 42/54. Viable PVTT remained in 65/83 responder explants.", "limits": "Recipient-only, heterogeneous treatment eras and small grade subgroups. Nonsignificant grade comparisons do not prove equivalence. Discussion/conclusion transpose responder OS and DFS; retain Results/Figure 1 values.", "locator": "Complete PDF: Table 1; Results p7261; Table 2 p7264; Figure 1 p7265; Discussion p7268. Preserve source/pvtt_outcomes.py values."}, {"key": "pvtt_choi", "design_population": "Retrospective selected LDLT recipients with PVTT, n=34.", "selection": "Segmental involvement n=27; first-order/lobar involvement n=7. These are study-defined anatomical groups.", "results": "Five-year OS was 50.3% for segmental and 14.3% for first-order/lobar involvement. Segmental five-year DFS was 63.9%; a numeric lobar DFS estimate was not available in the verified primary abstract.", "limits": "Very small lobar group, retrospective recipient selection and no all-downstaging-entry denominator. OS and DFS are retained as reported, not converted into recurrence risk.", "locator": "Primary published abstract, PMID 28480517; full text required for endpoint definitions and patient selection."}, {"key": "pvtt_yang", "design_population": "Retrospective 75-recipient PVTT cohort.", "selection": "Vp2 and Vp3 were combined; Vp4 was separately analyzed. Subgroup sample sizes remain unverified without complete text.", "results": "Three-year OS/RFS were 65.4%/40.0% for Vp2–3 combined and 30.6%/21.4% for Vp4.", "limits": "Do not split combined Vp2–3 results into invented grade-specific estimates. No verified all-entry denominator or grade-specific recurrence counts; endpoint death handling needs full text.", "locator": "Primary journal abstract, PMID 32303439, Results."}, {"key": "pvtt_ye", "design_population": "Retrospective DDLT cohort of 141 vascular-invasion recipients: 13 segmental PVTT, 68 lobar PVTT, 60 microvascular invasion.", "selection": "All had HBV. Lobar PVTT included first-order branches or main portal vein; perioperative deaths and early follow-up losses were excluded.", "results": "Segmental three-year OS 75.0%, RFS 58.3%, crude recurrence 4/13. Lobar three-year OS 45.9%, RFS 9.1%, crude recurrence 60/68.", "limits": "Exclusion of early deaths biases recipient survival upward. Lobar is not an isolated Vp3 group. Crude recurrence and RFS are distinct measures; the cohort is not directly transportable to Western mixed-etiology candidates.", "locator": "Complete 12-page PDF: Methods p3, Tables 1–2 p6, Figure 4 p7."}, {"key": "pvtt_soin", "design_population": "Cohort following a PVTT downstaging protocol: 43 treated, 27 responders, 25 LDLT recipients.", "selection": "Among recipients, Vp1/Vp2/Vp3/Vp4 counts were 1/12/11/1. Transplant was conditional on successful downstaging.", "results": "Reported five-year OS 57% and RFS 51% exclude two postoperative deaths, leaving a 23-recipient survival subset. Recurrence occurred in 6/25 (24%) of the whole transplanted group.", "limits": "Neither reported survival curve represents all 25 recipients or all 43 treatment entrants. Small selected cohort without randomized control; grade-specific outcomes unavailable.", "locator": "Primary publisher HTML Methods/Results and abstract, DOI 10.1097/TP.0000000000003162; complete PDF pending."}, {"key": "assalino", "design_population": "Multicenter retrospective series: 45 transplanted patients reviewed, 30 with centrally validated macrovascular invasion retained; 11 centers, 2004–2018.", "selection": "Vascular radiologic disappearance after treatment; 24 portal and six hepatic-vein cases. Portal groups: seven Vp1, 12 Vp2, five study-defined Vp3. Its Vp3 included first-order branch OR main trunk. Median downstaging-to-LT 11.4 months (range 0.8–43.3; timing available in 27).", "results": "Median post-LT follow-up 39 months; one/three/five-year OS 76.7%/66.2%/59.6%; DFS 63.3%/56.3%/56.3%. Recurrence 8/30, median 6.5 months after LT. Three explants retained major vascular invasion despite radiologic clearance. An exploratory AFP <10 subgroup had 11% recurrence and five-year OS 83.3%.", "limits": "The 15 excluded records are not downstaging failures. No all-treated denominator. AFP threshold was post hoc; subgroup denominator not verified. Neither median waiting time nor the mixed Vp3 label validates a 12-month or modern Vp3 cutoff.", "locator": "New complete publisher PDF pp569–573: Methods, Table 1, explant findings and limitations."}, {"key": "hcc_sposito2026", "design_population": "Five-center Italian Y90 cohort, 2010–2023: 240 consecutive HCC/PVTT patients; 61 downstaged, 37 transplanted.", "selection": "Sustained vascular CR or PR for ≥6 months plus center-specific morphology/AFP requirements. Median Y90-to-LT interval 17 months.", "results": "Downstaging: 61/240 (25.4%); LT: 37/240 (15.4%). Among downstaged patients, 60-month cancer death was 15.8% with LT versus 45.2% without LT (subdistribution HR .221, 95% CI .071–.683). Recipients had three/five-year OS 67.2%/61.6% and RFS 79.3%/79.3%; complete explant necrosis 56.7%.", "limits": "Abstract-only verification. Grade denominators, landmark/selection adjustment and RFS death handling require full text; RFS exceeding OS must not be converted to recurrence as 1−RFS. No verified all-240 survival estimate.", "locator": "Published primary abstract, PMID 42228945, DOI 10.1097/HEP.0000000000001801."}]}}, {"id": "HCC-B3", "anchor": "hcc-b3", "title": "Previous checkpoint immunotherapy", "status": "Proposed safety approach", "steps": ["treatment", "waitlist"], "context": "Review checkpoint-inhibitor exposure before treatment selection and again before transplantation.", "stance": "Use ≥90 days after the last ICI dose as the elective LT planning threshold, with a separate assessment of immune toxicity.", "rules": ["Proposed elective cutoff: ≥90 days from last ICI dose to LT. No interval is proven safe; a longer interval does not eliminate rejection or graft-loss risk.", "Require no active clinically significant non-endocrine immune toxicity: grade ≤1 and no escalating immunosuppression for toxicity. Stable endocrine replacement may qualify. Prior grade 3–4 non-endocrine toxicity or myocarditis is excluded from the initial pilot pending separate specialist review.", "A shorter interval has no automatic urgency waiver. An exceptional-care decision must document near-term mortality without LT, alternatives, donor/graft risk, consent and rescue capability. Biology, ICI and allocation clocks may overlap; do not add them mechanically.", "Consent must address rejection, graft loss, uncertain comparative oncologic benefit and progression during washout. Neither elapsed time nor complete radiological response guarantees immune safety. Obtain the missing primary full texts before ratifying these provisional thresholds."], "tests": "Drug and last-dose dates; complete irAE history and grade; treatment and recovery; graft-risk review by hepatology, oncology and pharmacy; current staging.", "allocation": "Prior ICI alone is not an automatic HCC exception exclusion. The proposed clinical timing requirement is separate from tumor eligibility and allocation waiting time.", "references": ["ipd", "fang", "moeckli", "vitality", "immunoxxl", "aceituno", "litchi", "hccjama"], "evidence": {"synthesis": "ICI can help some selected patients reach transplantation, but efficacy and safety denominators must be kept separate: response among treated patients, probability of reaching LT, and rejection among recipients answer different questions. Very short washout is consistently concerning; evidence does not establish an interval at which risk becomes zero. Prior irAE adds information beyond elapsed time. Neither the apparent safety of some matched cohorts nor promising recipient survival cancels the graft-loss signal.", "counterevidence": "ImmunoXXL demonstrates feasibility with intervals shorter than 90 days, and Aceituno found similar rejection proportions in matched groups; these challenge a claim that <90 days is an absolute biological contraindication. They do not prove equivalence or validate elective shortening. Ong suggests oncologic benefit but also higher rejection, while Fang highlights risk missed by washout alone. The literature supports individualized exceptional review, not automatic urgency-based exemption.", "certainty": "Low for the association between shorter washout and rejection; low for prior-any-irAE risk; very low for a precise safe interval, a grade-specific irAE exclusion, an optimal immunosuppression regimen or an ICI-caused treatment-entry survival benefit. No reviewed trial randomized washout or transplant versus continued systemic therapy after ICI.", "threshold_basis": "Ninety days: conservative local planning rule informed by retrospective timing associations and IPD modeling, not a validated threshold. Grade ≤1 recovery and exclusion of prior severe nonendocrine/myocarditis cases: proposed operational safety judgment, not a proven transplant-specific cutoff; Fang's severe-event sample is only six. No laboratory or immune assay identified in this review validates clearance for LT. Center-specific immunosuppression should not be portrayed as evidence-proven protection from ICI-associated rejection.", "policy_context": "NLRB guidance says prior ICI does not itself preclude exception consideration. That allocation statement does not establish perioperative immunologic safety or a safe washout interval.", "studies": [{"key": "vitality", "design_population": "Multicenter observational US cohort: 117 consecutive ICI-treated HCC patients assessed for LT, 2016–2023.", "selection": "86 were initially beyond Milan; 94% also received locoregional treatment. Patients were selected for transplant evaluation rather than representing all advanced HCC treated with ICI.", "results": "65/86 (75.6%) beyond-Milan patients downstaged, median 5.6 months; 43/117 (36.7%) received LT. Three-year intention-to-treat survival was 71.1%; three-year recipient survival 85%. Rejection occurred in 7/43; six had last ICI <3 months before LT; one rejection-associated graft loss.", "limits": "The abstract's categories—18 initially within Milan plus 23 downstaged recipients—sum to 41, not 43; the two-patient discrepancy awaits full flow-diagram review. Multimodal treatment prevents attribution to ICI alone; full paper unavailable.", "locator": "Primary published abstract and accessible publisher material, PMID 39255928; full PDF pending."}, {"key": "immunoxxl", "design_population": "Prospective phase II experience: 61 potentially eligible atezolizumab–bevacizumab-treated patients; 16 enrolled/listed/transplanted responders.", "selection": "The 45 not included comprised 25 treatment discontinuations (15 progression, four adverse events, six decompensation) and 20 failing downstaging criteria. Eight of 16 had portal thrombosis, grades not verified; 15 had prior locoregional treatment.", "results": "Median washout 57.5 days (IQR 29–87), median follow-up 16 months. Acute rejection 4/16 (25%); three irAEs. Ninety-day morbidity 62.5%, mortality 1/16. Explants: ten complete and six partial responses; one recurrence. Two-year recipient OS 94%, RFS 90%.", "limits": "These are selected-16 outcomes, not 61-patient ITT efficacy. Small, nonrandomized, short follow-up; a shorter median washout does not establish safety. Retransplantation count was not independently extractable from accessible primary text and is not asserted.", "locator": "Published abstract plus accessible publisher Results, PMID 41763363; full PDF needed for eligibility, flow and adverse-event denominators."}, {"key": "moeckli", "design_population": "International retrospective series of 119 ICI-exposed LT recipients.", "selection": "Only transplanted patients; washout categories <30, 30–50 and >50 days.", "results": "Rejection occurred in 24/119 (20.2%), median nine days after LT. Six of 24 rejection cases lost the graft—6/119 (5.0%) of all recipients. Relative to >50 days, univariate rejection odds ratios were 21.3 (95% CI 5.93–103) for <30 days and 9.48 (2.47–46.8) for 30–50 days.", "limits": "Retrospective association, broad confidence intervals and selection by transplant timing; no untreated comparator or all-ICI-treatment denominator. >50 days is not a prospectively validated safe threshold.", "locator": "Primary abstract, PMID 40042053; complete publisher PDF inaccessible."}, {"key": "ipd", "design_population": "Secondary systematic review and individual-patient-data analysis: 91 recipients from 30 predominantly case reports/series and cohorts.", "selection": "Published ICI-exposed transplanted cases; not a randomized or consecutive all-treated population.", "results": "24/91 rejections (26.4%), nine recurrences and nine deaths; median follow-up 690 days. Adjusted rejection hazard ratio per additional washout week .92 (95% CI .86–.99). Ninety-four days was the median washout among modeled patients with predicted rejection probability ≤20%, not an observed universal safety cutoff.", "limits": "Publication/selection bias, heterogeneous regimens, small events and overlap with later cohorts. A modeled ≤20% probability does not justify telling an individual that three months eliminates rejection risk.", "locator": "Complete local author manuscript: Results/washout model; PDF p10 (manuscript p7) conclusion. Existing V6 quotation ledger retained."}, {"key": "fang", "design_population": "Multicenter Chinese retrospective cohort, 2018–2024: 209 ICI-exposed LT recipients.", "selection": "Prior irAEs of any grade were recorded; six patients had grade 3–4 events.", "results": "Rejection occurred in 36/209 (17.2%); 61.1% biopsy proven, median ten days after LT. Correct risks from Table 3: 21/44 (47.7%) with prior irAE versus 15/165 (9.1%) without. Any irAE adjusted OR 9.17 (95% CI 4.00–21.02); washout <30 days OR 3.071 (1.211–7.787). The six grade 3–4 cases split three with and three without rejection.", "limits": "The discussion's 58.3%/13.3% are irAE prevalence within rejection/nonrejection groups, not rejection probabilities. Too few severe irAEs to validate a grade-specific exclusion or a recovery interval.", "locator": "Complete local PDF pp5–6, Tables 3–4; avoid reversed conditional denominators."}, {"key": "aceituno", "design_population": "Ten-center ICI series, 48 recipients, propensity matched with 144 Toronto non-ICI controls; 20/48 exposed cases previously published.", "selection": "Matching used age, sex, liver disease and LT year, not tumor burden or immunosuppression. Prior ICI adverse events were not captured.", "results": "Biopsy-proven rejection 9/48 (18.8%) versus 28/144 (19.4%), P=.916. Two exposed cases were steroid resistant; one rejection-related graft failure required retransplant. Overall graft failure 2/48 versus 3/144, retransplant 2 versus zero, recurrence 5/48 versus 15/144, death 7/48 versus 21/144. Median follow-up 2.6 versus 3.2 years. Table 1 washout median 60 days, IQR 22–196.", "limits": "No detected difference is not equivalence. Substantial tumor-risk imbalance and published-case overlap. Abstract washout IQR 13–96 conflicts with Table 1 and appears to match rejection-onset timing; use table and flag discrepancy. It cannot reassure about prior irAE risk.", "locator": "Complete local PDF pp2–5, Methods and Tables 1–2."}, {"key": "litchi", "design_population": "Multinational European registry, ten centers, 18 recipients, 2018–2024.", "selection": "15 received atezolizumab–bevacizumab; 14/18 had washout >100 days. Only two centers used routine biopsy; others used clinical/LFT triggers.", "results": "Four of 18 developed biopsy-confirmed rejection (22%; 95% CI 6.4–47.6). One fatal rejection occurred 21 days after LT following 13-day washout; three other events responded to intensified immunosuppression. One HCC recurrence; one-year overall survival 77%.", "limits": "Small, noncomparative and largely long-washout cohort. Late rejection and incomplete protocol-biopsy surveillance preclude a guaranteed safe interval or extrapolation of the aggregate rate to short-washout patients.", "locator": "Primary full HTML and indexed publisher PDF Methods/Results, DOI 10.1111/liv.70692. Complete PDF download remains blocked."}, {"key": "hccjama", "design_population": "Eight-center Chinese recipient cohort, 2019–2024; initially beyond Milan; 208 ICI recipients propensity matched to 208 non-ICI recipients.", "selection": "Downstaging followed by actual transplantation; not treatment-entry randomization. Treatment was multimodal.", "results": "Median post-LT OS 4.57 versus 2.53 years, HR .63 (95% CI .43–.92); RFS 1.47 versus .89 years, HR .59 (.44–.80); recurrence subdistribution HR .54 (.40–.72). Ninety-day rejection was 34/208 (16.3%) versus 17/208 (8.2%).", "limits": "Favorable oncologic association coexists with greater rejection. Residual confounding and selection remain; there is no all-downstaging-entry ITT comparison. Possible center/year overlap with Fang and other Chinese cohorts must be checked before pooling. Abstract-only verification.", "locator": "Primary October 2026 JAMA Oncology abstract, PMID 42821267; full PDF pending."}]}}, {"id": "HCC-B4", "anchor": "hcc-b4", "title": "Survival-benefit prediction: research use only", "status": "Research use only", "steps": ["listing"], "context": "Prediction models may inform research; they do not currently determine access to a graft in this proposal.", "stance": "Give the survival-benefit score zero clinical or allocation weight now; evaluate it in research-only evaluation only.", "rules": ["Proposed decision threshold: no score-dr
