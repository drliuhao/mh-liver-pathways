er ≤8 cm.", "refs": ["H-policy"]}, {"text": "FOUR / FIVE Class 5 lesions: EACH <3 cm and combined diameter ≤8 cm.", "refs": ["H-policy"]}]}], "action": "Plan downstaging, then demonstrate viable burden within T2 size requirements.", "to": "treatment", "kind": "advance", "refs": []}, {"title": "T1: single lesion 1 to <2 cm", "criteria": [{"text": "No standardized HCC exception. For a transplant-eligible patient with decompensated cirrhosis, AASLD advises cross-sectional imaging at least every 3 months until exception criteria are met; consider immediate LRT if AFP is significantly elevated or LT is not otherwise appropriate.", "refs": ["H-aasld", "N-hcc"]}], "action": "Agree observation versus immediate treatment through MDT; do not call T1 an absolute medical contraindication.", "to": null, "kind": "hold", "refs": []}, {"title": "Beyond standardized downstaging envelope", "criteria": [{"text": "Even a favorable response requires nonstandard NLRB consideration if baseline burden was outside the standardized envelope.", "refs": ["H-policy", "N-hcc"]}], "action": "Separate medical candidacy / native MELD / donor strategy from exception eligibility.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Do not file the automatic route with unresolved Class 5 classification, disqualifying AFP or unverified baseline burden. These are route exclusions, not universal permanent medical contraindications.", "refs": ["H-policy"]}], "issues": ["lesion-counting", "beyond-downstaging"]}, {"id": "treatment", "title": "Bridge or downstage", "question": "What treatment intent and response assessment will protect the transplant route?", "owner": "IR · radiation oncology · hepatology · oncology", "timing": "Before LRT; reassess after treatment", "orders": [{"label": "Treatment planning", "items": [{"text": "Specify bridge versus downstaging; document anatomy, liver reserve, anticipated wait and modality rationale.", "refs": ["H-aasld"]}, {"text": "Record dates of LRT and all nsions receive MMaT−3. Verify current policy at filing.", "refs": ["H-policy"]}]}, {"label": "Clinical safety — a separate decision", "items": [{"text": "Complete the center’s medical, cardiopulmonary, infectious, functional and psychosocial evaluation. An exception does not establish surgical fitness.", "refs": ["H-policy"]}, {"text": "For ICI exposure: agent, last dose, toxicity history and transplant/pharmacy risk plan; distinguish exception consideration from rejection safety.", "refs": ["N-hcc", "H-aasld"]}]}], "branches": [{"title": "Both tracks cleared", "criteria": [{"text": "Transplant selection accepts medical candidacy and coordinator verifies the correct exception route; pending issues have explicit disposition.", "refs": ["H-policy"]}], "action": "List/maintain candidacy and schedule surveillance.", "to": "waitlist", "kind": "advance", "refs": []}, {"title": "An approval or safety assessment is missing", "criteria": [{"text": "A favorable tumor response does not replace transplant selection or resolve ICI-related risk.", "refs": ["H-aasld"]}], "action": "Hold activation/filing as appropriate; assign an owner and review date.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Do not treat a pending exception, unapproved local deviation or an unresolved major safety issue as clearance to transplant.", "refs": ["H-policy"]}], "issues": ["checkpoint", "ownership"]}, {"id": "waitlist", "title": "Reassess to transplant", "question": "Does the candidate still satisfy clinical and allocation requirements?", "owner": "Transplant MDT · coordinator", "timing": "At each extension, new finding and organ-offer review", "orders": [{"label": "Renewal and final review", "items": [{"text": "Updated multiphase CT/MRI tumor stage, AFP and treatment details for extension. Chest CT is not mandated for every HCC extension; order clinically indicated metastatic reassessment.", "refs": ["H-policy"]}, {"text": "Review liver reserve, infection, new treatment exposure fy anatomy rather than applying the hilar protocol by default.", "refs": ["C-aasld"]}], "action": "Use the appropriate cancer roadmap or diagnostic MDT.", "to": null, "kind": "hold", "refs": []}], "stops": [], "issues": ["anatomy"]}, {"id": "diagnosis", "title": "Diagnose without seeding", "question": "Can the diagnosis and nodal stage be established without traversing the primary?", "owner": "Advanced GI · transplant/HPB surgery", "timing": "Before EUS-guided or percutaneous sampling", "orders": [{"label": "Primary-stricture workup", "items": [{"text": "ERCP cholangiography with brush cytology, FISH/aneuploidy assessment and intraductal biopsy as clinically appropriate; plan drainage with the treating team.", "refs": ["C-aasld", "P-policy"]}, {"text": "Interpret CA 19-9 after addressing cholangitis/obstruction; >100 U/mL is a policy diagnostic alternative only in the absence of cholangitis.", "refs": ["P-policy", "C-aasld"]}]}, {"label": "Nodal staging", "items": [{"text": "Consider EUS sampling of suspicious regional lymph nodes without passing through the primary tumor. Record exactly what was sampled and the needle path.", "refs": ["P-policy"]}]}], "branches": [{"title": "Malignant-appearing stricture + ≥1 policy criterion", "criteria": [{"text": "At least ONE diagnostic alternative:", "refs": ["P-policy"], "children": [{"text": "Biopsy or cytology demonstrates malignancy.", "refs": ["P-policy"]}, {"text": "CA 19-9 >100 U/mL, in the absence of cholangitis.", "refs": ["P-policy"]}, {"text": "Aneuploidy.", "refs": ["P-policy"]}, {"text": "Hilar mass <3 cm in radial diameter.", "refs": ["P-policy"]}]}], "action": "Check size, resectability and dissemination criteria.", "to": "phenotype", "kind": "advance", "refs": []}, {"title": "Suspicion remains but criteria are incomplete", "criteria": [{"text": "Negative brushing does not exclude CCA. Review repeat intraductal sampling / interval evaluation in MDT.", "refs": ["C-aasld"]}], "action": "Do not pursue a transperito ver adenomatosis (greater than 10 HA)", "quote": true, "locator": "Third alternative"}, {"ref": "A-easl", "text": "Clinical guidelines generally favor conventional management; exceptional allocation consideration does not make LT first-line.", "quote": false, "locator": ""}], "proposal": "Show all four alternatives separately. Require all three components only for the fourth alternative; maintain a separate clinical benefit-risk review.", "rationale": "The older pathway over-compressed the guidance into a single complication/risk combination.", "owners": "Transplant hepatology · coordinator", "record": "HCA G3 / G5", "status": "Discussion required — not ratified"}, {"id": "transformation", "question": "When should suspected transformation move to a malignant-tumor pathway?", "comparisons": [{"ref": "A-easl", "text": "Biopsy may be considered within a benign liver tumour MDT to exclude malignancy.", "quote": true, "locator": "PDF p.9"}, {"ref": "H-policy", "text": "HCC exception qualification has its own diagnostic and staging requirements.", "quote": false, "locator": ""}], "proposal": "Resolve malignancy through MDT/pathology and choose the appropriate cancer/allocation route; do not assume an HCC exception from an adenoma label.", "rationale": "Clinical transformation concern and formal cancer qualification are distinct.", "owners": "Pathology · hepatology · transplant surgery", "record": "HCA G4", "status": "Discussion required — not ratified"}, {"id": "benefit", "question": "Will the local program impose an exon-specific molecular restriction?", "comparisons": [{"ref": "N-hca", "text": "Unresectable adenoma with β-catenin mutation", "quote": true, "locator": "Second alternative"}, {"ref": "A-molecular", "text": "Molecular risk is heterogeneous; exon-specific risk information can inform but does not rewrite NLRB guidance.", "quote": false, "locator": ""}], "proposal": "If the group chooses a narrower molecular rule, record its rationale and label it institutional rather than OPTN/NLRB mandated.", "rationale": "A prognostic refinement should not silently become an allocation rule.", "owners": "Molecular pathology · transplant governance", "record": "HCA G5", "status": "Discussion required — not ratified"}, {"id": "ownership", "question": "Who owns waiting-list complication management and long-term follow-up?", "comparisons": [{"ref": "N-hca", "text": "Guidance describes exceptional indications and score consideration, not a universal post-LT follow-up schedule.", "quote": false, "locator": ""}, {"ref": "A-easl", "text": "Management depends on bleeding, growth, subtype and clinical context.", "quote": false, "locator": ""}], "proposal": "Assign surveillance and urgent-bleeding contacts, explant review and underlying-disease follow-up owners.", "rationale": "A rare indication still requires an explicit operational handoff.", "owners": "Transplant team · hepatology · metabolic service", "record": "HCA G6", "status": "Discussion required — not ratified"}], "protocol": "/mh-liver-pathways/transplant/protocols/hca_v3_protocol.docx", "docs": [{"label": "Decision document", "url": "/mh-liver-pathways/transplant/docs/07_Hepatic_Adenoma_Alignment_Meeting_Decision_Document_2026-10-16_v3.docx"}, {"label": "Alignment worksheet", "url": "/mh-liver-pathways/transplant/docs/07_Hepatic_Adenoma_Guideline_Alignment_Worksheet_2026-10-16_v3.docx"}]}], "sources": {"H-policy": {"short": "OPTN 9.5.I", "title": "OPTN Policies — HCC standardized exception", "kind": "Allocation policy", "locator": "Effective October 1, 2026 · §§9.5.I.i–vii · pp.196–200", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=196", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=196", "note": "Policy determines exception eligibility, not whether transplantation is the best clinical treatment. Class 5 now explicitly includes eligible LI-RADS 5 CT/MRI/CEUS or biopsy pathways."}, "P-policy": {"short": "OPTN 9.5.A", "title": "OPTN Policies — hilar CCA standardized exception", "kind": "Allocation policy", "locator": "Effective October 1, 2026 · §9.5.A · pp.190–191", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=190", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/optn_policies.pdf#page=190", "note": "Requires an approved written center protocol, neoadjuvant therapy and operative staging. The mass threshold is strictly <3 cm in radial diameter."}, "N-hcc": {"short": "NLRB · HCC", "title": "Adult MELD exception review guidance — HCC", "kind": "NLRB guidance", "locator": "December 2025 · HCC section · pp.2–4", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=2", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=2", "note": ""}, "N-icca": {"short": "NLRB · iCCA", "title": "Adult MELD exception review guidance — iCCA / mixed HCC-iCCA", "kind": "NLRB guidance", "locator": "December 2025 · pp.7–8", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=7", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=7", "note": ""}, "N-crlm": {"short": "NLRB · CRLM", "title": "Adult MELD exception review guidance — CRLM", "kind": "NLRB guidance", "locator": "December 2025 · pp.9–10, including timing/progression footnotes", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=9", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=9", "note": "Nonstandard consideration, not an automatic exception. The >10% progression footnote must not be presented as the usual RECIST 1.1 progression definition."}, "N-net": {"short": "NLRB · NET", "title": "Adult MELD exception review guidance — NET", "kind": "NLRB guidance", "locator": "December 2025 · pp.8–9", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=8", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=8", "note": ""}, "N-hehe": {"short": "NLRB · HEHE", "title": "Adult MELD exception review guidance — HEHE", "kind": "NLRB guidance", "locator": "December 2025 · pp.10–11", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=10", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=10", "note": ""}, "N-hca": {"short": "NLRB · HCA", "title": "Adult MELD exception review guidance — hepatic adenoma", "kind": "NLRB guidance", "locator": "December 2025 · p.11", "url": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=11", "pdf": "https://www.hrsa.gov/sites/default/files/hrsa/optn/adult-meld-exception-transplant-oncology-review-guidance.pdf#page=11", "note": ""}, "H-aasld": {"short": "AASLD · HCC", "title": "AASLD Practice Guidance: prevention, diagnosis, and treatment of HCC", "kind": "Clinical guidance", "locator": "2023 · diagnosis pp.11–13; resection pp.15–18; transplant pp.19–23 (PDF pages)", "url": "https://doi.org/10.1097/HEP.0000000000000466", "pdf": "https://doi.org/10.1097/HEP.0000000000000466", "note": "The transplant/diagnostic sections are cited here. Systemic treatment updates belong in the linked cancer roadmap, not this transplant checklist."}, "C-aasld": {"short": "AASLD · CCA", "title": "AASLD Practice Guidance on PSC and cholangiocarcinoma", "kind": "Clinical guidance", "locator": "2023 · pCCA diagnosis / transplantation · PDF pp.26–28; iCCA treatment section", "url": "https://doi.org/10.1002/hep.32771", "pdf": "https://doi.org/10.1002/hep.32771", "note": ""}, "P-cohort": {"short": "pCCA · multicenter", "title": "Neoadjuvant chemoradiation followed by LT for perihilar CCA: 12-center experience", "kind": "Cohort evidence", "locator": "Darwish Murad et al. · Gastroenterology · 2012", "url": "https://doi.org/10.1053/j.gastro.2012.04.008", "pdf": "https://doi.org/10.1053/j.gastro.2012.04.008", "note": ""}, "I-cohort": {"short": "Very-early iCCA", "title": "Liver transplantation for very early iCCA: international retrospective study", "kind": "Cohort evidence", "locator": "Sapisochin et al. · Hepatology · 2016", "url": "https://doi.org/10.1002/hep.28744", "pdf": "https://doi.org/10.1002/hep.28744", "note": ""}, "C-consensus": {"short": "IHPBA · CRLM", "title": "Liver transplantation for non-resectable CRLM: IHPBA consensus guidelines", "kind": "Expert consensus", "locator": "2021 · resectability / selection pp.3–5; response assessment pp.7–8 (PDF pages)", "url": "https://doi.org/10.1016/S2468-1253(21)00219-3", "pdf": "https://doi.org/10.1016/S2468-1253(21)00219-3", "note": ""}, "C-transmet": {"short": "TransMet · RCT", "title": "Liver transplantation plus chemotherapy versus chemotherapy alone: TransMet", "kind": "Randomized trial", "locator": "Adam et al. · Lancet · 2024", "url": "https://doi.org/10.1016/S0140-6736(24)01595-2", "pdf": "https://doi.org/10.1016/S0140-6736(24)01595-2", "note": "Trial selection and outcomes support a selected permanently unresectable population; trial eligibility is not interchangeable with NLRB guidance."}, "NET-milan": {"short": "Milan-NET · cohort", "title": "The long-term benefit of liver transplantation for hepatic metastases from NETs", "kind": "Cohort evidence", "locator": "Mazzaferro et al. · AJT · 2016 · Table 1, PDF p.2", "url": "https://doi.org/10.1111/ajt.13831", "pdf": "https://doi.org/10.1111/ajt.13831", "note": "Nonrandomized selected cohort. Milan-NET age and burden criteria are not identical to all NLRB wording."}, "E-consensus": {"short": "EHE · consensus", "title": "Epithelioid hemangioendothelioma: international consensus", "kind": "Expert consensus", "locator": "ESMO Open · 2021 · liver-specific / transplant management", "url": "https://doi.org/10.1016/j.esmoop.2021.100170", "pdf": "https://doi.org/10.1016/j.esmoop.2021.100170", "note": ""}, "E-score": {"short": "HEHE-LT · cohort", "title": "HEHE and adult LT: a prognostic score based on the ELTR-ELITA registry", "kind": "Cohort evidence", "locator": "Lai et al. · Transplantation · 2017", "url": "https://doi.org/10.1097/TP.0000000000001603", "pdf": "https://doi.org/10.1097/TP.0000000000001603", "note": "Retrospective prognostic model. Some variables are established pathologically; do not assume they are all reliably known before transplant."}, "A-easl": {"short": "EASL · benign tumors", "title": "EASL Clinical Practice Guidelines on benign liver tumours", "kind": "Clinical guidance", "locator": "2016 · HCA management / multiple lesions · PDF pp.9–10", "url": "https://doi.org/10.1016/j.jhep.2016.04.001", "pdf": "https://doi.org/10.1016/j.jhep.2016.04.001", "note": ""}, "A-molecular": {"short": "HCA · molecular", "title": "Molecular classification of HCA associates with bleeding and malignant transformation", "kind": "Cohort evidence", "locator": "Nault et al. · Gastroenterology · 2017", "url": "https://doi.org/10.1053/j.gastro.2016.11.042", "pdf": "https://doi.org/10.1053/j.gastro.2016.11.042", "note": "Molecular risk stratification informs clinical judgment. A local exon-specific threshold is not the NLRB wording."}}, "pathway": {"slug": "crlm", "code": "CRLM", "name": "Colorectal liver metastases", "route": "Nonstandard review · NLRB guidance", "entry": "Liver-limited colorectal adenocarcinoma without a feasible curative liver resection route; biology and timing matter.", "roadmap": "https://drliuhao.github.io/mh-liver-pathways/crlm/", "steps": [{"id": "map-disease", "title": "Map disease", "question": "Are the primary, liver burden and extrahepatic distribution established?", "owner": "Colorectal oncology · radiology · HPB surgery", "timing": "At referral; preserve pretreatment imaging", "orders": [{"label": "Anatomic baseline", "items": [{"text": "Primary pathology: colorectal adenocarcinoma. Retrieve baseline liver imaging, maximum pretreatment lesion diameter and prior resections/ablations.", "refs": ["N-crlm"]}, {"text": "Contrast CT chest/abdomen/pelvis and high-quality liver MRI or fine-cut multiphase CT to map all sites and operative anatomy.", "refs": ["C-consensus"]}]}, {"label": "Primary status", "items": [{"text": "Record primary resection date/margins, local recurrence assessment, and whether presentation was synchronous.", "refs": ["N-crlm"]}]}], "branches": [{"title": "Potentially liver-limited CRLM", "criteria": [{"text": "Known primary and mapped hepatic disease; no confirmed excluded extrahepatic site.", "refs": ["N-crlm"]}], "action": "Obtain molecular/biomarker profile and a formal clearance review.", "to": "biology", "kind": "advance", "refs": []}, {"title": "Indeterminate extrahepatic lesion", "criteria": [{"text": "Clarify with targeted imaging, interval assessment or tissue when it would change management.", "refs": ["C-consensus"]}], "action": "Do not call the patient liver-only until the finding is adjudicated.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Extrahepatic disease after primary resection, including nodes outside the primary lymph-node field, or local primary relapse excludes the described NLRB route.", "refs": ["N-crlm"]}], "issues": ["unresectability"]}, {"id": "biology", "title": "Define biology", "question": "Does the molecular and biomarker profile fit this review pathway?", "owner": "Oncology · molecular pathology", "timing": "Before transplant-directed selection", "orders": [{"label": "Molecular tests", "items": [{"text": "Obtain BRAF and MSI/MMR results; document RAS for treatment planning and prognosis.", "refs": ["N-crlm", "C-consensus"]}]}, {"label": "Biomarker and baseline burden", "items": [{"text": "CEA with dates/trend; record whether any liver lesion was >10 cm before treatment.", "refs": ["N-crlm"]}]}], "branches": [{"title": "Guidance profile satisfied", "criteria": [{"text": "BRAF wild type and microsatellite stable; no pretreatment lesion >10 cm.", "refs": ["N-crlm"]}, {"text": "CEA does not breach the guidance exclusion; an exact value of 80 needs explicit interpretation because initial and extension language differ.", "refs": ["N-crlm"]}], "action": "Review whether complete nontransplant clearance remains infeasible.", "to": "unresectability", "kind": "advance", "refs": []}, {"title": "MSI-H/dMMR or BRAF-mutant", "criteria": [{"text": "Not the molecular population described in the NLRB CRLM guidance.", "refs": ["N-crlm"]}], "action": "Use the colorectal cancer roadmap for molecularly appropriate therapy; any transplant proposal is a separate route.", "to": null, "kind": "redirect", "refs": []}], "stops": [{"text": "CEA >80 µg/L is an NLRB exclusion. A favorable trend does not automatically override that guidance threshold.", "refs": ["N-crlm"]}], "issues": ["molecular-gates", "cea-progression"]}, {"id": "unresectability", "title": "Prove unresectability", "question": "Can an expert liver team clear all clinically relevant disease without replacing the liver?", "owner": "HPB liver surgeon · transplant surgeon · radiology · IR", "timing": "At baseline and again after response", "orders": [{"label": "Technical clearance review", "items": [{"text": "Review baseline and current lesion maps side by side; assess parenchymal-sparing/staged resection, combined ablation and remnant augmentation where appropriate.", "refs": ["C-consensus"]}, {"text": "Record the anatomical reason complete clearance is not feasible: distribution, remnant quality/volume, inflow/outflow or biliary constraints—not lesion count alone.", "refs": ["C-consensus"]}]}, {"label": "Treated / disappearing lesions", "items": [{"text": "Record original and current sites separately. Complete imaging response is a favorable biology pattern in the consensus; it does not by itself settle the clinical indication for transplantation.", "refs": ["C-consensus"]}]}], "branches": [{"title": "Complete safe nontransplant clearance feasible", "criteria": [{"text": "An expert HPB plan can address the relevant disease while preserving adequate functional liver.", "refs": ["C-consensus"]}], "action": "Prefer the curative resection/ablation pathway in the cancer roadmap.", "to": null, "kind": "redirect", "refs": []}, {"title": "No feasible curative clearance route", "criteria": [{"text": "Unresectability persists after expert reassessment, with the reasons documented. NLRB text also addresses recurrence after liver resection.", "refs": ["N-crlm", "C-consensus"]}], "action": "Continue disease-control therapy and observation.", "to": "control", "kind": "advance", "refs": []}, {"title": "Only scars / disappearing lesions or disputed viability", "criteria": [{"text": "Neither a nonenhancing scar alone nor a negative PET establishes a transplant indication. The whole disease map and resectability assessment must be adjudicated.", "refs": ["C-consensus"]}], "action": "Discuss the lesion-level uncertainty; do not invent a minimum RECIST-measurable burden requirement.", "to": null, "kind": "hold", "refs": []}], "stops": [], "issues": ["unresectability", "treated-lesions"]}, {"id": "control", "title": "Treat and observe", "question": "Has the disease shown the required sustained control during therapy?", "owner": "Oncology · HPB surgery · radiology", "timing": "During systemic/LRT treatment and each restaging", "orders": [{"label": "Treatment record", "items": [{"text": "Document first-line systemic treatment, subsequent therapy, LRT, response and toxicity; use the cancer roadmap for regimen selection.", "refs": ["N-crlm", "C-consensus"]}, {"text": "Build ≥6 months of stable or regressing disease during systemic and/or locoregional therapy, with dated scans. Reassess resectability when response creates an opportunity.", "refs": ["N-crlm", "C-consensus"]}]}], "branches": [{"title": "Sustained control documented", "criteria": [{"text": "The full ≥6-month interval is supported and no extrahepatic disease has appeared.", "refs": ["N-crlm"]}], "action": "Verify primary clearance and all calendar milestones.", "to": "clocks", "kind": "advance", "refs": []}, {"title": "Favorable response but short observation", "criteria": [{"text": "A trial-specific response interval does not replace the current NLRB six-month control requirement.", "refs": ["N-crlm", "C-transmet"]}], "action": "Continue observation and multidisciplinary reassessment.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Progressive disease prevents routine advancement. The NLRB footnote uses >10% growth of existing lesion diameter or any new lesion; it should not be mislabeled as ordinary RECIST 1.1 progression.", "refs": ["N-crlm"]}], "issues": ["control-clock", "cea-progression"]}, {"id": "clocks", "title": "Verify primary and clocks", "question": "Are the primary-tumor clearance and timing requirements all met?", "owner": "Colorectal surgery · coordinator · oncology", "timing": "Before transplant-grade restaging / request", "orders": [{"label": "Core milestones", "items": [{"text": "R0 primary resection; ≥12 months from CRLM diagnosis to initial request.", "refs": ["N-crlm"]}, {"text": "Colonoscopy within 12 months before the initial request, with no local recurrence.", "refs": ["N-crlm"]}]}, {"label": "Synchronous presentation — additional wording", "items": [{"text": "Primary resection >6 months after initial diagnosis.", "refs": ["N-crlm"]}, {"text": "At least 6 months of chemotherapy after primary resection before request.", "refs": ["N-crlm"]}, {"text": "At least 12 months total stability after initial diagnosis.", "refs": ["N-crlm"]}, {"text": "Record the actual sequence. Do not delay appropriate primary treatment just to fit a transplant clock; seek interpretation for a different sequence.", "refs": ["C-consensus", "N-crlm"]}]}], "branches": [{"title": "All applicable clocks and primary clearance verified", "criteria": [{"text": "Dates, margin report, colonoscopy and stability evidence reconcile to the same timeline.", "refs": ["N-crlm"]}], "action": "Schedule the timed transplant-grade imaging window.", "to": "restaging", "kind": "advance", "refs": []}, {"title": "Synchronous timing does not fit / unclear origin", "criteria": [{"text": "A differently timed primary resection is not automatically equivalent to the wording of the guidance.", "refs": ["N-crlm"]}], "action": "Obtain allocation leadership interpretation / individual review rather than attest compliance.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Local primary relapse or unaddressed residual primary disease excludes routine progression to this review route.", "refs": ["N-crlm"]}], "issues": ["primary-clocks"]}, {"id": "restaging", "title": "Restage for transplant", "question": "Do current imaging and biomarker results confirm the liver-limited phenotype?", "owner": "Radiology · nuclear medicine · oncology · coordinator", "timing": "Within the initial-request imaging window", "orders": [{"label": "Timed imaging", "items": [{"text": "CT/MRI chest, abdomen and pelvis AND PET within 1 month of the initial request. PET is specified after ≥4 weeks off chemotherapy. Coordinate any treatment pause with oncology.", "refs": ["N-crlm"]}]}, {"label": "Interpretation", "items": [{"text": "Reconcile PET findings with anatomic imaging, CEA and the primary-site record. ctDNA does not replace these required tests.", "refs": ["N-crlm", "C-consensus"]}]}], "branches": [{"title": "No extrahepatic disease or local recurrence", "criteria": [{"text": "Required studies are current and the previously documented control/clinical criteria remain satisfied.", "refs": ["N-crlm"]}], "action": "Prepare nonstandard submission and renewal plan.", "to": "review", "kind": "advance", "refs": []}, {"title": "Equivocal PET / cannot safely pause therapy", "criteria": [{"text": "Do not declare a negative study or omit the specified timing without review.", "refs": ["N-crlm"]}], "action": "Clarify the finding or obtain an explicit alternative allocation interpretation.", "to": null, "kind": "hold", "refs": []}], "stops": [{"text": "Confirmed extrahepatic disease after primary resection or local relapse excludes this guidance-aligned route.", "refs": ["N-crlm"]}], "issues": ["restaging"]}, {"id": "review", "title": "Submit and maintain", "question": "Are clinical acceptance, exception review and surveillance separately assigned?", "owner": "Transplant physician · coordinator · oncology", "timing": "At request and every 3-month extension", "orders": [{"label": "Review packet", "items": [{"text": "Include histology/molecular results, primary R0 report, unresectability assessment, baseline burden, all clocks and current imaging/CEA. Guidance supports MMaT−20, with floor 15.", "refs": ["N-crlm"]}]}, {"label": "Extension evidence", "items": [{"text": "Every 3 months: CT/MRI chest/abdomen/pelvis and CEA; no hepatic progression or extrahepatic disease, and CEA <80 µg/L.", "refs": ["N-crlm"]}]}], "branches": [{"title": "Clinical and allocation reviews satisfactory", "criteria": [{"text": "The team accepts clinical candidacy; NLRB disposition and updated evidence are recorded independently.", "refs": ["N-crlm"]}], "action": "Continue surveillance through final pretransplant review.", "to": "transplant", "kind": "advance", "refs": []}, {"title": "Pending review or borderline renewal", "criteria": [{"text": "A score recommendation is not an entitlement to transplant. Resolve exact CEA 80 or ambiguous progression explicitly.", "refs": ["N-crlm"]}], "action": "Hold routine renewal/activation as appropriate and document the decision.",
